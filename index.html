function RoadmapCard({ card, draggable, editing, onDragStart, onDragEnd, onStartEdit, onTitleChange, onCommit, onRemove }) {
  const tier = RM_TIER[card.tier] || RM_TIER["Big Bet"];
  return (
    <div
      draggable={draggable && !editing}
      onDragStart={onDragStart}
      onDragEnd={onDragEnd}
      style={{ border: `1px solid ${tier.border}`, background: "#fff", borderRadius: 12, padding: 12, display: "flex", flexDirection: "column", gap: 10, cursor: draggable && !editing ? "grab" : "default" }}>
      {Array.isArray(card.prios) && card.prios.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {card.prios.map((p, i) => (
            <span key={i} style={{ fontSize: 10, fontWeight: 700, color: "#7a5b00", background: "#ffe9a8", padding: "2px 7px", borderRadius: 6, whiteSpace: "nowrap" }}>Prio {p}</span>
          ))}
        </div>
      )}
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
        <span style={{ flexShrink: 0, minWidth: 30, height: 30, padding: "0 6px", borderRadius: 9999, background: tier.bg, color: tier.fg, fontWeight: 700, fontSize: 11, display: "inline-flex", alignItems: "center", justifyContent: "center" }}>{card.id}</span>
        {editing ? (
          <input
            autoFocus value={card.title}
            onChange={e => onTitleChange(e.target.value)}
            onBlur={onCommit}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); onCommit(); } }}
            style={{ flex: 1, minWidth: 0, fontSize: 12.5, fontFamily: "inherit", border: "1px solid #0063fb", borderRadius: 6, padding: "4px 6px", outline: "none" }} />
        ) : (
          <span onClick={onStartEdit} title={onStartEdit ? "Click to rename" : undefined}
            style={{ flex: 1, fontSize: 12.5, color: "#1d1d1d", lineHeight: 1.35, cursor: onStartEdit ? "text" : "default" }}>{card.title}</span>
        )}
        {onRemove && !editing && (
          <button className="press" onClick={(e) => { e.stopPropagation(); onRemove(); }} aria-label="Remove card"
            style={{ flexShrink: 0, width: 20, height: 20, borderRadius: 9999, border: 0, background: "#f0f0f3", color: "#6b6b6b", cursor: "pointer", fontSize: 13, lineHeight: 1, display: "inline-flex", alignItems: "center", justifyContent: "center" }}>×</button>
        )}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
        <span style={{ fontSize: 10.5, fontWeight: 700, color: tier.fg, background: tier.bg, padding: "2px 8px", borderRadius: 9999 }}>{card.tier}</span>
        {(card.owners || []).map(o => {
          const oc = RM_OWNER[o] || { bg: "#888", fg: "#fff" };
          return <span key={o} style={{ fontSize: 10, fontWeight: 700, color: oc.fg, background: oc.bg, padding: "2px 7px", borderRadius: 9999 }}>{o}</span>;
        })}
        {card.jira
          ? <a className="jira-chip" href={RM_JIRA_BASE + card.jira} target="_blank" rel="noopener noreferrer" draggable={false} onClick={e => e.stopPropagation()}>{card.jira}</a>
          : <span className="jira-missing">needs ticket</span>}
      </div>
    </div>
  );
}

function RoadmapView({ cards = ROADMAP_CARDS, onMove, onAdd, onEditTitle, onRemove, onReset, cloudStatus, cloudLastSyncedAt }) {
  const COLW = 248, GAP = 16;
  const n = ROADMAP_STEPS.length;
  const gridW = n * COLW + (n - 1) * GAP;
  const editable = !!onMove;
  const cardsFor = (lane, step) => cards.filter(c => c.lane === lane && c.step === step);
  const dragUid = useRef(null);
  const [dropKey, setDropKey] = useState(null);
  const [editingUid, setEditingUid] = useState(null);
  const dropOn = (lane, step) => (e) => {
    e.preventDefault();
    setDropKey(null);
    const uid = dragUid.current || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
    if (uid && onMove) onMove(uid, lane, step);
    dragUid.current = null;
  };
  return (
    <div style={{ width: "100%", maxWidth: "100%", overflowX: "auto", WebkitOverflowScrolling: "touch", background: "#fff", padding: "8px 16px 24px" }}>
      <div style={{ width: gridW, minWidth: gridW, boxSizing: "border-box", display: "flex", flexDirection: "column", gap: 14 }}>
        {editable && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <span style={{ fontSize: 12, color: "#6b6b6b" }}>Drag cards between lanes · click a title to rename · “+ Add card” to create</span>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              {cloudStatus !== undefined && <CloudStatusPill status={cloudStatus} lastSyncedAt={cloudLastSyncedAt} />}
              {onReset && <button onClick={onReset} style={{ appearance: "none", border: "1px solid #e0e0e0", background: "#fff", borderRadius: 999, padding: "6px 12px", fontSize: 12, fontWeight: 600, color: "#6b6b6b", cursor: "pointer", fontFamily: "inherit" }}>Reset</button>}
            </div>
          </div>
        )}
        <div style={{ background: "#4c7ef3", color: "#fff", borderRadius: 10, padding: "14px 18px", textAlign: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>Lift agentic apply completion from 39% → 50%+</div>
          <div style={{ fontSize: 12, opacity: 0.95, marginTop: 3 }}>Outcome · view form → confirmation · guardrail: satisfaction ≥ 4/5</div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${n}, ${COLW}px)`, gap: GAP }}>
          {ROADMAP_STEPS.map(s => (
            <div key={s.n} style={{ background: "#eaf2ff", borderRadius: 8, padding: "10px 12px", textAlign: "center", fontWeight: 700, fontSize: 12, color: "#1d3a6b" }}>{s.n}. {s.title}</div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${n}, ${COLW}px)`, gap: GAP }}>
          {ROADMAP_OPPS.map((o, i) => (
            <div key={i} style={{ gridColumn: `span ${o.span}`, background: "#fdf3c8", borderRadius: 8, padding: "10px 12px", textAlign: "center" }}>
              <div style={{ fontWeight: 700, fontSize: 12, color: "#5c4a05" }}>{o.title}</div>
              {o.sub && <div style={{ fontSize: 11, color: "#6b5a13", marginTop: 2 }}>{o.sub}</div>}
            </div>
          ))}
        </div>
        {ROADMAP_LANES.map(lane => (
          <div key={lane} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ background: "#bfe6cb", borderRadius: 8, padding: "6px 12px", textAlign: "center", fontWeight: 700, fontSize: 12, color: "#1f5b34", textTransform: "uppercase", letterSpacing: 0.6 }}>{RM_LANE_LABEL[lane] || lane}</div>
            <div style={{ display: "grid", gridTemplateColumns: `repeat(${n}, ${COLW}px)`, gap: GAP, alignItems: "start" }}>
              {ROADMAP_STEPS.map(s => {
                const key = lane + "#" + s.n;
                return (
                  <div key={s.n}
                    onDragOver={editable ? (e) => { e.preventDefault(); if (dropKey !== key) setDropKey(key); } : undefined}
                    onDragLeave={editable ? () => setDropKey(k => (k === key ? null : k)) : undefined}
                    onDrop={editable ? dropOn(lane, s.n) : undefined}
                    style={{ display: "flex", flexDirection: "column", gap: 10, minHeight: 48, borderRadius: 10, padding: 4, outline: dropKey === key ? "2px dashed #0063fb" : "2px dashed transparent", outlineOffset: -2, background: dropKey === key ? "#f4f8ff" : "transparent", transition: "background 120ms" }}>
                    {cardsFor(lane, s.n).map(c => (
                      <RoadmapCard key={c.uid} card={c}
                        draggable={editable}
                        editing={editingUid === c.uid}
                        onDragStart={(e) => { dragUid.current = c.uid; try { e.dataTransfer.setData("text/plain", c.uid); e.dataTransfer.effectAllowed = "move"; } catch (_) {} }}
                        onDragEnd={() => { dragUid.current = null; setDropKey(null); }}
                        onStartEdit={editable ? () => setEditingUid(c.uid) : undefined}
                        onTitleChange={(v) => onEditTitle && onEditTitle(c.uid, v)}
                        onCommit={() => setEditingUid(null)}
                        onRemove={editable ? () => onRemove && onRemove(c.uid) : undefined}
                      />
                    ))}
                    {editable && onAdd && (
                      <button className="press"
                        onClick={() => { const uid = onAdd(lane, s.n); if (uid) setEditingUid(uid); }}
                        style={{ marginTop: 2, border: "1px dashed #cfd6e4", background: "transparent", color: "#6b7280", borderRadius: 8, padding: "6px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>+ Add card</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

  const d = METRICS_DATA;
  const maxFunnel = d.funnel[0].count;
  const maxCtr    = Math.max(...d.ctr.map(c => c.value));
  const fmt = (n) => n.toLocaleString("en-US");
  const pct = (n) => (n * 100).toFixed(1) + "%";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 36, paddingTop: 8 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>

        </div>

          {fmt(d.funnel[0].count)} ad views · {fmt(d.funnel[4].count)} confirmations<br/>

        </div>

      {/* ── Funnel ───────────────────────────────────────────────────── */}
      <section>
        <h3 style={{ margin: "0 0 14px", fontSize: 16, fontWeight: 700, color: "#1d1d1d", letterSpacing: -0.2 }}>
          Funnel — Ad view to confirmation
        </h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {d.funnel.map((step, i) => {
            const width = (step.count / maxFunnel) * 100;
            const conv = i === 0 ? 1 : step.count / d.funnel[0].count;
            return (
              <div key={step.id} style={{
                display: "grid",
                gridTemplateColumns: "160px 1fr 80px 64px",
                alignItems: "center",
                gap: 12,
                fontSize: 13,
              }}>
                <span style={{ color: "#1d1d1d", fontWeight: 600 }}>{step.label}</span>
                <div style={{ position: "relative", height: 28, background: "#f5f5f7", borderRadius: 6, overflow: "hidden" }}>
                  <div style={{
                    position: "absolute", inset: 0,
                    width: width + "%",
                    background: "linear-gradient(90deg, #0063fb 0%, #4a8bff 100%)",
                    borderRadius: 6,
                    transition: "width 600ms cubic-bezier(.2,.9,.3,1)",
                  }} />
                </div>
                <span style={{ color: "#6b6b6b", fontVariantNumeric: "tabular-nums", textAlign: "right" }}>
                  {fmt(step.count)}
                </span>
                <span style={{
                  color: i === 0 ? "#6b6b6b" : (conv > 0.5 ? "#1f8a3b" : conv > 0.15 ? "#c47a00" : "#b8403a"),
                  fontWeight: 600,
                  fontVariantNumeric: "tabular-nums",
                  textAlign: "right",
                }}>
                  {i === 0 ? "100%" : pct(conv)}
                </span>
              </div>
            );
          })}
        </div>
      </section>

      {/* ── Step-over-step vs targets ────────────────────────────────── */}
      <section>
        <h3 style={{ margin: "0 0 6px", fontSize: 16, fontWeight: 700, color: "#1d1d1d", letterSpacing: -0.2 }}>
          Conversion at each step
        </h3>
        <p style={{ margin: "0 0 14px", color: "#6b6b6b", fontSize: 13 }}>
          Where each design decision should focus. The "Review → Confirmation" gap is the biggest single lever.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {d.steps.map(s => {
            const widthCur = (s.current / 1) * 100;
            const widthTar = (s.target  / 1) * 100;
            const gap = s.target - s.current;
            return (
              <div key={s.label} style={{ border: "1px solid var(--hair)", borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, marginBottom: 8 }}>
                  <strong style={{ fontSize: 14, color: "#1d1d1d" }}>{s.label}</strong>
                  <span style={{ fontSize: 12, color: "#6b6b6b", fontVariantNumeric: "tabular-nums" }}>
                    <span style={{ color: "#1d1d1d", fontWeight: 600 }}>{pct(s.current)}</span>
                    {" → "}
                    <span style={{ color: "#0063fb", fontWeight: 600 }}>{pct(s.target)}</span>
                    {gap > 0 && <span style={{ color: "#1f8a3b", marginLeft: 6 }}>+{pct(gap)}</span>}
                  </span>
                </div>
                <div style={{ position: "relative", height: 10, background: "#f5f5f7", borderRadius: 5, overflow: "hidden" }}>
                  {/* Target bar — light blue background */}
                  <div style={{
                    position: "absolute", left: 0, top: 0, bottom: 0,
                    width: widthTar + "%",
                    background: "#eaf2ff",
                    borderRadius: 5,
                  }} />
                  {/* Current bar — solid blue overlay */}
                  <div style={{
                    position: "absolute", left: 0, top: 0, bottom: 0,
                    width: widthCur + "%",
                    background: "#0063fb",
                    borderRadius: 5,
                    transition: "width 600ms cubic-bezier(.2,.9,.3,1)",
                  }} />
                </div>
                <p style={{ margin: "8px 0 0", color: "#6b6b6b", fontSize: 12 }}>{s.note}</p>
              </div>
            );
          })}
        </div>
      </section>

      {/* ── CTR comparison ──────────────────────────────────────────── */}
      <section>
        <h3 style={{ margin: "0 0 6px", fontSize: 16, fontWeight: 700, color: "#1d1d1d", letterSpacing: -0.2 }}>
          Click-through rate — Agentic vs alternatives
        </h3>
        <p style={{ margin: "0 0 14px", color: "#6b6b6b", fontSize: 13 }}>
          Agentic already beats ATS and Easy Apply at the click step. The MVP target widens the gap.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {d.ctr.map(c => {
            const width = (c.value / maxCtr) * 100;
            const bg = c.tone === "target" ? "#eaf2ff"
                     : c.tone === "good"   ? "#0063fb"
                     : "#cccccf";
            const border = c.tone === "target" ? "1.5px dashed #0063fb" : "none";
            return (
              <div key={c.label} style={{
                display: "grid",
                gridTemplateColumns: "200px 1fr 64px",
                alignItems: "center",
                gap: 12,
                fontSize: 13,
              }}>
                <span style={{ color: "#1d1d1d", fontWeight: 500 }}>{c.label}</span>
                <div style={{ position: "relative", height: 24, background: "#f5f5f7", borderRadius: 6, overflow: "hidden" }}>
                  <div style={{
                    position: "absolute", inset: 0,
                    width: width + "%",
                    background: bg,
                    border, boxSizing: "border-box",
                    borderRadius: 6,
                  }} />
                </div>
                <span style={{ color: "#1d1d1d", fontWeight: 600, fontVariantNumeric: "tabular-nums", textAlign: "right" }}>
                  {pct(c.value)}
                </span>
              </div>
            );
          })}
        </div>
      </section>

      <p style={{ margin: 0, fontSize: 12, color: "#6b6b6b", borderTop: "1px solid var(--hair)", paddingTop: 14 }}>
        <strong>Reading the funnel:</strong> only 5.5% of people who see the Agentic apply CTA finish an application today.
        The two stages that matter most are <em>Review → Confirmation</em> (47.8% today; MVP target 70%) and the upstream <em>Form load → Review</em> (65.8% today; target 80%).
        Doubling end-to-end conversion is the MVP outcome — see the Opportunity Tree for the linked solutions.
      </p>
    </div>
  );
}

function SmapNode({ x, y, w = 152, h = 44, title, sub, kind }) {
  return (
    <g className={"smap-node " + (kind || "")} transform={"translate(" + x + " " + y + ")"}>
      <rect width={w} height={h} />
      <text className="title" x={w / 2} y={h / 2 - 2} textAnchor="middle">{title}</text>

function SmapArrow({ id, x1, y1, x2, y2, kind, label, labelOffset = -6 }) {
  // Right-angle Manhattan-style path: vertical first, then horizontal.
  // For simple straight cases, draws a line.
  const sameCol = x1 === x2;
  const sameRow = y1 === y2;
  const d = sameCol || sameRow
    ? `M${x1} ${y1} L${x2} ${y2}`
    : `M${x1} ${y1} L${x1} ${(y1 + y2) / 2} L${x2} ${(y1 + y2) / 2} L${x2} ${y2}`;
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  return (
    <g>
      <path className={"smap-link " + (kind || "")} d={d} markerEnd={`url(#smap-arrow-${kind || "default"})`} />
      {label && (
        <text className={"smap-edgelabel " + (kind || "")} x={midX} y={midY + labelOffset} textAnchor="middle">
          {label}
        </text>
      )}
    </g>
  );
}

// Stable id for a story so acceptance criteria persist across drag-moves
// (the underlying story text doesn't change when you drag between releases).
function storyId(taskId, story) {
  if (story.jira) return "jira:" + story.jira;
  if (story.id) return "id:" + story.id;
  // Fallback: hash a stable subset of the story.
  const seed = (taskId || "") + ":" + (story.story || "") + ":" + (story.n || "");
  let h = 0;
  for (let i = 0; i < seed.length; i++) { h = (h * 31 + seed.charCodeAt(i)) | 0; }
  return "h:" + Math.abs(h).toString(36);
}

function SmCard({ story, release, now, draggable, onDragStart, onClick, hasAcceptance, readiness }) {
  // Readiness summary — small pill showing DoR n/4 · DoD n/4.
  const dor = readiness ? countChecks(readiness.ready, DOR_ITEMS) : 0;
  const dod = readiness ? countChecks(readiness.done,  DOD_ITEMS) : 0;
  const showReadyPill = !!readiness && (dor > 0 || dod > 0);
  const allDone = dor === DOR_ITEMS.length && dod === DOD_ITEMS.length;
  // Tooltip describes the state at a glance for keyboard / hover users.
  const readyTitle = showReadyPill
    ? "Definition of Ready " + dor + "/" + DOR_ITEMS.length +
      " · Definition of Done " + dod + "/" + DOD_ITEMS.length
    : undefined;
  return (
    <div className={"sm-card " + release + (story.feature ? " sm-card-feature" : "")}
      draggable={draggable}
      onDragStart={onDragStart}
      onClick={onClick}
      role={onClick ? "button" : undefined}
      tabIndex={onClick ? 0 : undefined}
      onKeyDown={onClick ? (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(e); } } : undefined}
      title={onClick ? "Click to view acceptance criteria" : undefined}>
      <p className="story">{story.story}</p>
      <div className="meta">
        <JiraChip jira={story.jira} />
        {now && <span className="sm-now-badge">In prototype</span>}
        {story.feature && <span className="sm-feature-pill">live feature</span>}
        {hasAcceptance && <span className="sm-ac-badge" title="Has acceptance criteria">AC ✓</span>}
        {showReadyPill && (
          <span className={"sm-ready-pill" + (allDone ? " all" : "")} title={readyTitle}>
            <span className="sm-ready-dot" aria-hidden="true" />
            {dor}/{DOR_ITEMS.length} · {dod}/{DOD_ITEMS.length}
          </span>
        )}
        {story.n != null && <span className={"ref-num " + (story.key || "pa")}>{story.n}</span>}
        {story.hyp && <span className="hyp">H {story.hyp}</span>}
      </div>
    </div>
  );
}

function AcceptanceSheet({ open, story, taskId, sid, onClose, actorName, ensureActor, onActivity }) {
  const [given, setGiven] = useState("");
  const [whenStr, setWhenStr] = useState("");
  const [thenStr, setThenStr] = useState("");
  const [ready, setReady] = useState({}); // { [key]: bool }
  const [done,  setDone]  = useState({}); // { [key]: bool }
  const [loadedFor, setLoadedFor] = useState(null);
  const [meta, setMeta] = useState(null);  // {updated_by, updated_at}
  const [readyMeta, setReadyMeta] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [copied, setCopied] = useState(false);
  const [savingChk, setSavingChk] = useState(false);

  // Load AC + readiness for this story when opened.
  useEffect(() => {
    if (!open || !sid || loadedFor === sid) return;
    let cancelled = false;
    (async () => {
      const [acRow, readinessRow] = await Promise.all([
        cloudStore.getAcceptance(sid),
        cloudStore.getReadiness(sid),
      ]);
      if (cancelled) return;
      if (acRow) {
        setGiven(acRow.given || "");
        setWhenStr(acRow.when_ || "");
        setThenStr(acRow.then_ || "");
        setMeta({ updated_by: acRow.updated_by, updated_at: acRow.updated_at });
      } else {
        setGiven(""); setWhenStr(""); setThenStr(""); setMeta(null);
      }
      if (readinessRow) {
        setReady(readinessRow.ready || {});
        setDone(readinessRow.done  || {});
        setReadyMeta({ updated_by: readinessRow.updated_by, updated_at: readinessRow.updated_at });
      } else {
        setReady({}); setDone({}); setReadyMeta(null);
      }
      setLoadedFor(sid);
      setSaved(false);
    })();
    return () => { cancelled = true; };
  }, [open, sid, loadedFor]);

  // Reset loadedFor when the sheet closes so reopening forces a re-fetch
  // (catches the case where someone else has edited it in the meantime).
  useEffect(() => { if (!open) setLoadedFor(null); }, [open]);

  if (!open || !story) return null;

  async function save() {
    ensureActor(async (who) => {
      setSaving(true);
      const ok = await cloudStore.setAcceptance(sid, {
        given, when_: whenStr, then_: thenStr, updated_by: who,
      });
      setSaving(false);
      if (ok) {
        setSaved(true);
        setMeta({ updated_by: who, updated_at: new Date().toISOString() });
        if (cloudStore.enabled) cloudStore.logEvent({
          action: "set-acceptance", actor: who, detail: { story: story.story, jira: story.jira },
        });
        onActivity && onActivity();
        setTimeout(() => setSaved(false), 2400);
      }
    });
  }

  function persistReadiness(nextReady, nextDone) {
    ensureActor(async (who) => {
      setSavingChk(true);
      const ok = await cloudStore.setReadiness(sid, {
        ready: nextReady, done: nextDone, updated_by: who,
      });
      setSavingChk(false);
      if (ok) {
        setReadyMeta({ updated_by: who, updated_at: new Date().toISOString() });
        if (cloudStore.enabled) cloudStore.logEvent({
          action: "set-readiness", actor: who,
          detail: {
            story: story.story, jira: story.jira,
            dor: countChecks(nextReady, DOR_ITEMS),
            dod: countChecks(nextDone,  DOD_ITEMS),
          },
        });
        onActivity && onActivity();
      }
    });
  }
  function toggleReady(key) {
    const next = { ...ready, [key]: !ready[key] };
    setReady(next);
    persistReadiness(next, done);
  }
  function toggleDone(key) {
    const next = { ...done, [key]: !done[key] };
    setDone(next);
    persistReadiness(ready, next);
  }

  function copyForJira() {
    const text = [
      story.jira ? "Acceptance criteria for " + story.jira : "Acceptance criteria — " + (story.story || ""),
      "",
      story.story ? "Story: " + story.story : "",
      "",
      "Given " + (given || "—"),
      "When " + (whenStr || "—"),
      "Then " + (thenStr || "—"),
      "",
      "Definition of Ready: " + countChecks(ready, DOR_ITEMS) + " / " + DOR_ITEMS.length,
      ...DOR_ITEMS.map(it => "  " + (ready[it.key] ? "[x]" : "[ ]") + " " + it.label),
      "",
      "Definition of Done: " + countChecks(done, DOD_ITEMS) + " / " + DOD_ITEMS.length,
      ...DOD_ITEMS.map(it => "  " + (done[it.key]  ? "[x]" : "[ ]") + " " + it.label),
      "",
      meta && meta.updated_by ? "Last edited by " + meta.updated_by : "",
    ].filter(Boolean).join("\n");
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
      if (story.jira) {
        window.open("https://nmp-jira.atlassian.net/browse/" + story.jira, "_blank", "noopener");
      }
    }).catch(() => {});
  }

  const hasAnything = !!(given || whenStr || thenStr);

  return (
    <>
      <div className="ac-backdrop" onClick={onClose} />
      <aside className="ac-sheet" role="dialog" aria-label="Acceptance criteria">
        <button className="ac-close" onClick={onClose} aria-label="Close">×</button>
        <h3>Acceptance criteria</h3>
        <p className="ac-story">"{story.story}"</p>
        <div className="ac-meta">
          {story.jira && <JiraChip jira={story.jira} />}
          {story.feature && <span className="sm-feature-pill">live feature</span>}
          {meta && meta.updated_by && (
            <span className="ac-edited">
              Last edited by <strong>{meta.updated_by}</strong>
              {meta.updated_at ? " · " + relativeTime(meta.updated_at) : ""}
            </span>
          )}
        </div>

        {/* Definition of Ready / Done checklist — two columns of four,
            tick boxes persist immediately to Supabase. */}
        <div className="dor-dod">
          <div className="dor-dod-head">
            <span className="dor-dod-title">Readiness</span>
            <span className="dor-dod-counts">
              DoR <strong>{countChecks(ready, DOR_ITEMS)}/{DOR_ITEMS.length}</strong>
              <span className="dor-dod-sep" aria-hidden="true">·</span>
              DoD <strong>{countChecks(done,  DOD_ITEMS)}/{DOD_ITEMS.length}</strong>
              {savingChk && <span className="dor-dod-saving"> saving…</span>}
              {readyMeta && readyMeta.updated_by && !savingChk && (
                <span className="dor-dod-edited">
                  · {readyMeta.updated_by}
                  {readyMeta.updated_at ? " · " + relativeTime(readyMeta.updated_at) : ""}
                </span>
              )}
            </span>
          </div>
          <div className="dor-dod-cols">
            <fieldset className="dor-col">
              <legend>Definition of Ready</legend>
              {DOR_ITEMS.map(it => (
                <label key={it.key} className={"chk" + (ready[it.key] ? " on" : "")}>
                  <input type="checkbox" checked={!!ready[it.key]}
                    onChange={() => toggleReady(it.key)}
                    disabled={!cloudStore.enabled} />
                  <span className="chk-label">{it.label}</span>
                  <span className="chk-hint">{it.hint}</span>
                </label>
              ))}
            </fieldset>
            <fieldset className="dod-col">
              <legend>Definition of Done</legend>
              {DOD_ITEMS.map(it => (
                <label key={it.key} className={"chk" + (done[it.key] ? " on" : "")}>
                  <input type="checkbox" checked={!!done[it.key]}
                    onChange={() => toggleDone(it.key)}
                    disabled={!cloudStore.enabled} />
                  <span className="chk-label">{it.label}</span>
                  <span className="chk-hint">{it.hint}</span>
                </label>
              ))}
            </fieldset>
          </div>
        </div>

        <label className="ac-label">Given</label>
        <textarea className="ac-input" rows="2" value={given}
          onChange={(e) => setGiven(e.target.value)}
          placeholder="the user has a CV uploaded to their profile, and they're on a Politiet job ad…" />

        <label className="ac-label">When</label>
        <textarea className="ac-input" rows="2" value={whenStr}
          onChange={(e) => setWhenStr(e.target.value)}
          placeholder="they tap Apply Now…" />

        <label className="ac-label">Then</label>
        <textarea className="ac-input" rows="2" value={thenStr}
          onChange={(e) => setThenStr(e.target.value)}
          placeholder="the apply sheet opens with their profile CV pre-selected, and the Send button is enabled…" />

        <div className="ac-actions">
          <button className="ac-secondary" onClick={onClose}>Close</button>
          <button className="ac-jira" onClick={copyForJira} disabled={!hasAnything}>
            {copied ? "✓ Copied" : "Copy for Jira"}
          </button>
          <button className="ac-primary" onClick={save} disabled={saving || !cloudStore.enabled}>
            {saved ? "✓ Saved" : saving ? "Saving…" : "Save"}
          </button>
        </div>
        {!cloudStore.enabled && (
          <p className="ac-warn">
            Cloud isn't configured — paste in your Supabase keys in <code>index.html</code> to share these with the team.
          </p>
        )}
      </aside>
    </>
  );
}

function TopNav({ view, onChange, openCounts = {}, onOpenFeedback }) {
  // Tab id → context.view label used in comment rows, so we can pick the
  // right count from the open-comments-by-view map. Impact–Effort is a
  // top-level peer of the opportunity tree again (was folded in May 2026,
  // unfolded after we made the tree editable so it has its own real estate).
  const tabs = [
    { id: "prototype", label: "Prototype",        ctxView: "Prototype" },
    { id: "tree",      label: "Opportunity tree", ctxView: "Opportunity tree" },
    { id: "matrix",    label: "Impact–Effort",    ctxView: "Impact–Effort" },
    { id: "storymap",  label: "Storymap",         ctxView: "Storymap" },
    { id: "handoff",   label: "Handoff",          ctxView: "Handoff" },
  ];
  const containerRef = useRef(null);
  const btnRefs = useRef({});
  const [ind, setInd] = useState({ left: 0, width: 0, ready: false });

  // Measure the active tab once mounted and on every change of `view` so the
  // pill indicator slides under the label rather than each label colouring in
  // independently. ResizeObserver handles layout shifts (font load, resize).
  useEffect(() => {
    function measure() {
      const btn = btnRefs.current[view];
      const wrap = containerRef.current;
      if (!btn || !wrap) return;
      const wrapRect = wrap.getBoundingClientRect();
      const r = btn.getBoundingClientRect();
      setInd({ left: r.left - wrapRect.left, width: r.width, ready: true });
    }
    measure();
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (ro && containerRef.current) ro.observe(containerRef.current);
    window.addEventListener("resize", measure);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", measure); };
  }, [view]);

  return (
    <nav className="topnav" aria-label="Prototype views">
      <div className="topnav-inner" role="tablist" ref={containerRef}>
        <div className="topnav-indicator" aria-hidden="true"
          style={{ left: ind.left, width: ind.width, opacity: ind.ready ? 1 : 0 }} />
        {tabs.map(t => {
          // Roll absorbed contexts (e.g. Impact–Effort under Opportunity tree)
          // into the parent tab's count so old comments still surface.
          let n = openCounts[t.ctxView] || 0;
          if (t.absorb) for (const k of t.absorb) n += openCounts[k] || 0;
          return (
            <button
              key={t.id}
              ref={el => { btnRefs.current[t.id] = el; }}
              role="tab"
              aria-selected={view === t.id}
              className={view === t.id ? "active" : ""}
              onClick={() => onChange(t.id)}>
              <span className="tdot" aria-hidden="true" />
              {t.label}
              {n > 0 && (
                <span
                  className="tn-badge"
                  role="button"
                  tabIndex={0}
                  aria-label={n + " open feedback comments — click to view"}
                  onClick={(e) => {
                    e.stopPropagation();
                    onChange(t.id);
                    onOpenFeedback && onOpenFeedback(t.ctxView);
                  }}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" || e.key === " ") {
                      e.preventDefault(); e.stopPropagation();
                      onChange(t.id);
                      onOpenFeedback && onOpenFeedback(t.ctxView);
                    }
                  }}
                  title="Click to view feedback for this tab">{n}</span>
              )}
            </button>
          );
        })}
      </div>
    </nav>
  );
}

// Paste your project's URL + anon key here to turn on team-shared

// Setup guide is in README.md under "Supabase setup".
const SUPABASE_URL      = "https://mnotuwlstknjuxbgailm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h-o9kPkz9m-6FiWyKYAHMw_huVQuI-O";
const SUPABASE_TABLE    = "prototype_state";
const SUPABASE_EVENTS   = "prototype_events";
const SUPABASE_AC       = "prototype_acceptance"; // acceptance criteria, one row per storyId
const SUPABASE_READINESS= "prototype_readiness";  // DoR / DoD checklist, one row per storyId
const SUPABASE_COMMENTS = "prototype_comments";   // threaded feedback on the prototype

// ─── Definition of Ready / Done ──────────────────────────────────────────
// Eight items split 4 + 4. Keep keys short — they're persisted in JSONB.
// If you change a key here, write a migration that renames the column in
// existing rows; otherwise old rows will silently lose that flag.
const DOR_ITEMS = [
  { key: "design",  label: "Design approved",        hint: "Lead designer signed off in Figma / prototype" },
  { key: "ac",      label: "AC written",             hint: "Given / When / Then captured on this card" },

];

  { key: "code",    label: "Code merged",            hint: "PR landed on main behind a flag" },
  { key: "tests",   label: "Tests pass",             hint: "Unit + integration green on CI" },
  { key: "flag",    label: "Feature flag set",       hint: "Flag wired in Unleash / config service" },
  { key: "qa",      label: "QA signed off",          hint: "Manual sweep on the target platform(s)" },
];

// Count how many keys are checked. Tolerates `state` being undefined.
function countChecks(state, items) {
  if (!state) return 0;
  let n = 0;
  for (const it of items) if (state[it.key]) n++;
  return n;
}

// Slack incoming-webhook URL — when set, every new comment fires a
// message to that Slack channel. Leave empty to disable. Generate at:
// https://api.slack.com/messaging/webhooks
const SLACK_WEBHOOK_URL = "";

// Magic-header gate. Sent on every Supabase request as x-team-token;
// the RLS policies on the server require this exact value to allow
// reads + writes. Anyone who reads the JS can extract this string —
// that's expected. Stops drive-by abuse from bots without forcing
// real login.
const TEAM_TOKEN = "vend-user-connect-2026-bm7q4n";


// Build a tiny helper. If keys are missing or the CDN failed to load,
// every method becomes a no-op and the rest of the app falls back to
// localStorage transparently. No errors thrown either way.
const cloudStore = (() => {
  const enabled =
    typeof window !== "undefined" &&
    !!window.supabase &&
    !!SUPABASE_URL &&
    !!SUPABASE_ANON_KEY;
  if (!enabled) {
    return {
      enabled: false,
      get: async () => null,
      set: async () => false,
      logEvent: async () => false,
      getEvents: async () => [],
      getAcceptance: async () => null,
      setAcceptance: async () => false,
      getAcceptanceMap: async () => ({}),
      getReadiness: async () => null,
      setReadiness: async () => false,
      getReadinessMap: async () => ({}),
      getComments: async () => [],
      addComment: async () => ({ row: null, error: "cloud-disabled" }),
      setCommentResolved: async () => false,
      deleteComment: async () => false,
      getOpenCommentCounts: async () => ({}),
    };
  }
  let client;
  try {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        // Persist + auto-refresh the Google sign-in session so people
        // don't have to authenticate on every tab/refresh.
        persistSession: true,
        autoRefreshToken: true,
        // Supabase OAuth returns to the prototype with the access token
        // in the URL hash; this flag tells the client to parse it on load.
        detectSessionInUrl: true,
      },
      global: {
        // RLS policies require this header on every read/write — keeps
        // drive-by bots out even though the anon key is public. (RLS
        // policies also check the authenticated user's email domain
        // against the @finn.no / @m10s.io / @vend.com allowlist; see
        // SECURITY.md for the SQL.)
        headers: { "x-team-token": TEAM_TOKEN },
      },
    });
  } catch (e) {
    console.warn("[cloud] createClient failed:", e);
    return {
      enabled: false,
      get: async () => null,
      set: async () => false,
      logEvent: async () => false,
      getEvents: async () => [],
      getAcceptance: async () => null,
      setAcceptance: async () => false,
      getAcceptanceMap: async () => ({}),
      getReadiness: async () => null,
      setReadiness: async () => false,
      getReadinessMap: async () => ({}),
      getComments: async () => [],
      addComment: async () => ({ row: null, error: "cloud-disabled" }),
      setCommentResolved: async () => false,
      deleteComment: async () => false,
      getOpenCommentCounts: async () => ({}),
    };
  }
  return {
    enabled: true,
    client,
    async get(key) {
      try {
        const { data, error } = await client
          .from(SUPABASE_TABLE)
          .select("data, updated_at")
          .eq("key", key)
          .maybeSingle();
        if (error) { console.warn("[cloud] get", key, error.message); return null; }
        return data ? { data: data.data, updatedAt: data.updated_at } : null;
      } catch (e) { console.warn("[cloud] get exception", e); return null; }
    },
    async set(key, data) {
      try {
        const { error } = await client
          .from(SUPABASE_TABLE)
          .upsert({ key, data, updated_at: new Date().toISOString() }, { onConflict: "key" });
        if (error) { console.warn("[cloud] set", key, error.message); return false; }
        return true;
      } catch (e) { console.warn("[cloud] set exception", e); return false; }
    },
    async logEvent({ action, detail, actor }) {
      try {
        // Insert + select so we can verify the row landed (Supabase
        // silently returns 0-affected when an RLS INSERT policy is missing
        // for the prototype_events table — no error, no row).
        const { data, error } = await client
          .from(SUPABASE_EVENTS)
          .insert({ action, detail: detail || null, actor: actor || null })
          .select();
        if (error) {
          console.warn("[cloud] logEvent failed:", error.message, "— most likely missing 'team can insert events' RLS policy on prototype_events");
          return false;
        }
        if (!data || data.length === 0) {
          console.warn("[cloud] logEvent — insert returned 0 rows. Missing RLS policy on prototype_events? Run the full token-gated SQL block from the README.");
          return false;
        }
        console.log("[cloud] logged event:", action, detail);
        return true;
      } catch (e) { console.warn("[cloud] logEvent exception", e); return false; }
    },
    async getEvents(limit = 12) {
      try {
        const { data, error } = await client
          .from(SUPABASE_EVENTS)
          .select("id, action, detail, actor, created_at")
          .order("created_at", { ascending: false })
          .limit(limit);
        if (error) { console.warn("[cloud] getEvents", error.message); return []; }
        return data || [];
      } catch (e) { console.warn("[cloud] getEvents exception", e); return []; }
    },
    async getAcceptance(storyId) {
      try {
        const { data, error } = await client
          .from(SUPABASE_AC)
          .select("given, when_, then_, updated_at, updated_by")
          .eq("story_id", storyId)
          .maybeSingle();
        if (error) { console.warn("[cloud] getAcceptance", error.message); return null; }
        return data;
      } catch (e) { console.warn("[cloud] getAcceptance exception", e); return null; }
    },
    async setAcceptance(storyId, { given, when_, then_, updated_by }) {
      try {
        const row = {
          story_id: storyId,
          given: given || "",
          when_: when_ || "",
          then_: then_ || "",
          updated_by: updated_by || null,
          updated_at: new Date().toISOString(),
        };
        const { error } = await client
          .from(SUPABASE_AC)
          .upsert(row, { onConflict: "story_id" });
        if (error) { console.warn("[cloud] setAcceptance", error.message); return false; }
        return true;
      } catch (e) { console.warn("[cloud] setAcceptance exception", e); return false; }
    },
    async getAcceptanceMap() {
      try {
        const { data, error } = await client
          .from(SUPABASE_AC)
          .select("story_id, given, when_, then_, updated_by, updated_at");
        if (error) { console.warn("[cloud] getAcceptanceMap", error.message); return {}; }
        const map = {};
        (data || []).forEach(r => { map[r.story_id] = r; });
        return map;
      } catch (e) { console.warn("[cloud] getAcceptanceMap exception", e); return {}; }
    },

    // ─── Readiness (DoR / DoD checklist) ──────────────────────────────
    async getReadiness(storyId) {
      try {
        const { data, error } = await client
          .from(SUPABASE_READINESS)
          .select("ready, done, updated_by, updated_at")
          .eq("story_id", storyId)
          .maybeSingle();
        if (error) { console.warn("[cloud] getReadiness", error.message); return null; }
        return data;
      } catch (e) { console.warn("[cloud] getReadiness exception", e); return null; }
    },
    async setReadiness(storyId, { ready, done, updated_by }) {
      try {
        const row = {
          story_id: storyId,
          ready: ready || {},
          done:  done  || {},
          updated_by: updated_by || null,
          updated_at: new Date().toISOString(),
        };
        const { error } = await client
          .from(SUPABASE_READINESS)
          .upsert(row, { onConflict: "story_id" });
        if (error) { console.warn("[cloud] setReadiness", error.message); return false; }
        return true;
      } catch (e) { console.warn("[cloud] setReadiness exception", e); return false; }
    },
    async getReadinessMap() {
      try {
        const { data, error } = await client
          .from(SUPABASE_READINESS)
          .select("story_id, ready, done, updated_by, updated_at");
        if (error) { console.warn("[cloud] getReadinessMap", error.message); return {}; }
        const map = {};
        (data || []).forEach(r => { map[r.story_id] = r; });
        return map;
      } catch (e) { console.warn("[cloud] getReadinessMap exception", e); return {}; }
    },

    // ─── Comments / feedback ──────────────────────────────────────────
    async getComments(limit = 200) {
      try {
        const { data, error } = await client
          .from(SUPABASE_COMMENTS)
          .select("id, parent_id, author, body, context, resolved, resolved_by, resolved_at, created_at")
          .order("created_at", { ascending: false })
          .limit(limit);
        if (error) { console.warn("[cloud] getComments", error.message); return []; }
        return data || [];
      } catch (e) { console.warn("[cloud] getComments exception", e); return []; }
    },
    async addComment({ parent_id, author, body, context }) {
      try {
        const row = {
          parent_id: parent_id || null,
          author: (author || "").slice(0, 60),
          body: (body || "").slice(0, 4000),
          context: context || null,
          resolved: false,
        };
        const { data, error } = await client
          .from(SUPABASE_COMMENTS)
          .insert(row)
          .select()
          .single();
        if (error) {
          console.warn("[cloud] addComment", error.message);
          return { row: null, error: error.message };
        }
        return { row: data, error: null };
      } catch (e) {
        console.warn("[cloud] addComment exception", e);
        return { row: null, error: e.message || String(e) };
      }
    },
    async getOpenCommentCounts() {
      try {
        // Pull just enough columns to bucket open comments by view.
        const { data, error } = await client
          .from(SUPABASE_COMMENTS)
          .select("context, resolved")
          .eq("resolved", false);
        if (error) { console.warn("[cloud] getOpenCommentCounts", error.message); return {}; }
        const counts = {};
        (data || []).forEach(r => {
          const v = r.context && r.context.view;
          if (!v) return;
          counts[v] = (counts[v] || 0) + 1;
        });
        return counts;
      } catch (e) { console.warn("[cloud] getOpenCommentCounts exception", e); return {}; }
    },
    async deleteComment(id) {
      try {
        // Cascades to replies via ON DELETE CASCADE on parent_id.
        // .select() returns the deleted rows — used as a sanity check
        // because Supabase silently returns 0-affected when an RLS DELETE
        // policy is missing (no error thrown, just nothing deleted).
        const { data, error } = await client
          .from(SUPABASE_COMMENTS)
          .delete()
          .eq("id", id)
          .select();
        if (error) {
          console.warn("[cloud] deleteComment", error.message);
          return { ok: false, error: error.message };
        }
        if (!data || data.length === 0) {
          return {
            ok: false,
            error: "row-level security blocked the delete — add the 'team can delete comments' policy in Supabase SQL Editor",
          };
        }
        return { ok: true, error: null };
      } catch (e) {
        console.warn("[cloud] deleteComment exception", e);
        return { ok: false, error: e.message || String(e) };
      }
    },
    async setCommentResolved(id, resolved, resolvedBy) {
      try {
        const patch = resolved
          ? { resolved: true,  resolved_by: resolvedBy || null, resolved_at: new Date().toISOString() }
          : { resolved: false, resolved_by: null, resolved_at: null };
        const { error } = await client.from(SUPABASE_COMMENTS).update(patch).eq("id", id);
        if (error) { console.warn("[cloud] setCommentResolved", error.message); return false; }
        return true;
      } catch (e) { console.warn("[cloud] setCommentResolved exception", e); return false; }
    },
  };
})();

// Fire-and-forget Slack notification when a comment is posted. No-op if
// SLACK_WEBHOOK_URL isn't set. Uses Slack's incoming-webhook JSON shape.
// Sent with `mode: 'no-cors'` so the browser doesn't fight Slack's CORS
// policy (we don't care about the response — Slack always returns "ok").
function postCommentToSlack({ author, body, context, deepLink }) {
  if (!SLACK_WEBHOOK_URL) return;
  try {
    const ctxParts = [];
    if (context && context.view)     ctxParts.push("*View:* " + context.view);
    if (context && context.screen)   ctxParts.push("*Screen:* " + context.screen);
    if (context && context.platform) ctxParts.push("*Platform:* " + context.platform);
    if (context && context.version)  ctxParts.push("*Version:* " + context.version);
    const payload = {
      blocks: [
        {
          type: "section",
          text: {
            type: "mrkdwn",
            text: "*" + (author || "Anonymous") + "* left feedback on the prototype:\n>>> " + body,
          },
        },
        ctxParts.length ? {
          type: "context",
          elements: [{ type: "mrkdwn", text: ctxParts.join("  ·  ") }],
        } : null,
        deepLink ? {
          type: "actions",
          elements: [{
            type: "button",
            text: { type: "plain_text", text: "Open in prototype" },
            url: deepLink,
          }],
        } : null,
      ].filter(Boolean),
    };
    fetch(SLACK_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).catch(e => console.warn("[slack] post failed:", e));
  } catch (e) {
    console.warn("[slack] payload build failed:", e);
  }
}

// Build the same screen / platform / version labels we use when posting
// pinned comments — so filtering pins for the current screen is a simple
// string compare against ctx.screen / ctx.platform / ctx.version.
function currentScreenLabel(view, screen, overlay, magicMode, loadingPhase) {
  if (view !== "prototype") return null;
  return (
    overlay ? "Overlay: " + overlay :
    screen === "preview" && magicMode ? "Preview · Magic Apply" :
    screen === "preview" && loadingPhase !== "ready" ? "Preview · loading" :
    screen === "preview" ? "Preview · ready" :
    screen
  );
}
function currentPlatformLabel(p) {
  return p === "ios" ? "iOS" : p === "android" ? "Android" : "Web";
}
function currentVersionLabel(v) {
  // Roadmap-aligned labels: MVP is agentic-only, 1.0 + 1.2 are the cross-flow
  // releases, 2.0 is YOLO/Magic Apply. Internal ids stay as they were so the
  // existing per-version conditionals throughout the prototype keep working.
  return v === "agentic" ? "MVP" :
         v === "mvp"     ? "1.0" :
         v === "v1"      ? "1.2" :
         v === "v2"      ? "2.0" : v;
}

// Tiny debouncer for save-on-edit so dragging doesn't hammer the API.
function debounce(fn, ms) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

// Mobile-first cheat code: a header button that pops a modal with a QR for
// the current URL. Anyone on a video call can scan it and instantly test
// the prototype on a real device. Uses qrserver.com's public free QR API
// (no JS lib, no race conditions) — falls back to a plain link if offline.
function QrModal({ trigger }) {
  const [open, setOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  // Encode the *fullscreen* URL — when the QR is scanned on a phone we
  // want the visitor to land directly in a clean, edge-to-edge prototype
  // view, not the team dashboard.
  const url = (() => {
    if (typeof window === "undefined") return "";
    const u = new URL(window.location.href);
    u.searchParams.set("fullscreen", "1");
    // Anchor the URL on the prototype, not whichever strategy tab the
    // QR-opener happens to be on.
    u.hash = "";
    return u.toString();
  })();
  const qrSrc =
    "https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=1&qzone=1&data=" +
    encodeURIComponent(url);

  function copyLink() {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(url).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }).catch(() => {});
  }

  return (
    <>
      {trigger ? trigger(() => setOpen(true)) : (
        <button className="hdr-tool" onClick={() => setOpen(true)} aria-label="Open this prototype on a phone">
          <span className="icon" aria-hidden="true">📱</span>
          <span className="lbl">Open on phone</span>
        </button>
      )}
      {open && (
        <>
          <div className="qr-backdrop" onClick={() => setOpen(false)} />
          <div className="qr-modal" role="dialog" aria-label="Scan to open on phone">
            <button className="qr-close" onClick={() => setOpen(false)} aria-label="Close">×</button>
            <h3>Open on a phone</h3>
            <p className="lead">Scan with your phone's camera to open this exact view on a real device.</p>
            <div className="qr-canvas-wrap">
              <img
                src={qrSrc}
                width={240}
                height={240}
                alt="QR code"
                onError={(e) => { e.currentTarget.style.display = "none"; }}
              />
            </div>
            <div className="qr-url" title={url}>{url}</div>
            <div className="qr-actions">
              <button className="qr-copy" onClick={copyLink}>{copied ? "✓ Copied" : "Copy link"}</button>
            </div>
            <p className="qr-tip">
              Tip: the page remembers which tab you're on, so the QR opens to your current view (Storymap, Matrix, Prototype, etc.).
            </p>
          </div>
        </>
      )}
    </>
  );
}

// Activity feed — small pill in the header that opens a popover with the
// last N events from the team. Backed by the prototype_events table.
function ActivityFeed({ enabled, actorName }) {
  const [open, setOpen] = useState(false);
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(false);

  // Poll every 30s while the popover is open. Cheap, and avoids needing
  // realtime subscriptions just for an activity feed.
  useEffect(() => {
    if (!open || !enabled) return;
    let cancelled = false;
    async function load() {
      setLoading(true);
      const data = await cloudStore.getEvents(15);
      if (!cancelled) {
        setEvents(data);
        setLoading(false);
      }

    const t = setInterval(load, 30000);
    return () => { cancelled = true; clearInterval(t); };
  }, [open, enabled]);

  if (!enabled) return null;

  return (
    <div className="hdr-tool-wrap">
      <button className="hdr-tool" onClick={() => setOpen(o => !o)}
        aria-label="Recent team activity"

function describeEvent(e) {
  const d = e.detail || {};
  switch (e.action) {
    case "move-story":
      return `moved “${truncate(d.story, 36)}” from ${releaseLabel(d.from)} → ${releaseLabel(d.to)}`;
    case "move-solution":
      return `repositioned “${truncate(d.solution, 30)}” on Impact–Effort`;
    case "reset-storymap":
      return "reset the storymap to defaults";
    case "reset-matrix":
      return "reset the Impact–Effort matrix to defaults";
    case "set-acceptance":
      return `updated acceptance criteria on “${truncate(d.story, 32)}”`;
    case "comment-added":
      return `left feedback on ${d.view || "the prototype"}: “${truncate(d.excerpt, 40)}”`;
    case "comment-resolved":
      return `resolved a comment: “${truncate(d.excerpt, 40)}”`;
    case "comment-reopened":
      return `reopened a comment: “${truncate(d.excerpt, 40)}”`;
    case "comment-deleted":
      return `deleted a ${d.wasReply ? "reply" : "comment"}: “${truncate(d.excerpt, 40)}”`;
    default:
      return e.action;
  }
}
function releaseLabel(r) {
  return r === "agentic" ? "MVP"
       : r === "mvp"     ? "1.0"
       : r === "v1"      ? "1.2"
       : r === "v2"      ? "2.0"
       : (r || "—");
}
function truncate(s, n) {
  if (!s) return "(unnamed)";
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}
function relativeTime(iso) {
  if (!iso) return "";
  const then = new Date(iso).getTime();
  const diff = Math.max(0, Date.now() - then);
  const m = Math.floor(diff / 60000);
  if (m < 1)   return "just now";
  if (m < 60)  return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24)  return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 7)   return d + "d ago";
  return new Date(iso).toLocaleDateString();
}

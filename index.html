// ===========================================================
// APPLICATION PREVIEW SHEET — the merged "reviewable summary card"
// ===========================================================
function ApplicationPreviewSheet({
  job, state, loadingPhase = "ready", version = "mvp",
  magicMode = false, magicStep = 0,
  showJobMatch = false,
  onSend, onClose, onOpenLetter, onOpenCV, onOpenEdit, onFillMissing, onOpenActivity,
}) {
  const t = useT();
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;
  const cvLoading = loadingPhase === "loading-cv";
  const letterLoading = loadingPhase === "loading-cv" || loadingPhase === "loading-letter";
  const allReady = loadingPhase === "ready";
  const [sheetTab, setSheetTab] = useState("application"); // "application" | "ad"
  // First-time hint: pulse the inactive 'Job ad' tab once so users discover
  // they can re-read the ad without losing the draft. We use sessionStorage
  // so it stops nagging after the user has seen it.
  const [hintTab, setHintTab] = useState(() => {
    try { return sessionStorage.getItem("vend-tab-hint-seen") !== "1"; }
    catch (_) { return true; }
  });
  useEffect(() => {
    if (!hintTab) return;
    const t = setTimeout(() => {
      setHintTab(false);
      try { sessionStorage.setItem("vend-tab-hint-seen", "1"); } catch (_) {}
    }, 3200);
    return () => clearTimeout(t);
  }, [hintTab]);

  const missPers = state === "missing-personalia";
  const missCv = state === "missing-cv";
  const missQ = state === "missing-questions";
  const anyMissing = missPers || missCv || missQ;

  const rows = [
    {
      id: "personalia",
      title: t({ en: "Personal details", no: "Personalia" }),
      sub: missPers
        ? t({ en: "Phone number is missing", no: "Telefonnummer mangler" })
        : t({ en: "Synced from your profile", no: "Hentet fra profilen din" }),
      source: null,
      status: missPers ? "missing" : "done",
      preview: false,
    },
    {
      id: "cv",
      title: "CV",
      sub: cvLoading
        ? t({ en: "Fetching your CV…", no: "Henter CV …" })
        : missCv
          ? t({ en: "No CV added — required to send", no: "Ingen CV lagt til – kreves for å sende" })
          : t({ en: "Synced from your profile", no: "Hentet fra profilen din" }),
      source: null,
      status: cvLoading ? "loading" : missCv ? "missing" : "done",
      // No eye affordance — Endre is the single entry to the CV picker.
      preview: false,
    },
    {
      id: "letter",
      title: t({ en: "Cover letter", no: "Søknadsbrev" }),
      // Small FINN AI mark inline next to the title text, same height as text.
      titleSuffix: letterLoading ? null : <AILogo size={16} />,
      sub: letterLoading
        ? t({ en: "Drafting for this role…", no: "Skriver utkast for denne jobben …" })
        : t({ en: "AI draft · editable", no: "AI-utkast · kan endres" }),
      // Source pill removed — the inline AI mark + plain-grey sub line carry it.
      source: null,
      status: letterLoading ? "loading" : "ai",
      // Endre is the single entry — opens the cover letter sheet directly.
      preview: false,
    },
    {
      id: "questions",
      title: t({ en: "Employer questions", no: "Spørsmål fra arbeidsgiver" }),
      sub: missQ
        ? t({ en: "1 question still needs an answer", no: "Ett spørsmål mangler svar" })
        : t({ en: "You answered 2 questions", no: "Du svarte på 2 spørsmål" }),
      source: null,
      status: missQ ? "missing" : "done",
      preview: false,
    },
  ];

  // Magic Apply (v2.0): override per-row statuses to tick off one by one.
  // Rows below the current magicStep look 'queued'; rows at-or-below tick to 'done'.
  // We also drop source pills and the bottom edit action — the user is hands-off.
  const magicRows = magicMode ? rows.map((r, i) => ({
    ...r,
    status: i < magicStep ? "done" : "queued",
    source: i < magicStep ? r.source : null,
    sub:    i < magicStep
              ? t({ en: "Optimised for this role", no: "Tilpasset denne rollen" })
              : t({ en: "Waiting", no: "Venter" }),
    preview: false,
  })) : rows;

  return (
    <div style={{
      position: "absolute", inset: 0, zIndex: 50,
      display: "flex", flexDirection: "column",
      background: "rgba(0,0,0,.30)",
      animation: "fadein 300ms var(--ease-modal)",
    }}>
      <div onClick={onClose} style={{ flex: `0 0 ${backdropH}px`, cursor: "pointer" }} />
      <div style={{
        flex: 1, background: "#fff",
        borderTopLeftRadius: sheetRadius, borderTopRightRadius: sheetRadius,
        display: "flex", flexDirection: "column",
        boxShadow: "0 -4px 24px rgba(0,0,0,.10)",
        position: "relative", overflow: "hidden",
        animation: "slideup 440ms var(--ease-modal)",
      }}>
        <div style={{ display: "flex", justifyContent: "center", padding: "10px 0 6px" }}>
          <div style={{ width: 40, height: 5, borderRadius: 9999, background: "#d4d4d4" }} />
        </div>

        {/* Header — logo, title block, close. All vertically centered. */}
        <div style={{
          display: "flex", alignItems: "center", gap: 14,
          padding: "10px 16px 14px",
        }}>
          <CompanyLogo size={48} initials={job.initials} color={job.brandColor} logo={job.logo} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{
              fontSize: 11, fontWeight: 600, color: "#6b6b6b",
              margin: "0 0 3px", letterSpacing: 0.6, textTransform: "uppercase",
              lineHeight: 1,
            }}>
              {t({ en: "Applying as", no: "Søker som" })}
            </p>
            <p style={{
              fontSize: 16, fontWeight: 700, color: "#1d1d1d",
              margin: "0 0 2px", lineHeight: 1.2, letterSpacing: -0.2,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>{t({ en: job.title, no: job.titleNo })}</p>
            <p style={{
              fontSize: 13, color: "#6b6b6b", margin: 0, lineHeight: 1.3,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>{job.company}</p>
          </div>
          <button
            className="press"
            onClick={() => { haptic("tap"); onClose?.(); }}
            aria-label={t({ en: "Close", no: "Lukk" })}
            style={{
              width: 32, height: 32, borderRadius: 9999,
              background: "#f0f0f3", border: 0, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name="x" size={16} color="#1d1d1d" stroke={2.4} />
          </button>
        </div>

        {showJobMatch && (
          <div style={{
            padding: "0 16px 10px",
            display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap",
          }}>
            {/* Job match score (1.0+) */}
            <div style={{
              display: "inline-flex", alignItems: "center", gap: 6,
              padding: "5px 10px 5px 8px",
              background: "#eaf2ff",
              border: "1px solid rgba(0,99,251,0.18)",
              borderRadius: 9999,
              fontSize: 12, color: "#0063fb", fontWeight: 600,
              letterSpacing: -0.1,
              lineHeight: 1.35,
              boxSizing: "border-box",
            }}>
              <Icon name="sparkle" size={11} color="#0063fb" stroke={0} fill="#0063fb" />
              {t({ en: "87 % job match", no: "87 % match" })}
            </div>
            <button
              className="press"
              onClick={() => { haptic("tap"); /* future: open Job Match info sheet */ }}
              aria-label={t({ en: "What is Job Match?", no: "Hva er Job Match?" })}
              style={{
                appearance: "none", border: 0, background: "transparent",
                padding: "5px 4px", margin: 0,
                fontFamily: "inherit", fontSize: 12, fontWeight: 600,
                color: "#0063fb", letterSpacing: -0.1,
                cursor: "pointer", lineHeight: 1.35,
                display: "inline-flex", alignItems: "center", gap: 4,
              }}>
              <Icon name="info" size={13} color="#0063fb" stroke={2} />
              {t({ en: "What is Job Match?", no: "Hva er Job Match?" })}
            </button>
          </div>
        )}

        {/* In-sheet tabs: Application ↔ Job ad. Lets the seeker re-read the ad
            without dismissing the draft. iOS segmented control look. */}
        <div style={{ padding: "2px 16px 12px" }}>
          <div role="tablist" aria-label={t({ en: "Sheet view", no: "Visning" })}
            style={{
              position: "relative",
              display: "grid", gridTemplateColumns: "1fr 1fr",
              background: "#eef0f5", borderRadius: 10, padding: 3,
              fontFamily: "inherit",
            }}>
            <div aria-hidden="true" style={{
              position: "absolute", top: 3, bottom: 3,
              left: sheetTab === "application" ? 3 : "calc(50% + 0px)",
              width: "calc(50% - 3px)",
              background: "#fff", borderRadius: 8,
              boxShadow: "0 1px 2px rgba(0,0,0,0.08), 0 1px 1px rgba(0,0,0,0.04)",
              transition: "left 320ms var(--ease-modal)",
            }} />
            <button
              role="tab"
              aria-selected={sheetTab === "application"}
              onClick={() => { haptic("tap"); setSheetTab("application"); }}
              className="press"
              style={{
                position: "relative", zIndex: 1,
                background: "transparent", border: 0,
                padding: "8px 10px",
                font: "600 13px/1 inherit", letterSpacing: -0.1,
                color: sheetTab === "application" ? "#1d1d1d" : "#6b6b6b",
                cursor: "pointer", borderRadius: 8,
                transition: "color 160ms var(--ease-out)",
              }}>
              {t({ en: "Application", no: "Søknaden" })}
            </button>
            <button
              role="tab"
              aria-selected={sheetTab === "ad"}
              onClick={() => { haptic("tap"); setSheetTab("ad"); setHintTab(false); }}
              className={"press" + (hintTab && sheetTab !== "ad" ? " tab-hint" : "")}
              style={{
                position: "relative", zIndex: 1,
                background: "transparent", border: 0,
                padding: "8px 10px",
                font: "600 13px/1 inherit", letterSpacing: -0.1,
                color: sheetTab === "ad" ? "#1d1d1d" : "#6b6b6b",
                cursor: "pointer", borderRadius: 8,
                transition: "color 160ms var(--ease-out)",
              }}>
              {t({ en: "Job ad", no: "Annonsen" })}
            </button>
          </div>
        </div>

        {anyMissing && sheetTab === "application" && (
          <div style={{
            margin: "0 16px 8px", padding: "12px 14px",
            background: "#fadddd", borderRadius: PLATFORM_RADII[platform].card,
            display: "flex", gap: 10, alignItems: "flex-start",
            animation: "fadein 300ms var(--ease-modal)",
          }}>
            <Icon name="alert" size={20} color="#cc1414" stroke={2} />
            <p style={{ fontSize: 14, color: "#1d1d1d", margin: 0, lineHeight: 1.4 }}>
              {missPers
                ? t({ en: "Some personal details are missing. Add them before sending.",
                      no: "Noen personalia mangler. Fyll inn før du sender." })
                : missCv
                ? t({ en: "Add a CV before sending.",
                      no: "Legg til en CV før du sender." })
                : t({ en: "Please answer the employer's question before sending.",
                      no: "Du må svare på arbeidsgivers spørsmål før du kan sende." })}
            </p>
          </div>
        )}

        {/* Magic Apply banner (v2.0): replaces the chip row visually while running. */}
        {magicMode && (
          <div style={{
            margin: "0 16px 10px", padding: "10px 14px",
            background: "linear-gradient(180deg, #f4f8ff 0%, #eaf2ff 100%)",
            border: "1px solid rgba(0,99,251,0.18)",
            borderRadius: PLATFORM_RADII[platform].card,
            display: "flex", alignItems: "center", gap: 10,
            animation: "fadein 300ms var(--ease-modal)",
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: 9,
              background: "#fff", padding: 2,
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
              boxShadow: "0 4px 10px rgba(0,99,251,0.30)",
              animation: "pulse 2.2s ease-in-out infinite",
            }}>
              <AILogo size={28} />
            </div>
            <div style={{ minWidth: 0 }}>
              <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#0a3a8a", letterSpacing: -0.1 }}>
                {t({ en: "FINN is applying for you", no: "FINN søker for deg" })}
              </p>
              <p style={{ margin: "2px 0 0", fontSize: 11, color: "#0063fb" }}>
                {t({ en: "Optimising each section to match the role…",
                    no: "Tilpasser hver del til rollen …" })}
              </p>
            </div>
          </div>
        )}

        {/* Body — swaps between Application rows and the Job ad based on sheetTab. */}
        <div className="scroll-area" style={{ flex: 1, overflowY: "auto" }}>
          {sheetTab === "application" ? (
            <div key="app-body" style={{ animation: "fadeup 320ms var(--ease-modal)" }}>
              {magicRows.map((r, i) => (
                <PreviewRow
                  key={r.id} row={r} isLast={i === magicRows.length - 1}
                  onEdit={() => {

                    // CV row routes to the picker — single CV decision point.
                    if (r.id === "letter") onOpenLetter?.();
                    else onOpenEdit(r.id);
                  }}
                  onPreview={null}
                  // No eye anywhere. Endre is the single entry for every row;
                  // letter row opens the cover letter sheet, CV row opens the
                  // picker, others open their respective editors.
                />
              ))}

              <p style={{
                fontSize: 12, color: "#6b6b6b", lineHeight: 1.5,
                margin: "20px 24px 8px", textAlign: "center", letterSpacing: -0.05,
              }}>
                {t({
                  en: <>Edit anything before you send.<br/>We'll keep a draft in your profile.</>,
                  no: <>Du kan endre alt før du sender.<br/>Vi lagrer kladden i profilen din.</>,
                })}
              </p>
            </div>
          ) : (
            <div key="ad-body" style={{ animation: "fadeup 340ms var(--ease-modal)" }}>
              <JobAdContent job={job} embedded />
              <div style={{ height: 12 }} />
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{
          padding: "12px 16px",
          paddingBottom: `calc(12px + ${homeArea}px)`,
          background: "#fff", borderTop: "0.5px solid rgba(0,0,0,0.06)",
          display: "flex", flexDirection: "column", gap: 8,
        }}>
          {magicMode ? (
            // Send button replaced with an auto-sending indicator. Disabled — the
            // flow is hands-off; user just watches it land.
            <div style={{
              minHeight: 52,
              display: "flex", alignItems: "center", justifyContent: "center",
              gap: 10, padding: "0 16px",
              background: "#0063fb", color: "#fff",
              borderRadius: 14,
              fontWeight: 600, fontSize: 15, letterSpacing: -0.1,
              opacity: 0.92,

              <span style={{
                width: 16, height: 16, borderRadius: 9999,
                border: "2px solid rgba(255,255,255,0.4)",

                animation: "spin 1.6s cubic-bezier(0.5, 0, 0.5, 1) infinite",
                display: "inline-block",

            <PrimaryButton

              <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                {allReady ? (
                  <><Icon name="send" size={18} color="#fff" stroke={2.2} />

                ) : (
                  <>
                    <span style={{
                      width: 16, height: 16, borderRadius: 9999,
                      border: "2px solid rgba(255,255,255,0.4)",
                      borderTopColor: "#fff",
                      animation: "spin 1.6s cubic-bezier(0.5, 0, 0.5, 1) infinite",
                      display: "inline-block",
                    }} />
                    {t({ en: "Drafting — keep scrolling", no: "Skriver utkast – bla videre" })}
                  </>
                )}

function PreviewRow({ row, onEdit, onPreview, isLast, editLabel }) {
  const t = useT();
  const isLoading = row.status === "loading";
  const label = editLabel ?? t({ en: "Edit", no: "Endre" });

  const StatusIcon = () => {
    if (isLoading) {
      // Cover letter is the AI moment — use the FINN AI spinner Rive animation.
      // Other rows (CV fetch, etc.) keep the lightweight CSS spinner.
      if (row.id === "letter") {
        return (
          <div style={{
            width: 32, height: 32,
            display: "flex", alignItems: "center", justifyContent: "center",
            flexShrink: 0,
          }}>
            <RiveSpinner size={32} src="assets/finn_ai_spinner_allstates.riv" />
          </div>
        );
      }
      return (
        <div style={{
          width: 32, height: 32, borderRadius: 9999,
          background: "#f0f0f3",
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0,
        }}>
          <span style={{
            width: 16, height: 16, borderRadius: 9999,
            border: "2px solid rgba(0,99,251,0.20)",
            borderTopColor: "#0063fb",
            animation: "spin 1.6s cubic-bezier(0.5, 0, 0.5, 1) infinite",
            display: "inline-block",
          }} />
        </div>
      );
    }
    // "ai" rows render the same check-circle as "done"; the AI provenance is
    // carried by the inline AI mark next to the title (see titleSuffix below)
    // and the source pill (e.g. 'AI draft · editable').
    if (row.status === "done" || row.status === "ai") {
      return (
        <div style={{
          width: 32, height: 32,
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0, animation: "popin 520ms var(--ease-spring)",
        }}>
          <Icon name="check-circle" size={28} color="#1f8a3b" stroke={2} />
        </div>
      );
    }
    if (row.status === "queued") {
      return (
        <div style={{
          width: 32, height: 32, borderRadius: 9999,
          border: "1.5px solid #d4d4d4", background: "#fff",
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0, opacity: 0.85,
        }} />
      );
    }
    return (
      <div style={{
        width: 32, height: 32, borderRadius: 9999,
        background: "#fadddd",
        display: "flex", alignItems: "center", justifyContent: "center",
        flexShrink: 0,
      }}>
        <Icon name="alert" size={18} color="#cc1414" stroke={2.4} />
      </div>
    );
  };

  const pill = (() => {
    if (row.status === "ai")      return { bg: "#eaf2ff", fg: "#0063fb" };
    if (row.status === "missing") return { bg: "#fadddd", fg: "#cc1414" };
    return { bg: "#f0f0f3", fg: "#404040" };
  })();

  return (
    <div style={{
      borderTop: "0.5px solid #ededed",
      borderBottom: isLast ? "0.5px solid #ededed" : "none",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 16px" }}>
        <StatusIcon />
        <div style={{ flex: 1, minWidth: 0, animation: !isLoading ? "rowfade 260ms var(--ease-out)" : "none" }}>
          <div style={{
            display: "flex", alignItems: "center", gap: 8, marginBottom: 4,
            flexWrap: "wrap",
          }}>
            <p style={{
              fontSize: 16, fontWeight: 600, color: "#1d1d1d",
              margin: 0, lineHeight: 1.25, letterSpacing: -0.2,
              display: "inline-flex", alignItems: "center", gap: 6,
            }}>
              {row.title}
              {row.titleSuffix}
            </p>
            {row.source && (
              <span style={{
                fontSize: 11, fontWeight: 500,
                padding: "2px 8px", borderRadius: 9999,
                background: pill.bg, color: pill.fg,
                whiteSpace: "nowrap", letterSpacing: -0.05,
              }}>{row.source}</span>
            )}
          </div>
          {isLoading ? (
            <span className="skeleton" style={{ width: 160, height: 12 }} />
          ) : row.sub ? (
            <p style={{
              fontSize: 13,
              color: row.status === "missing" ? "#cc1414" : "#6b6b6b",
              margin: 0, lineHeight: 1.35,
            }}>{row.sub}</p>
          ) : null}
        </div>
        {row.preview && (
          <button
            className="press"
            onClick={() => { haptic("tap"); onPreview?.(); }}
            aria-label={t({ en: "Preview", no: "Forhåndsvis" })}
            style={{
              width: 36, height: 36, borderRadius: 9999,
              background: "#dceafe", border: 0, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name="eye" size={18} color="#0063fb" stroke={2} />
          </button>
        )}
        <button
          className="press"
          onClick={() => { if (!isLoading) { haptic("tap"); onEdit?.(); } }}
          disabled={isLoading}
          style={{
            display: "inline-flex", alignItems: "center", gap: 2,
            background: "transparent", border: 0,
            cursor: isLoading ? "not-allowed" : "pointer",
            color: isLoading ? "#a5a5a5" : "#0063fb",
            fontFamily: "inherit",
            fontSize: 15, fontWeight: 600, padding: "8px 2px 8px 8px",
            flexShrink: 0, minHeight: 44, letterSpacing: -0.1,
          }}>
          {label}
          <Icon name="chevron-right" size={16} color={isLoading ? "#a5a5a5" : "#0063fb"} stroke={2.2} />
        </button>
      </div>
    </div>
  );
}

function TailorSheet({ onDone, onClose }) {
  const t = useT();
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;
  const [step, setStep] = useState(0);
  const [picked, setPicked] = useState(null);

  const questions = [
    {
      q: t({ en: "How many years of leadership experience?", no: "Hvor mange års lederfaring har du?" }),
      hint: t({ en: "We'll mention this at the top of your cover letter.", no: "Vi nevner det øverst i søknadsbrevet." }),
      options: [
        t({ en: "Less than 2", no: "Mindre enn 2" }),
        t({ en: "2–5 years", no: "2–5 år" }),
        t({ en: "5–10 years", no: "5–10 år" }),
        t({ en: "More than 10", no: "Mer enn 10" }),
      ],
    },
    {
      q: t({ en: "Have you led distributed teams?", no: "Har du ledet distribuerte team?" }),
      hint: t({ en: "The employer flagged this as a plus.", no: "Arbeidsgiver oppgir at dette er en fordel." }),
      options: [
        t({ en: "Yes, for years", no: "Ja, flere år" }),
        t({ en: "Yes, briefly", no: "Ja, kort" }),
        t({ en: "No", no: "Nei" }),
      ],
    },
    {
      q: t({ en: "When can you start?", no: "Når kan du tiltre?" }),
      hint: t({ en: "We'll add this under 'Availability'.", no: "Vi legger det inn under «Tilgjengelighet»." }),
      options: [
        t({ en: "Right away", no: "Umiddelbart" }),
        t({ en: "Within 1 month", no: "Innen 1 måned" }),
        t({ en: "Within 3 months", no: "Innen 3 måneder" }),
        t({ en: "By arrangement", no: "Etter avtale" }),
      ],
    },
  ];
  const total = questions.length;
  const current = questions[step];

  function next() {
    haptic("tap");
    if (step + 1 >= total) {
      haptic("ok");
      onDone();
    } else {
      setStep(step + 1);
      setPicked(null);
    }
  }

  return (
    <div style={{
      position: "absolute", inset: 0, zIndex: 70,
      background: "rgba(0,0,0,.34)",
      display: "flex", flexDirection: "column",
      animation: "fadein 300ms var(--ease-modal)",

      <div style={{
        flex: 1, background: "#fff",
        borderTopLeftRadius: sheetRadius, borderTopRightRadius: sheetRadius,
        display: "flex", flexDirection: "column",
        animation: "slideup 440ms var(--ease-modal)",
      }}>
        <div style={{ display: "flex", justifyContent: "center", padding: "10px 0 4px" }}>
          <div style={{ width: 40, height: 5, borderRadius: 9999, background: "#d4d4d4" }} />
        </div>

        <div style={{ padding: "8px 8px 8px 16px", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 38, height: 38, borderRadius: 10,
            background: "#fff", padding: 2,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 4px 12px rgba(0,99,251,0.25)",
          }}>
            <AILogo size={34} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{ fontSize: 14, fontWeight: 600, color: "#1d1d1d", margin: 0, letterSpacing: -0.1 }}>
              {t({ en: "Tailor for this role", no: "Tilpass for denne jobben" })}
            </p>
            <p style={{ fontSize: 12, color: "#6b6b6b", margin: "2px 0 0" }}>
              {t({ en: `Question ${step + 1} of ${total}`, no: `Spørsmål ${step + 1} av ${total}` })}

          </div>
          <IconBtn icon="x" color="#1d1d1d" onClick={onClose} label={t({ en: "Close", no: "Lukk" })} />

        <div style={{ height: 4, margin: "0 16px 18px", background: "#ededed", borderRadius: 9999, overflow: "hidden" }}>
          <div style={{
            width: `${((step + 1) / total) * 100}%`,
            height: "100%", background: "#0063fb",
            transition: "width 320ms var(--ease-out)",
          }} />
        </div>

        <div className="scroll-area" style={{ flex: 1, overflowY: "auto", padding: "0 20px" }}>
          <p style={{ fontSize: 13, color: "#6b6b6b", margin: "0 0 6px", letterSpacing: 0.1 }}>
            {t({ en: "ASSISTANT", no: "ASSISTENT" })}

            fontSize: 22, fontWeight: 700, color: "#1d1d1d",
            margin: "0 0 8px", letterSpacing: -0.3, lineHeight: 1.25,
            animation: "rowfade 260ms var(--ease-out)",
          }}>{current.q}</h2>

function InputField({ label, value, onChange, type = "text", autoComplete, placeholder, last }) {
  const [focused, setFocused] = useState(false);
  return (
    <div style={{
      display: "flex", flexDirection: "column",
      padding: "8px 4px 12px",

        marginBottom: 2, letterSpacing: 0.1,
        transition: "color 160ms var(--ease-out)",
      }}>{label.toUpperCase()}</label>
      <input
        type={type} value={value}
        autoComplete={autoComplete} placeholder={placeholder}
        onChange={(e) => onChange?.(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => setFocused(false)}
        style={{
          fontSize: 17, color: "#1d1d1d", fontWeight: 500,

    </div>
  );
}

function StorymapView({ version, onVersionChange, stories = STORYMAP.stories, onMoveStory, onReset }) {
  const VERSIONS = [
    { id: "all", label: "All releases" },
    { id: "mvp", label: "MVP only" },
    { id: "v1",  label: "1.0 only" },
    { id: "v2",  label: "2.0 only" },
  ];
  const showRow = (r) => version === "all" || version === r;
  const cols = STORYMAP.backbone.length;
  const [dragOver, setDragOver] = useState(null); // {taskId, release}

  function onDragStart(taskId, release, idx) {
    return (e) => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("application/json",
        JSON.stringify({ taskId, release, idx }));
      // Some browsers need a text/plain fallback for the drag to register.
      try { e.dataTransfer.setData("text/plain", "story"); } catch (_) {}
    };
  }
  function onDragOver(taskId, release) {
    return (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      setDragOver({ taskId, release });
    };
  }
  function onDragLeaveCell() { setDragOver(null); }
  function onDrop(taskId, release) {
    return (e) => {
      e.preventDefault();
      setDragOver(null);
      let data;
      try { data = JSON.parse(e.dataTransfer.getData("application/json")); }
      catch (_) { return; }
      if (!data || data.taskId !== taskId) return; // only same-column moves
      if (!onMoveStory) return;
      onMoveStory(taskId, data.release, data.idx, release);
    };
  }
  const releases = [
    { id: "mvp", label: "MVP", now: true },
    { id: "v1",  label: "1.0", now: false },
    { id: "v2",  label: "2.0", now: false },
  ].filter(r => showRow(r.id));

  return (
    <section className="surface" aria-label="User-story map">
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <h1 style={{ margin: 0 }}>Storymap</h1>
        {onReset && (
          <button onClick={onReset}
            style={{
              appearance: "none", border: "1px solid var(--hair)",
              background: "#fff", borderRadius: 999,
              padding: "6px 12px", fontSize: 12, fontWeight: 600,
              color: "var(--ink-mute)", cursor: "pointer",
              fontFamily: "inherit",
            }}>Reset to defaults</button>
        )}
      </div>
      <p className="sub">
        Activities across the top, backbone tasks underneath, MVP / 1.0 / 2.0 release rows slicing horizontally.
        <strong> Drag a story card between rows in the same column</strong> — feature stories
        (<em>Job Match, Tailored CV, Magic Apply</em>) rewire the prototype live. Each card carries a
        Jira chip linking to <a href={JIRA_BASE + "JEA-1092"} target="_blank" rel="noopener noreferrer"
        style={{ color: "var(--finn-blue)", fontWeight: 600 }}>JEA Agentic Apply</a> tickets — amber "No Jira" badges
        flag stories the team should consider ticketing. Edits persist on this device.
      </p>

      <div className="sm-version-toggle" role="tablist" aria-label="Release filter">
        {VERSIONS.map(v => (
          <button key={v.id} role="tab" aria-selected={version === v.id}
            className={version === v.id ? "active" : ""}
            onClick={() => onVersionChange(v.id)}>
            {v.label}
          </button>
        ))}
      </div>

      <div className="sm-scroll">
        <div className="sm-grid" style={{ "--sm-cols": cols }}>
          {/* Row 1 — Activities (each spans its backbone tasks) */}
          <div className="sm-rail-head" aria-hidden="true" />
          {STORYMAP.activities.map(a => (
            <div key={a.id} className="sm-act" style={{ gridColumn: "span " + a.tasks.length }}>
              {a.title}
            </div>
          ))}

          {/* Row 2 — Backbone tasks (one per column) */}
          <div className="sm-rail-head" aria-hidden="true">
            <span className="sm-rail-head-label">Tasks</span>
          </div>
          {STORYMAP.backbone.map(b => (
            <div key={b.id} className="sm-back">{b.title}</div>
          ))}

          {/* Rows 3+ — Release slices */}
          {releases.map((r, ri) => (
            <React.Fragment key={r.id}>
              <div className={"sm-rail " + r.id + (ri === releases.length - 1 ? " sm-row-last-rail" : "")}>
                <span className="badge">{r.label}{r.now ? " · now" : ""}</span>
              </div>
              {STORYMAP.backbone.map((b) => {
                const cellStories = (stories[b.id] && stories[b.id][r.id]) || [];
                const isOver = dragOver && dragOver.taskId === b.id && dragOver.release === r.id;
                return (
                  <div key={b.id + r.id}
                    className={"sm-cell " + (ri === releases.length - 1 ? "sm-row-last-cell" : "") + (isOver ? " sm-cell-over" : "")}
                    onDragOver={onDragOver(b.id, r.id)}
                    onDragLeave={onDragLeaveCell}
                    onDrop={onDrop(b.id, r.id)}>
                    {cellStories.length === 0 ? (
                      <div className="sm-empty" />
                    ) : cellStories.map((s, si) => (
                      <SmCard key={si} story={s} release={r.id} now={r.now}
                        draggable
                        onDragStart={onDragStart(b.id, r.id, si)} />
                    ))}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    </section>
  );
}

function SmapNode({ x, y, w = 152, h = 44, title, sub, kind }) {
  return (
    <g className={"smap-node " + (kind || "")} transform={"translate(" + x + " " + y + ")"}>
      <rect width={w} height={h} />
      <text className="title" x={w / 2} y={h / 2 - 2} textAnchor="middle">{title}</text>

    </g>
  );
}

function SmapArrow({ id, x1, y1, x2, y2, kind, label, labelOffset = -6 }) {
  // Right-angle Manhattan-style path: vertical first, then horizontal.
  // For simple straight cases, draws a line.
  const sameCol = x1 === x2;
  const sameRow = y1 === y2;
  const d = sameCol || sameRow
    ? `M${x1} ${y1} L${x2} ${y2}`
    : `M${x1} ${y1} L${x1} ${(y1 + y2) / 2} L${x2} ${(y1 + y2) / 2} L${x2} ${y2}`;
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  return (
    <g>
      <path className={"smap-link " + (kind || "")} d={d} markerEnd={`url(#smap-arrow-${kind || "default"})`} />
      {label && (
        <text className={"smap-edgelabel " + (kind || "")} x={midX} y={midY + labelOffset} textAnchor="middle">
          {label}
        </text>
      )}
    </g>
  );
}

function TopNav({ view, onChange }) {
  const tabs = [
    { id: "prototype", label: "Prototype" },
    { id: "tree",      label: "Opportunity tree" },
    { id: "matrix",    label: "Impact–Effort" },
    { id: "storymap",  label: "Storymap" },
    { id: "handoff",   label: "Handoff" },
  ];
  const containerRef = useRef(null);
  const btnRefs = useRef({});
  const [ind, setInd] = useState({ left: 0, width: 0, ready: false });

  // Measure the active tab once mounted and on every change of `view` so the
  // pill indicator slides under the label rather than each label colouring in
  // independently. ResizeObserver handles layout shifts (font load, resize).
  useEffect(() => {
    function measure() {
      const btn = btnRefs.current[view];
      const wrap = containerRef.current;
      if (!btn || !wrap) return;
      const wrapRect = wrap.getBoundingClientRect();
      const r = btn.getBoundingClientRect();
      setInd({ left: r.left - wrapRect.left, width: r.width, ready: true });
    }
    measure();
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (ro && containerRef.current) ro.observe(containerRef.current);
    window.addEventListener("resize", measure);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", measure); };
  }, [view]);

  return (
    <nav className="topnav" aria-label="Prototype views">
      <div className="topnav-inner" role="tablist" ref={containerRef}>
        <div className="topnav-indicator" aria-hidden="true"
          style={{ left: ind.left, width: ind.width, opacity: ind.ready ? 1 : 0 }} />
        {tabs.map(t => (
          <button
            key={t.id}
            ref={el => { btnRefs.current[t.id] = el; }}
            role="tab"
            aria-selected={view === t.id}
            className={view === t.id ? "active" : ""}
            onClick={() => onChange(t.id)}>
            <span className="tdot" aria-hidden="true" />
            {t.label}
          </button>
        ))}
      </div>
    </nav>
  );
}

function ImpactEffortView({ solutions = SOLUTIONS, onMoveSolution, onReset }) {
  const [hoverN, setHoverN] = useState(null);
  const [draggingN, setDraggingN] = useState(null);
  const stageRef = useRef(null);
  // Map score 0..10 → percentage inside the plot area.
  // X (effort) low on left, high on right. Y (impact) low at bottom, high at top.
  const xPct = v => (v / 10) * 100;
  const yPct = v => (1 - v / 10) * 100;
  const selected = solutions.find(s => s.n === hoverN) || null;

  function handlePointerDown(n) {
    return function (e) {
      e.preventDefault();
      setDraggingN(n);
      setHoverN(n);
      const stage = stageRef.current;
      function onMove(ev) {
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        const x = (ev.clientX - rect.left) / rect.width;
        const y = (ev.clientY - rect.top) / rect.height;
        const effort = Math.max(0, Math.min(10, +(x * 10).toFixed(1)));
        const impact = Math.max(0, Math.min(10, +((1 - y) * 10).toFixed(1)));
        onMoveSolution && onMoveSolution(n, impact, effort);
      }
      function onUp() {
        setDraggingN(null);
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        haptic("tap");
      }
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    };
  }

  return (
    <section className="surface" aria-label="Impact and effort matrix">
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <h1 style={{ margin: 0 }}>Impact–Effort matrix</h1>
        {onReset && (
          <button onClick={onReset}
            style={{
              appearance: "none", border: "1px solid var(--hair)",
              background: "#fff", borderRadius: 999,
              padding: "6px 12px", fontSize: 12, fontWeight: 600,
              color: "var(--ink-mute)", cursor: "pointer",
              fontFamily: "inherit",
            }}>Reset positions</button>
        )}
      </div>
      <p className="sub">
        Every solution from the opportunity tree, plotted by estimated lift on apply-step conversion (impact)
        and shipping cost (effort). <strong>Drag any dot</strong> to update its scores; tap the table to focus.
        Edits persist on this device.
      </p>

      <div className="matrix-wrap">
        <div className="matrix-stage" role="img" aria-label="Impact and effort scatter plot">
          <div className="matrix-grid" ref={stageRef}>
            <div className="matrix-axisline matrix-axis-y" />
            <div className="matrix-axisline matrix-axis-x" />

            <div className="matrix-quad" style={{ top: "8%",  left: "8%"  }}>
              <span className="q-title">Quick wins</span>
              high impact · low effort
            </div>
            <div className="matrix-quad" style={{ top: "8%",  right: "8%", textAlign: "right" }}>
              <span className="q-title">Big bets</span>
              high impact · high effort
            </div>
            <div className="matrix-quad" style={{ bottom: "8%", left: "8%" }}>
              <span className="q-title">Fill-ins</span>
              low impact · low effort
            </div>
            <div className="matrix-quad" style={{ bottom: "8%", right: "8%", textAlign: "right" }}>
              <span className="q-title">Money pit</span>
              low impact · high effort
            </div>

            {solutions.map(s => (
              <button
                key={s.n}
                className={"matrix-dot " + s.key + ((hoverN === s.n || draggingN === s.n) ? " active" : "")}
                style={{
                  left: xPct(s.effort) + "%",
                  top: yPct(s.impact) + "%",
                  cursor: draggingN === s.n ? "grabbing" : "grab",
                  transition: draggingN === s.n ? "none" : undefined,
                }}
                onPointerDown={handlePointerDown(s.n)}
                onMouseEnter={() => setHoverN(s.n)}
                onMouseLeave={() => { if (draggingN === null) setHoverN(null); }}
                onFocus={() => setHoverN(s.n)}
                aria-label={"Solution " + s.n + ": " + s.title + ". Impact " + s.impact + ", effort " + s.effort + "."}>
                {s.n}
              </button>
            ))}
          </div>

          <div className="matrix-axis-label y">Impact →</div>
          <div className="matrix-axis-label x">Effort →</div>
          <div className="matrix-tick y-low">low</div>
          <div className="matrix-tick y-high">high</div>
          <div className="matrix-tick x-low">low</div>
          <div className="matrix-tick x-high">high</div>
        </div>

        <aside className="matrix-side">
          <div className="matrix-legend">
            <h4>Source problem</h4>
            <div className="row"><span className="swatch" style={{ background: "#0063fb" }} /><span>A · Latency (39% drop-off)</span></div>
            <div className="row"><span className="swatch" style={{ background: "#6f3bd0" }} /><span>B · Trust / control (36%)</span></div>
            <div className="row"><span className="swatch" style={{ background: "#1f8a3b" }} /><span>C · Tech friction (17%)</span></div>
          </div>

          <div className="matrix-detail">
            {selected ? (
              <>
                <div className={"pill " + selected.key}>Problem {selected.problem}</div>
                <div className="title">#{selected.n} · {selected.title}</div>
                <div className="scores">
                  <span>Impact <b>{selected.impact}/10</b></span>
                  <span>Effort <b>{selected.effort}/10</b></span>
                </div>
                <div style={{ marginTop: 8 }}>
                  <JiraChip jira={selected.jira} />
                </div>
              </>
            ) : (
              <div className="empty">Hover or tap a dot to see the solution it represents.</div>
            )}
          </div>
        </aside>
      </div>

      <table className="matrix-table" aria-label="Solutions list">
        <thead>
          <tr>
            <th></th>
            <th>Solution</th>
            <th>Source</th>
            <th>Jira</th>
            <th className="num">Impact</th>
            <th className="num">Effort</th>
          </tr>
        </thead>
        <tbody>
          {[...solutions].sort((a, b) => (b.impact - b.effort) - (a.impact - a.effort)).map(s => (
            <tr key={s.n}
                onMouseEnter={() => setHoverN(s.n)}
                onMouseLeave={() => setHoverN(null)}>
              <td><span className={"ref " + s.key}>{s.n}</span></td>
              <td>{s.title}</td>
              <td>{s.problem}</td>
              <td><JiraChip jira={s.jira} /></td>
              <td className="num">{s.impact}</td>
              <td className="num">{s.effort}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </section>
  );
}

// ─── Confetti burst — small particle celebration ───────────────────────────
// Used on the Confirmation screen (Peak-End amplifier) and by the Konami egg.
function ConfettiBurst({ count = 32, spread = 180, gravity = 220, palette }) {
  const colors = palette || ["#0063fb", "#62E3FF", "#1f8a3b", "#ffce2e", "#6f3bd0", "#ff6fb3"];
  const particles = React.useMemo(() => {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI + Math.random() * Math.PI; // upward fan
      const speed = 0.5 + Math.random() * 0.7;
      const dx = Math.cos(angle) * spread * speed + (Math.random() - 0.5) * 30;
      const dy = Math.sin(angle) * spread * speed + gravity * (0.4 + Math.random() * 0.8);
      arr.push({
        dx, dy,
        rot: (Math.random() - 0.5) * 720,
        color: colors[i % colors.length],
        w: 5 + Math.random() * 5,
        h: (Math.random() < 0.4 ? 0.4 : 1) * (5 + Math.random() * 5),
        round: Math.random() < 0.18,
        delay: Math.random() * 90,
        dur: 1100 + Math.random() * 1300,
      });
    }
    return arr;
  }, [count, spread, gravity, colors.join(",")]);
  return (
    <div className="confetti" aria-hidden="true">
      {particles.map((p, i) => (
        <span key={i} className="cf" style={{
          background: p.color,
          width: p.w, height: p.h,
          borderRadius: p.round ? 9999 : 1.5,
          "--dx": p.dx + "px",
          "--dy": p.dy + "px",
          "--rot": p.rot + "deg",
          animationDelay: p.delay + "ms",
          animationDuration: p.dur + "ms",
        }} />
      ))}
    </div>
  );
}

// ─── Password gate ─────────────────────────────────────────────────────────
// Client-side only — anyone with web-dev know-how can view source and read
// the password. Fine for casual share-with-team gating, not for real secrets.
const APP_PASSWORD = "simba";
function PasswordGate({ onUnlock }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState(false);
  function submit(e) {
    e.preventDefault();
    if (pw.trim().toLowerCase() === APP_PASSWORD) {
      haptic("ok");
      try { sessionStorage.setItem("vend-unlocked", "1"); } catch (_) {}
      onUnlock();
    } else {
      haptic("err");
      setErr(true);
    }
  }
  return (
    <div className="pwgate">
      <div className="pwgate-card">
        <h1>FINN Jobs · Apply prototype</h1>
        <p className="pwgate-sub">Internal preview. Enter the password to continue.</p>
        <form onSubmit={submit}>
          <input
            type="password"
            placeholder="Password"
            value={pw}
            autoFocus
            autoComplete="current-password"
            className={err ? "err" : ""}
            onChange={(e) => { setPw(e.target.value); if (err) setErr(false); }}
          />
          {err && <p className="pwgate-err">Wrong password. Try again.</p>}
          <button type="submit">Enter</button>
        </form>
        <p className="pwgate-foot">Ask Lee for access.</p>
      </div>
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = useState(() => {

// ─── Helpers: derive feature flags from a (potentially edited) storymap ──
const RELEASE_ORDER = { mvp: 0, v1: 1, v2: 2 };
function featuresInVersion(stories, version) {
  const cur = RELEASE_ORDER[version] ?? 0;
  const set = new Set();
  for (const task of Object.values(stories)) {
    for (const r of ["mvp", "v1", "v2"]) {
      if ((RELEASE_ORDER[r] ?? 0) <= cur) {
        (task[r] || []).forEach(s => { if (s.feature) set.add(s.feature); });
      }
    }
  }
  return set;
}
function deepCloneJSON(o) { return JSON.parse(JSON.stringify(o)); }

// ─── Feedback bridge — copies a Jira-formatted note + opens JEA-1179 ──────
function FeedbackBridge({ context, onClose }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [showToast, setShowToast] = useState(false);
  const ctxLine =
    "Prototype URL: " + (typeof window !== "undefined" ? window.location.href : "") +
    "\nView: " + (context.view || "—") +
    (context.screen   ? "\nScreen: "   + context.screen   : "") +
    (context.platform ? "\nPlatform: " + context.platform : "") +
    (context.version  ? "\nVersion: "  + context.version  : "");

  async function submit() {
    if (!text.trim()) return;
    setBusy(true);
    const payload =
      "Prototype feedback\n\n" + ctxLine + "\n\n— —\n" + text.trim();
    try {
      await navigator.clipboard.writeText(payload);
      setShowToast(true);
      setTimeout(() => {
        window.open("https://nmp-jira.atlassian.net/browse/JEA-1179?focusedCommentId=&focusedAddCommentDialog=true", "_blank", "noopener");
      }, 250);
      setTimeout(() => { onClose(); }, 1200);
    } catch (e) {
      // Fallback: open Jira with the comment in the URL hash for manual paste.
      window.open("https://nmp-jira.atlassian.net/browse/JEA-1179", "_blank", "noopener");
      onClose();
    }
  }

  return (
    <>
      {showToast && <div className="fb-toast">Copied to clipboard · Paste into the Jira comment box</div>}
      <div className="fb-backdrop" onClick={onClose} />
      <div className="fb-modal" role="dialog" aria-label="Leave feedback">
        <h2>Leave feedback</h2>
        <p className="lead">
          We'll copy your note to your clipboard and open <span className="ticket-pill">JEA-1179</span> in Jira.
          Paste into the comment box there to post — Jira will tag you as the author automatically.
        </p>
        <div className="fb-context">
          {context.view     && <span className="ctx"><span className="k">view:</span> {context.view}</span>}
          {context.screen   && <span className="ctx"><span className="k">screen:</span> {context.screen}</span>}
          {context.platform && <span className="ctx"><span className="k">platform:</span> {context.platform}</span>}
          {context.version  && <span className="ctx"><span className="k">version:</span> {context.version}</span>}
        </div>
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          autoFocus
          placeholder="What's working? What's confusing? Anything you'd ship differently?"
        />
        <div className="fb-actions">
          <button className="secondary" onClick={onClose} type="button">Cancel</button>
          <button className="primary" onClick={submit} disabled={!text.trim() || busy}>
            Copy & open in Jira
          </button>
        </div>
        <p className="footnote">
          Feedback lands on JEA-1179 in <strong>nmp-jira</strong>. You must be logged in to Jira to post.
        </p>
      </div>
    </>
  );
}

function AppShell() {
  const isMobile = useIsMobile();
  const [mobSheet, setMobSheet] = useState(false);
  const [feedbackOpen, setFeedbackOpen] = useState(false);
  const [view, setView] = useState("prototype"); // prototype | tree | matrix | storymap
  const [storyVersion, setStoryVersion] = useState("all"); // all | mvp | v1 | v2
  const [version, setVersion] = useState("mvp"); // dev panel toggle: mvp | v1 | v2
  const [platform, setPlatform] = useState("ios"); // ios | android | web (toggle UI hidden for now)
  const [lang, setLang] = useState("en"); // en (default) | no

  // Editable copies of the strategy data — drag-drop in the Storymap and
  // Impact-Effort views update these and persist to localStorage.
  // Bump SCHEMA when the shape changes (jira fields added, etc.) so stale
  // localStorage from older builds is discarded automatically.
  const SCHEMA = 3;
  const [stories, setStories] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-storymap-v") || "0", 10);
      const saved = localStorage.getItem("vend-storymap");
      if (saved && v === SCHEMA) return JSON.parse(saved);
    } catch (_) {}
    return deepCloneJSON(STORYMAP.stories);
  });
  useEffect(() => {
    try {
      localStorage.setItem("vend-storymap", JSON.stringify(stories));
      localStorage.setItem("vend-storymap-v", String(SCHEMA));
    } catch (_) {}
  }, [stories]);
  const [solutions, setSolutions] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-solutions-v") || "0", 10);
      const saved = localStorage.getItem("vend-solutions");
      if (saved && v === SCHEMA) return JSON.parse(saved);
    } catch (_) {}
    return SOLUTIONS.map(s => ({ ...s }));
  });
  useEffect(() => {
    try {
      localStorage.setItem("vend-solutions", JSON.stringify(solutions));
      localStorage.setItem("vend-solutions-v", String(SCHEMA));
    } catch (_) {}
  }, [solutions]);

  // Derived feature flags (live across renders).
  const features = featuresInVersion(stories, version);
  const showJobMatch    = features.has("job-match");
  const showTailoredCV  = features.has("tailored-cv");
  const enableMagicApply = features.has("magic-apply");

  // Drag-drop callbacks for the strategy views.
  function moveStory(taskId, fromRelease, idx, toRelease) {
    if (fromRelease === toRelease) return;
    setStories(prev => {
      const next = deepCloneJSON(prev);
      const task = next[taskId] || (next[taskId] = { mvp: [], v1: [], v2: [] });
      const src = task[fromRelease] || [];
      const moved = src.splice(idx, 1)[0];
      if (!moved) return prev;
      task[toRelease] = task[toRelease] || [];
      task[toRelease].push(moved);
      return next;
    });
  }
  function moveSolution(n, impact, effort) {
    setSolutions(prev => prev.map(s => s.n === n ? { ...s, impact, effort } : s));
  }
  function resetStorymap() {
    setStories(deepCloneJSON(STORYMAP.stories));
    try { localStorage.removeItem("vend-storymap"); } catch (_) {}
  }
  function resetMatrix() {
    setSolutions(SOLUTIONS.map(s => ({ ...s })));
    try { localStorage.removeItem("vend-solutions"); } catch (_) {}
  }

  // Inspect mode — click any element on the iPhone to see its computed specs.
  const [inspect, setInspect] = useState(false);
  const [inspectInfo, setInspectInfo] = useState(null);
  function onStageClick(e) {
    if (!inspect) return;
    e.preventDefault();
    e.stopPropagation();
    const el = e.target;
    if (!el || el.nodeType !== 1) return;
    const cs = window.getComputedStyle(el);
    const rect = el.getBoundingClientRect();
    setInspectInfo({
      tag: el.tagName.toLowerCase(),
      cls: (el.className && typeof el.className === "string") ? el.className.slice(0, 60) : "",
      w: Math.round(rect.width),
      h: Math.round(rect.height),
      font: cs.fontFamily.split(",")[0].replace(/['"]/g, ""),
      size: cs.fontSize,
      weight: cs.fontWeight,
      color: cs.color,
      bg: cs.backgroundColor,
      pad: cs.padding,
      radius: cs.borderRadius,
      x: e.clientX, y: e.clientY,
    });
  }
  const [userState, setUserState] = useState("ready");
  const [screen, setScreen] = useState("jobad");
  const [overlay, setOverlay] = useState(null);
  const [loadingPhase, setLoadingPhase] = useState("ready");
  const [cvParams, setCvParams] = useState({ initialSource: "profile", uploadMode: false });
  // True from CV-picker open until full commit/close. Keeps the picker mounted
  // underneath the CV preview so 'Back' reveals it without a slide-up re-mount.
  const [cvPickerActive, setCvPickerActive] = useState(false);
  const [applicationStatus, setApplicationStatus] = useState("draft"); // draft | sent
  const [activityTab, setActivityTab] = useState("drafts");

  // v2.0 'Magic Apply' state — auto-ticks each row then sends automatically.
  const [magicMode, setMagicMode] = useState(false);
  const [magicStep, setMagicStep] = useState(0);
  const [magicSent, setMagicSent] = useState(false); // confirms a magic send for the confirmation copy
  const magicTimersRef = useRef([]);
  function cancelMagic() {
    magicTimersRef.current.forEach(clearTimeout);
    magicTimersRef.current = [];
  }
  function startMagicApply() {
    cancelMagic();
    setMagicMode(true);
    setMagicStep(0);
    setMagicSent(false);
    setUserState("ready");
    setLoadingPhase("ready");
    setOverlay(null);
    setScreen("preview");
    const rowCount = 4;
    const stepGap = 700; // ms between each row tick
    const warmup  = 700; // ms after sheet opens before first tick
    for (let i = 1; i <= rowCount; i++) {
      magicTimersRef.current.push(setTimeout(() => {
        setMagicStep(i);
        haptic("tap");
      }, warmup + (i - 1) * stepGap));
    }
    magicTimersRef.current.push(setTimeout(() => {
      haptic("ok");
      setApplicationStatus("sent");
      setMagicSent(true);
      setMagicMode(false);
      setMagicStep(0);
      setScreen("confirmation");
    }, warmup + rowCount * stepGap + 500));
  }
  useEffect(() => () => cancelMagic(), []);

  // Konami code easter egg → confetti shower + toast.
  // ↑ ↑ ↓ ↓ ← → ← → B A (the original sequence).
  const [eggFiring, setEggFiring] = useState(false);
  const eggBufferRef = useRef([]);
  useEffect(() => {
    const SEQUENCE = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown",
                      "ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
    function onKey(e) {
      // Ignore when typing into inputs so we don't hijack real typing.
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      eggBufferRef.current.push(e.key.length === 1 ? e.key.toLowerCase() : e.key);
      if (eggBufferRef.current.length > SEQUENCE.length) {
        eggBufferRef.current = eggBufferRef.current.slice(-SEQUENCE.length);
      }
      if (eggBufferRef.current.join(",") === SEQUENCE.join(",")) {
        eggBufferRef.current = [];
        haptic("ok");
        setEggFiring(true);
        setTimeout(() => setEggFiring(false), 3200);
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function openCV(params = {}) {
    setCvParams({
      initialSource: params.source || "profile",
      uploadMode: !!params.uploadMode,
    });
    setOverlay("cv-preview");
  }

  function startProgressiveLoad() {
    setLoadingPhase("loading-cv");
    setTimeout(() => setLoadingPhase("loading-letter"), 400);
    setTimeout(() => setLoadingPhase("ready"), 1700);
  }

  function goApply() {
    if (userState === "not-logged-in") { setOverlay("login"); return; }
    if (userState === "already-applied") return; // shouldn't be tappable
    if (enableMagicApply) { startMagicApply(); return; }
    setScreen("preview");
    startProgressiveLoad();
  }
  function send() {
    setApplicationStatus("sent");
    setScreen("confirmation");
  }
  function reset() {
    cancelMagic();
    setOverlay(null); setScreen("jobad");
    setLoadingPhase("ready");
    setApplicationStatus("draft");
    setMagicMode(false);
    setMagicStep(0);
    setMagicSent(false);
  }
  function openActivity(tab = "drafts") {
    setActivityTab(tab);
    setOverlay(null);
    setScreen("activity");
  }
  function mockLogin() {
    setUserState("ready");
    setOverlay(null);
    setScreen("preview");
    startProgressiveLoad();
  }

  let bodyScreen = null;
  if (screen === "jobad") {
    bodyScreen = (
      <JobDetailScreen
        job={JOB}
        onApply={goApply}
        onBack={() => {}}
        userState={userState}
      />
    );
  } else if (screen === "preparing") {
    bodyScreen = <PreparingScreen job={JOB} onReady={() => setScreen("preview")} />;
  } else if (screen === "preview") {
    bodyScreen = <JobDetailScreen job={JOB} onApply={() => {}} onBack={() => {}} userState={userState} />;
  } else if (screen === "confirmation") {
    bodyScreen = <ConfirmationScreen job={JOB} onDone={() => openActivity("sent")} onReset={reset} magic={magicSent} />;
  } else if (screen === "activity") {
    bodyScreen = (
      <ActivityScreen
        job={JOB}
        onBack={() => setScreen("jobad")}
        applicationStatus={applicationStatus}
        initialTab={activityTab}
        onOpenDraft={() => {
          // Resume the draft: re-open the preview sheet (already-loaded, no progressive load)
          setScreen("preview");
          setLoadingPhase("ready");
        }}
      />
    );
  }

  return (
    <>
      <div className="site-header">
        <div className="site-brand" aria-label="FINN User Connect">
          <img
            className="mark"
            src="assets/finn-logo.png"
            alt="FINN"
          />
          <span className="divider" aria-hidden="true" />
          <span className="wordmark">User Connect</span>
        </div>
        <TopNav view={view} onChange={setView} />
      </div>
      {view === "tree" && (
        <div key="tree-view" style={{ animation: "fadeup 420ms var(--ease-modal)" }}>
          <OpportunityTreeView />
        </div>
      )}
      {view === "matrix" && (
        <div key="matrix-view" style={{ animation: "fadeup 420ms var(--ease-modal)" }}>
          <ImpactEffortView
            solutions={solutions}
            onMoveSolution={moveSolution}
            onReset={resetMatrix}
          />
        </div>
      )}
      {view === "storymap" && (
        <div key="storymap-view" style={{ animation: "fadeup 420ms var(--ease-modal)" }}>
          <StorymapView
            version={storyVersion}
            onVersionChange={setStoryVersion}
            stories={stories}
            onMoveStory={moveStory}
            onReset={resetStorymap}
          />
        </div>
      )}
      {view === "handoff" && (
        <div key="handoff-view" style={{ animation: "fadeup 420ms var(--ease-modal)" }}>
          <HandoffView />
        </div>
      )}
      {inspect && inspectInfo && (
        <div className="inspect-pop" style={{
          left: Math.min(inspectInfo.x + 14, window.innerWidth - 300),
          top:  Math.min(inspectInfo.y + 14, window.innerHeight - 200),
        }}>
          <span className="tag">{inspectInfo.tag}</span>
          <div><span className="key">size</span> <span className="val">{inspectInfo.w}×{inspectInfo.h}</span></div>
          <div><span className="key">font</span> <span className="val">{inspectInfo.font} · {inspectInfo.size} · {inspectInfo.weight}</span></div>
          <div><span className="key">color</span> <span className="val">{inspectInfo.color}</span></div>
          <div><span className="key">bg</span> <span className="val">{inspectInfo.bg}</span></div>
          <div><span className="key">padding</span> <span className="val">{inspectInfo.pad}</span></div>
          <div><span className="key">radius</span> <span className="val">{inspectInfo.radius}</span></div>
          {inspectInfo.cls && <div style={{ marginTop: 6, color: "#9eb3ff" }}>{inspectInfo.cls}</div>}
        </div>
      )}
      {eggFiring && (
        <>
          <div className="egg-overlay">
            <div style={{ position: "absolute", left: "50%", top: "50%", width: 0, height: 0 }}>
              <ConfettiBurst count={80} spread={420} gravity={520} />
            </div>
          </div>
          <div className="egg-toast">🎉 You found the easter egg!</div>
        </>
      )}
      {view === "prototype" && (
    <div className="layout">
      <LangCtx.Provider value={lang}>
      <div className={"stage" + (inspect ? " inspect-active" : "")} onClickCapture={onStageClick}>
        <Device platform={platform}>
          <div style={{
            position: "absolute", inset: 0,
            display: "flex", flexDirection: "column",
            color: "#1d1d1d",
          }}>
            {bodyScreen}
          </div>

          {screen === "preview" && (
            <ApplicationPreviewSheet
              job={JOB}
              state={userState}
              loadingPhase={loadingPhase}
              version={version}
              magicMode={magicMode}
              magicStep={magicStep}
              showJobMatch={showJobMatch}
              onClose={() => { cancelMagic(); setMagicMode(false); setScreen("jobad"); }}
              onSend={send}
              onOpenLetter={() => setOverlay("letter")}
              onOpenCV={() => openCV({ source: "profile" })}
              onOpenEdit={(rowId) => {
                if (rowId === "cv") setCvPickerActive(true);
                setOverlay("edit:" + rowId);
              }}
              onOpenActivity={() => openActivity("drafts")}
              onFillMissing={() => {
                const rowId = userState === "missing-personalia" ? "personalia"
                            : userState === "missing-cv" ? "cv"
                            : "questions";
                if (rowId === "cv") setCvPickerActive(true);
                setOverlay("edit:" + rowId);
              }}
            />
          )}
          {overlay === "letter" && (
            <CoverLetterSheet
              onClose={() => setOverlay(null)}
              onOpenSelectFile={() => setOverlay("select-letter")}
            />
          )}
          {overlay === "login" && (
            <LoginSheet
              onClose={() => setOverlay(null)}
              onLogin={mockLogin}
            />
          )}
          {overlay === "select-letter" && (
            <SelectLetterSheet
              onClose={() => setOverlay("letter")}
              onPick={() => setOverlay(null)}
            />
          )}
          {/* Picker stays mounted under CV preview so 'Back' from the preview
              reveals it instantly — no slide-up re-mount jump. */}
          {((overlay && overlay.startsWith("edit:")) ||
            (overlay === "cv-preview" && cvPickerActive)) && (
            <EditSheet
              rowId={
                overlay && overlay.startsWith("edit:")
                  ? overlay.split(":")[1]
                  : "cv"
              }
              showTailoredCV={showTailoredCV}
              onClose={() => {
                const rowId = (overlay && overlay.startsWith("edit:"))
                  ? overlay.split(":")[1] : "cv";
                if (userState === `missing-${rowId}`) setUserState("ready");
                setCvPickerActive(false);
                setOverlay(null);
              }}
              onOpenCV={(params) => openCV(params)}
            />
          )}
          {overlay === "cv-preview" && (
            <CVPreviewSheet
              onClose={() => { setCvPickerActive(false); setOverlay(null); }}
              onBack={() => setOverlay("edit:cv")}
              onCommit={() => { setCvPickerActive(false); setOverlay(null); }}
              initialSource={cvParams.initialSource}
              uploadMode={cvParams.uploadMode}
            />
          )}
        </Device>
      </div>
      </LangCtx.Provider>

      {isMobile && !mobSheet && (
        <button className="mob-fab" onClick={() => { haptic("tap"); setMobSheet(true); }}
          aria-label="Open dev controls">
          <Icon name="edit" size={22} color="#fff" stroke={2.2} />
        </button>
      )}
      {isMobile && mobSheet && (
        <div className="mob-sheet-back" onClick={() => setMobSheet(false)} />
      )}
      <div
        className={"dev-panel" + (isMobile && !mobSheet ? " dev-panel-mobile-hidden" : "")}
        style={isMobile ? {
          position: "fixed", left: 0, right: 0, bottom: 0,
          top: "auto", maxHeight: "82vh", zIndex: 130,
          borderRadius: "22px 22px 0 0",
          margin: 0, padding: "12px 18px 24px",
          paddingBottom: "max(24px, env(safe-area-inset-bottom))",
          overflowY: "auto",
          animation: mobSheet ? "slideup 440ms var(--ease-modal)" : undefined,
        } : undefined}>
        {isMobile && (
          <>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <div style={{ width: 40, height: 5, borderRadius: 9999, background: "#444", margin: "4px auto 0" }} />
              <button onClick={() => setMobSheet(false)}
                style={{ position: "absolute", top: 12, right: 14,
                  width: 28, height: 28, borderRadius: 9999, background: "#333", border: 0,
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  cursor: "pointer" }}
                aria-label="Close">
                <Icon name="x" size={14} color="#ededed" stroke={2.4} />
              </button>
            </div>
          </>
        )}
        <h3>Easy + Agentic apply</h3>

        <div className="dev-group">
          <p className="dev-group-title">Project setup</p>
          <Segmented
            label="Language"
            valueLabel={lang === "en" ? "English" : "Norsk Bokmål"}
            value={lang}
            onChange={setLang}
            options={[
              { id: "en", label: "EN" },
              { id: "no", label: "NO" },
            ]} />
          <Segmented
            label="Platform"
            badge="Beta"
            valueLabel={platform === "ios" ? "iOS HIG" : platform === "android" ? "Material 3" : "Web"}
            value={platform}
            onChange={setPlatform}
            options={[
              { id: "ios",     label: "iOS",     icon: <AppleGlyph /> },
              { id: "android", label: "Android", icon: <AndroidGlyph /> },
              { id: "web",     label: "Web",     icon: <GlobeGlyph /> },
            ]} />
        </div>

        <div className="dev-group">
          <p className="dev-group-title">Demo state</p>
          <Dropdown
            label="User state"
            value={userState}
            lang={lang}
            onChange={(id) => {
              setUserState(id);
              setOverlay(null);
              if (id === "already-applied") setScreen("jobad");
            }}
            options={USER_STATES}
          />
          <Dropdown
            label="Version"
            value={version}
            lang={lang}
            onChange={setVersion}
            options={[
              { id: "mvp", label: "MVP — shipping now" },
              { id: "v1",  label: "1.0 — next release" },
              { id: "v2",  label: "2.0 — beyond" },
            ]}
          />
          <div className="controls-group">
            <div
              className={"dev-toggle" + (inspect ? " on" : "")}
              role="switch"
              aria-checked={inspect}
              tabIndex={0}
              onClick={() => { setInspect(v => !v); setInspectInfo(null); }}
              onKeyDown={(e) => {
                if (e.key === " " || e.key === "Enter") {
                  e.preventDefault();
                  setInspect(v => !v); setInspectInfo(null);
                }
              }}>
              <span className="label">Inspect mode</span>
              <span className="switch" aria-hidden="true" />
            </div>
            <p className="hint" style={{ marginTop: 6 }}>
              {inspect
                ? "Click any element on the iPhone to inspect specs."
                : "Tap to enable inline spec inspection."}
            </p>
          </div>
        </div>

        <div className="dev-group">
          <p className="dev-group-title">Screens</p>
          <NavBtn active={screen === "jobad"} onClick={() => { reset(); }}>Job ad</NavBtn>
          <NavBtn active={screen === "preview" && loadingPhase !== "ready" && !overlay}
            onClick={() => { setOverlay(null); setUserState("ready"); setScreen("preview"); startProgressiveLoad(); }}>
            Preview — loading
          </NavBtn>
          <NavBtn active={screen === "preview" && !overlay && userState === "ready" && loadingPhase === "ready"}
            onClick={() => { setOverlay(null); setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); }}>
            Preview — ready
          </NavBtn>
          <NavBtn active={screen === "preview" && userState === "missing-questions" && !overlay}
            onClick={() => { setOverlay(null); setUserState("missing-questions"); setLoadingPhase("ready"); setScreen("preview"); }}>
            Missing info
          </NavBtn>
          <NavBtn active={overlay === "edit:cv"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setCvPickerActive(true); setOverlay("edit:cv"); }}>
            CV picker
          </NavBtn>
          <NavBtn active={overlay === "cv-preview"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setOverlay("cv-preview"); }}>
            CV preview
          </NavBtn>
          <NavBtn active={overlay === "letter"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setOverlay("letter"); }}>
            Cover letter
          </NavBtn>
          <NavBtn active={overlay === "select-letter"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setOverlay("select-letter"); }}>
            Select / upload letter
          </NavBtn>
          <NavBtn active={overlay === "edit:letter"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setOverlay("edit:letter"); }}>
            Edit cover letter
          </NavBtn>
          <NavBtn active={overlay === "edit:personalia"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setOverlay("edit:personalia"); }}>
            Personal details
          </NavBtn>
          <NavBtn active={overlay === "edit:questions"}
            onClick={() => { setUserState("ready"); setLoadingPhase("ready"); setScreen("preview"); setOverlay("edit:questions"); }}>
            Employer questions
          </NavBtn>
          <NavBtn active={screen === "confirmation"}
            onClick={() => { setOverlay(null); setScreen("confirmation"); }}>
            Confirmation
          </NavBtn>
          <NavBtn active={screen === "activity" && activityTab === "drafts"}
            onClick={() => { setApplicationStatus("draft"); openActivity("drafts"); }}>
            Activity — Drafts
          </NavBtn>
          <NavBtn active={screen === "activity" && activityTab === "sent"}
            onClick={() => { setApplicationStatus("sent"); openActivity("sent"); }}>
            Activity — Sent
          </NavBtn>
        </div>

        <p className="hint">Tap through the iPhone, or jump using the list. Haptic feedback runs on supported devices.</p>
        <p className="hint" style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #2e2e2e" }}>
          For engineers: open the <strong>Handoff</strong> tab for site map, tokens, motion timings, and platform mapping.
        </p>
      </div>
    </div>
      )}

      {/* Floating feedback FAB — visible on every top-nav view. Clipboard-bridge
          to JEA-1179 means no backend, identity captured by Jira's own auth. */}
      <button className="fb-fab" onClick={() => setFeedbackOpen(true)} aria-label="Leave feedback">
        <span className="dot" aria-hidden="true" />
        Leave feedback
      </button>
      {feedbackOpen && (
        <FeedbackBridge
          onClose={() => setFeedbackOpen(false)}
          context={{
            view:
              view === "prototype" ? "Prototype" :
              view === "tree"      ? "Opportunity tree" :
              view === "matrix"    ? "Impact–Effort" :
              view === "storymap"  ? "Storymap" :
              view === "handoff"   ? "Handoff" : view,
            screen:
              view === "prototype"
                ? (overlay
                    ? "Overlay: " + overlay
                    : screen === "preview" && magicMode ? "Preview · Magic Apply"
                    : screen === "preview" && loadingPhase !== "ready" ? "Preview · loading"
                    : screen === "preview" ? "Preview · ready"
                    : screen)
                : null,
            platform: view === "prototype"
              ? (platform === "ios" ? "iOS" : platform === "android" ? "Android" : "Web")
              : null,
            version: view === "prototype"
              ? (version === "mvp" ? "MVP" : version === "v1" ? "1.0" : "2.0")
              : null,
          }}
        />
      )}
    </>
  );
}

function NavBtn({ active, onClick, children }) {
  return (
    <button className={active ? "active" : ""} onClick={onClick}>{children}</button>
  );
}

// Tiny platform glyphs for the toggle
const AppleGlyph = () => (
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
  </svg>
);
const AndroidGlyph = () => (
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M17.6 9.48l1.84-3.18a.5.5 0 0 0-.18-.68.5.5 0 0 0-.69.18l-1.86 3.21a11.4 11.4 0 0 0-9.34 0L5.51 5.8a.5.5 0 0 0-.69-.18.5.5 0 0 0-.18.68L6.48 9.48C3.38 11.25 1.36 14.44 1.08 18h21.84c-.28-3.56-2.3-6.75-5.32-8.52zM7.08 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
  </svg>
);
const GlobeGlyph = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18"/>
    <path d="M12 3a13 13 0 0 1 0 18M12 3a13 13 0 0 0 0 18"/>
  </svg>
);

function Segmented({ label, valueLabel, options, value, onChange, badge }) {
  const idx = Math.max(0, options.findIndex(o => o.id === value));
  const count = options.length;
  return (
    <div className="controls-group">
      <div className="controls-label">
        <span style={{ display: "inline-flex", alignItems: "center" }}>
          {label}
          {badge && <span className="beta-pill">{badge}</span>}
        </span>
        {valueLabel && <span className="value">{valueLabel}</span>}
      </div>
      <div className="seg" role="tablist" aria-label={label}>
        <div className="seg-indicator" style={{
          left: `calc(3px + ${idx} * ((100% - 6px) / ${count}))`,
          width: `calc((100% - 6px) / ${count})`,
        }} />
        {options.map(o => (
          <button
            key={o.id}
            role="tab"
            aria-selected={value === o.id}
            className={value === o.id ? "active" : ""}
            onClick={() => onChange(o.id)}>
            {o.icon}
            <span>{o.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

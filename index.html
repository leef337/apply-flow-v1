    border: 1px dashed var(--hair); border-radius: 12px;
    padding: 14px 16px; background: #fafbfc;
    list-style: none;
  }
  .hn-foot {
    font: 400 11px/1.5 var(--sys-text);
    color: var(--ink-mute);
    border-top: 1px dashed var(--hair);
    padding-top: 10px; margin: 4px 0 0;
  }
  .hn-foot code {
    background: #f1f3f5; padding: 1px 5px; border-radius: 4px;
    font: 500 11px/1 ui-monospace, monospace;
  }
  .ho-states {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    margin-top: 8px;
  }
  .ho-state {
    border: 1px dashed var(--hair); border-radius: 8px;
    padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
    background: #fafafa;
  }
  .ho-state .label {
    font-size: 10px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .ho-state .demo {
    display: flex; align-items: center; justify-content: center;
    min-height: 38px;
  }

  /* ─── Site map ─── */
  .smap-wrap {
    background: #fafafa; border: 1px solid var(--hair);
    border-radius: 14px; padding: 20px;
    overflow-x: auto;
  }
  .smap-svg { display: block; max-width: 100%; }
  .smap-node rect {
    fill: #fff; stroke: #d4d4d4; stroke-width: 1.2;
    rx: 10;
    transition: stroke 160ms var(--ease-modal), fill 160ms var(--ease-modal);
  }
  .smap-node.entry rect { fill: #eaf2ff; stroke: #0063fb; }
  .smap-node.finish rect { fill: #e6f5ec; stroke: #1f8a3b; }
  .smap-node.edge rect { fill: #fff3e0; stroke: #c97614; stroke-dasharray: 4 3; }
  .smap-node.magic rect { fill: #f1ebff; stroke: #6f3bd0; }
  .smap-node text { font-family: var(--sys-text); }
  .smap-node text.title {
    font-size: 11px; font-weight: 700; letter-spacing: -0.1px; fill: #1d1d1d;
  }
  .smap-node text.sub {
    font-size: 9px; font-weight: 500; fill: #6b6b6b; letter-spacing: 0.04em;
  }
  .smap-link {
    stroke: #b8b8b8; stroke-width: 1.4; fill: none;
  }
  .smap-link.alt { stroke: #c97614; stroke-dasharray: 4 3; }
  .smap-link.magic { stroke: #6f3bd0; stroke-dasharray: 4 4; }
  .smap-arrow { fill: #b8b8b8; }
  .smap-arrow.alt { fill: #c97614; }
  .smap-arrow.magic { fill: #6f3bd0; }
  .smap-edgelabel {
    font-family: var(--sys-text); font-size: 9px; font-weight: 600;
    fill: #6b6b6b; letter-spacing: 0.04em;
  }
  .smap-edgelabel.alt { fill: #c97614; }
  .smap-edgelabel.magic { fill: #6f3bd0; }
  .smap-legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin-top: 14px;
    font-size: 11px; color: var(--ink-soft);
  }
  .smap-legend .row { display: inline-flex; align-items: center; gap: 6px; }
  .smap-legend .swatch {
    width: 14px; height: 14px; border-radius: 4px;
    border: 1px solid #d4d4d4; background: #fff;
  }

  /* ─── Platform virtual keyboards ─── */

  .kbd-ios .kbd-suggest {
    height: 42px;

    padding: 0 8px;

    gap: 6px;
    background: #d1d3da;
  }
  .kbd-ios .kbd-suggest .sg {
    flex: 1; text-align: center;

  .kbd-ios .kbd-suggest .sg.q { color: #1d1d1d; }
  .kbd-ios .kbd-suggest .sg + .sg { border-left: 1px solid rgba(0,0,0,0.1); border-radius: 0; padding: 6px 0; }
  .kbd-ios .kbd-row {
    display: grid; gap: 6px;
    padding: 6px 0;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }
  .kbd-ios .kbd-row.row2 { padding-left: 5%; padding-right: 5%; }
  .kbd-ios .kbd-row.row3 { grid-template-columns: 1.4fr repeat(7, 1fr) 1.4fr; }
  .kbd-ios .kbd-key {
    height: 42px; border-radius: 6px;
    background: #fff;
    box-shadow: 0 1px 0 rgba(0,0,0,0.20);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 400; color: #1d1d1d;
    letter-spacing: -0.2px;
  }
  .kbd-ios .kbd-key.dark {
    background: #adb1bd; color: #1d1d1d;
    font-size: 16px; font-weight: 500;
  }
  .kbd-ios .kbd-row.bottom {
    grid-template-columns: 1fr 1fr 4fr 2fr;
  }
  .kbd-ios .kbd-key.space { font-size: 14px; font-weight: 400; }
  .kbd-ios .kbd-key.return {
    background: #0063fb; color: #fff;
    font-size: 14px; font-weight: 600;

  .kbd-ios .kbd-home {
    height: 22px;

    padding-bottom: 6px;

  .kbd-ios .kbd-home::after {
    content: ""; display: block;
    width: 134px; height: 5px; border-radius: 100px;
    background: rgba(0,0,0,0.40);
  }

  .kbd-android {
    background: #ecebec;
    padding: 6px 4px 10px;
    font-family: 'Roboto Flex', Roboto, 'Google Sans', system-ui, sans-serif;

    height: 40px;

    .layout {
      display: block;
      gap: 0;

      height: calc(100vh - 56px) !important;
      height: calc(100dvh - 56px) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      max-width: none !important;

// element gets a Material-style radial ripple originating from the touch
// point. Implementation: pointerdown sets CSS custom properties on the
// element for the ripple origin, adds .is-rippling to trigger the CSS
// animation, and removes the class after the keyframe duration so the
// ripple can re-fire on the next tap.
// ===========================================================
function useAndroidRipple(platform) {
  useEffect(() => {
    if (platform !== "android") return;
    document.body.classList.add("platform-android");

      const target = e.target.closest(".press");
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const x = (("touches" in e ? e.touches[0].clientX : e.clientX) - rect.left);
      const y = (("touches" in e ? e.touches[0].clientY : e.clientY) - rect.top);

      target.style.setProperty("--ripple-y", y + "px");

      void target.offsetWidth;
      target.classList.add("is-rippling");
      setTimeout(() => target.classList.remove("is-rippling"), 540);

    return () => {
      document.removeEventListener("pointerdown", onDown);
      document.body.classList.remove("platform-android");

// completion before React unmounts the element.

// ===========================================================

    return () => { if (timerRef.current) clearTimeout(timerRef.current); };

    if (exiting) return;
    setExiting(true);

      timerRef.current = null;
      onClose && onClose(...args);

      {d.split("M").filter(Boolean).map((seg, i) => (<path key={i} d={"M" + seg} />))}
    </svg>
  );
}

// FINN AI logo — used at agentic touchpoints (letter draft, Tailor, Magic).
// The mark is four blue quadrants curving inward; the negative-space cross is
// the 'AI' tile. Keep a tinted background behind it so the cross reads.
// ===========================================================
function AILogo({ size = 28, radius }) {
  // Wrap the SVG in an HTML element with overflow:hidden + border-radius. This
  // gives us iOS-app-icon-style rounded corners that visually rhyme with the
  // other circular status badges, without SVG-internal clipPath ID conflicts.
  const r = radius != null ? radius : Math.round(size * 0.22);
  return (
    <span style={{
      display: "inline-flex",
      width: size, height: size,
      borderRadius: r, overflow: "hidden",
      flexShrink: 0,

function getFinnAiSpinnerBuffer() {
  if (_finnAiSpinnerBuffer) return _finnAiSpinnerBuffer;
  try {
    const bin = atob(FINN_AI_SPINNER_B64);

}

// ===========================================================
// Rive spinner — renders the FINN AI spinner on a canvas. Loads from the
// inlined buffer above (no fetch required, so works on file:// / GitHub
// Pages / anywhere). Falls back to a polished CSS loader if the Rive
// runtime hasn't loaded.
// ===========================================================
function RiveSpinner({ size = 32, src, artboard = "FINNLoading", stateMachine = "State Machine 1" }) {
  const canvasRef = useRef(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (typeof window === "undefined" || !window.rive) {
      setFailed(true);
      return;
    }
    const buffer = getFinnAiSpinnerBuffer();
    if (!buffer && !src) {
      setFailed(true);
      return;
    }
    let r;
    let cancelled = false;
    try {
      r = new window.rive.Rive({
        // Prefer the inlined buffer over fetching src so this works on file://
        ...(buffer ? { buffer } : { src }),
        canvas: canvasRef.current,
        autoplay: true,
        // FINNLoading is the artboard; "State Machine 1" is the actual state
        // machine that drives the looping load animation. Both are required —
        // passing only the artboard leaves the SM idle on its first frame.
        artboard,
        stateMachines: stateMachine,
        // Modern layout API — keeps the artboard proportional inside the
        // 32×32 slot regardless of the source artboard's aspect ratio.
        layout: window.rive.Layout ? new window.rive.Layout({
          fit:       window.rive.Fit.Contain,
          alignment: window.rive.Alignment.Center,
        }) : undefined,
        onLoad: () => {
          if (cancelled) return;
          // Match the drawing surface to the CSS size at devicePixelRatio
          // so the animation stays crisp on retina displays.
          try { r.resizeDrawingSurfaceToCanvas(); } catch (_) {}
        },
        onLoadError: () => setFailed(true),
      });
    } catch (e) {
      setFailed(true);
    }
    const onResize = () => { try { r && r.resizeDrawingSurfaceToCanvas(); } catch (_) {} };
    window.addEventListener("resize", onResize);
    return () => {
      cancelled = true;
      window.removeEventListener("resize", onResize);
      try { if (r && r.cleanup) r.cleanup(); } catch (_) {}
    };
  }, [src, stateMachine]);

  if (failed) {
    // Softer fallback — matches the polish of the Rive loader: faint blue disc,
    // thin conic comet-tail, gentle breathing. Used when the Rive runtime or
    // .riv asset can't load (e.g. offline / blocked CDN).
    return (
      <span style={{
        width: size, height: size, borderRadius: 9999,
        background: "radial-gradient(circle at 50% 50%, #f1f4fb 0%, #eef0f6 100%)",
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        animation: "aiBreath 3.4s cubic-bezier(0.45, 0, 0.25, 1) infinite",
        boxShadow: "inset 0 0 0 1px rgba(0, 99, 251, 0.05)",
      }}>
        <span style={{
          width: Math.round(size * 0.68), height: Math.round(size * 0.68),
          borderRadius: 9999,
          background: "conic-gradient(from 0deg, rgba(0,99,251,0) 0deg, rgba(0,99,251,0.02) 160deg, rgba(0,99,251,0.28) 300deg, rgba(0,99,251,0.55) 358deg, rgba(0,99,251,0) 360deg)",
          WebkitMask: "radial-gradient(circle, transparent 64%, #000 67%, #000 100%)",
                  mask: "radial-gradient(circle, transparent 64%, #000 67%, #000 100%)",
          filter: "blur(0.3px)",
          animation: "aiOrbit 2.4s linear infinite",
          display: "inline-block",
        }} />
      </span>
    );
  }
  return (
    <canvas
      ref={canvasRef}
      width={size * 2} height={size * 2}
      style={{ width: size, height: size, display: "block", willChange: "transform" }}
      aria-hidden="true"
    />
  );
}

// ===========================================================
// Language context — English (default) ↔ Norwegian Bokmål
// ===========================================================
const LangCtx = React.createContext("en");
function useLang() { return React.useContext(LangCtx); }
// t({ en, no }) → returns the right string for the current language.
// Use inline at call sites so copy stays close to UI.
function useT() {
  const lang = useLang();
  return (obj) => (obj && (obj[lang] ?? obj.en)) ?? "";
}

// ===========================================================
// iOS Device frame (390 × 844 logical pts — iPhone 15)
// ===========================================================
function useIsMobile() {
  const [m, setM] = useState(() => typeof window !== "undefined" && window.matchMedia("(max-width: 640px)").matches);
  useEffect(() => {
    if (typeof window === "undefined") return;
    const mq = window.matchMedia("(max-width: 640px)");
    const fn = (e) => setM(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", fn);
    else mq.addListener(fn);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", fn);
      else mq.removeListener(fn);
    };
  }, []);
  return m;
}

// ===========================================================
// Universal device — picks frame from platform context.
// Listens for input focus inside the frame and surfaces a platform-appropriate
// virtual keyboard. Suppressed on real mobile (the OS keyboard takes over).
function Device({ platform, children }) {
  const isMobile = useIsMobile();
  const [kbdOpen, setKbdOpen] = useState(false);
  const wrapRef = useRef(null);

  // We attach native focusin/focusout to the wrapper since React's synthetic
  // onFocus bubbles inconsistently across reparented portals (none here, but
  // belt + braces) and we want this to work for every input/textarea added later.
  useEffect(() => {
    if (isMobile || platform === "web") return;
    const node = wrapRef.current;
    if (!node) return;
    // Only text-like inputs should pop the keyboard. Checkboxes, radios,
    // submit buttons etc are also <input> elements but tapping them must
    // not surface a keyboard — that's confusing and was the bug behind the
    // "keyboard opens when I click the confirm checkbox" report.
    const NON_TEXT_INPUT_TYPES = new Set([
      "checkbox", "radio", "button", "submit", "reset",
      "file", "image", "range", "color", "hidden",
    ]);
    const isTextInput = (el) => {
      if (!el) return false;
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === "TEXTAREA") return true;
      if (tag === "INPUT") return !NON_TEXT_INPUT_TYPES.has((el.type || "text").toLowerCase());
      return false;
    };
    const handleIn = (e) => {
      if (isTextInput(e.target)) setKbdOpen(true);
    };
    const handleOut = (e) => {
      if (!isTextInput(e.target)) return;
      // Defer so re-focus to another input within the same tick doesn't flicker.
      setTimeout(() => {
        if (!isTextInput(document.activeElement)) {
          setKbdOpen(false);
        }
      }, 0);
    };
    node.addEventListener("focusin", handleIn);
    node.addEventListener("focusout", handleOut);
    return () => {
      node.removeEventListener("focusin", handleIn);
      node.removeEventListener("focusout", handleOut);
    };
  }, [isMobile, platform]);

  const inner = (
    <PlatformCtx.Provider value={platform}>
      <div ref={wrapRef} style={{ position: "absolute", inset: 0 }}>
        {children}
        <MobileKeyboard platform={platform} open={kbdOpen} />
      </div>
    </PlatformCtx.Provider>
  );
  if (platform === "android") return <AndroidDevice>{inner}</AndroidDevice>;
  if (platform === "web")     return <WebFrame>{inner}</WebFrame>;
  return <IOSDevice>{inner}</IOSDevice>;
}

// ===========================================================
// Phone3DHero — real glTF iPhone via Google's <model-viewer>
// ===========================================================
// Shown on the Job Ad screen (iOS only) as a spinnable hero. The user
// drags to orbit and pinches/scrolls to zoom — all handled by
// model-viewer. The CTA below dismisses the hero and reveals the
// regular interactive prototype underneath.
//
// Requires a .glb iPhone model at `assets/iphone.glb`. If the file is
// missing, a small inline placeholder explains where to put it so the
// page doesn't break.
function Phone3DHero({ onEnter }) {
  const [modelMissing, setModelMissing] = useState(false);
  const [rotating, setRotating] = useState(false);
  const [textured, setTextured] = useState(false);
  // Material picker: list of all material names on the model + which one
  // is currently being treated as the screen. Persisted to localStorage
  // so once the user picks the right material, it sticks across reloads.
  const [materialNames, setMaterialNames] = useState([]);
  const [pickedName, setPickedName] = useState(() => {
    try { return localStorage.getItem("phone3d-screen-material") || ""; }
    catch { return ""; }
  });
  const viewerRef = useRef(null);
  const sourceRef = useRef(null);
  const textureCacheRef = useRef(null);
  const rotateTimerRef = useRef(null);

  // Texture transform state — controls how the captured JobAd PNG sits
  // on the model's screen face. Persisted to localStorage so once the
  // user finds the right combo it sticks. Defaults assume the typical
  // iPhone GLB orientation (most need a 90° rotation and clamping).
  const [rotation, setRotation] = useState(() => {
    try { return parseInt(localStorage.getItem("phone3d-tex-rot") || "270", 10); }
    catch { return 270; }
  });
  const [flipX, setFlipX] = useState(() => {
    try { return localStorage.getItem("phone3d-tex-flipx") === "1"; }
    catch { return false; }
  });
  const [flipY, setFlipY] = useState(() => {
    try { return localStorage.getItem("phone3d-tex-flipy") === "1"; }
    catch { return false; }
  });
  // Pan offset (px) — how far to shift the Job Ad within the texture
  // canvas. Used to compensate for off-centre UV mapping on the model.
  const [offsetX, setOffsetX] = useState(() => {
    try { return parseInt(localStorage.getItem("phone3d-tex-offx") || "0", 10); }
    catch { return 0; }
  });
  const [offsetY, setOffsetY] = useState(() => {
    try { return parseInt(localStorage.getItem("phone3d-tex-offy") || "0", 10); }
    catch { return 0; }
  });

  const CLAMP_TO_EDGE = 33071;

  // Take a source canvas, return a new canvas with rotation/flip/pan
  // applied to the actual pixels. We do this in 2D canvas rather than
  // relying on texture-sampler tricks because not every glTF supports
  // the KHR_texture_transform extension that model-viewer's
  // setRotation/setScale depend on — those silently no-op without it.
  function transformCanvas(src, rotDeg, fx, fy, offX, offY) {
    const swap = rotDeg === 90 || rotDeg === 270;
    const w = swap ? src.height : src.width;
    const h = swap ? src.width  : src.height;
    const out = document.createElement("canvas");
    out.width = w; out.height = h;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    // Offset is applied to the *final image* — so panning the source
    // texture (in screen-face space) feels natural regardless of the
    // current rotation.
    ctx.translate(w / 2 + (offX || 0), h / 2 + (offY || 0));
    ctx.rotate((rotDeg * Math.PI) / 180);
    ctx.scale(fx ? -1 : 1, fy ? -1 : 1);
    ctx.drawImage(src, -src.width / 2, -src.height / 2);
    ctx.restore();
    return out;
  }

  async function applyToMaterial(materialName, opts = {}) {
    const el = viewerRef.current;
    if (!el || !el.model) return;
    const material = el.model.materials.find(m => m.name === materialName);
    if (!material) {
      console.warn(`[Phone3DHero] No material named "${materialName}".`);
      return;
    }
    const rot = opts.rotation ?? rotation;
    const fx  = opts.flipX ?? flipX;
    const fy  = opts.flipY ?? flipY;
    const ox  = opts.offsetX ?? offsetX;
    const oy  = opts.offsetY ?? offsetY;
    try {
      // Capture the source canvas once; reuse on every transform tweak.
      if (!textureCacheRef.current) {
        if (!window.html2canvas) {
          console.warn("[Phone3DHero] html2canvas not loaded.");
          return;
        }
        await new Promise(r => setTimeout(r, 200));
        textureCacheRef.current = await window.html2canvas(sourceRef.current, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true,
          logging: false,
        });
      }
      // Rotate / flip / pan the pixels in a fresh canvas so the texture
      // is already oriented correctly when we hand it to model-viewer.
      const oriented = transformCanvas(textureCacheRef.current, rot, fx, fy, ox, oy);
      const dataUrl = oriented.toDataURL("image/png");
      const tex = await el.createTexture(dataUrl);
      // Still try the sampler clamp — kills tiling when KHR_texture_transform
      // *is* supported. Harmless if it no-ops.
      try { tex.sampler.setWrapS(CLAMP_TO_EDGE); } catch (_) {}
      try { tex.sampler.setWrapT(CLAMP_TO_EDGE); } catch (_) {}
      material.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
      material.pbrMetallicRoughness.setMetallicFactor(0);
      material.pbrMetallicRoughness.setRoughnessFactor(0.4);
      setTextured(true);
      try { localStorage.setItem("phone3d-screen-material", materialName); } catch {}
      console.log(`[Phone3DHero] Applied to "${materialName}" — rot=${rot}° flipX=${fx} flipY=${fy} (pixel-rotated)`);
    } catch (err) {
      console.warn("[Phone3DHero] Texture apply failed:", err);
    }
  }

  // When the user changes rotation/flip/pan, re-apply with the new
  // transform. State + localStorage updates so the next reload starts
  // from the dialled-in position.
  function adjustTransform(patch) {
    if ("rotation" in patch) {
      setRotation(patch.rotation);
      try { localStorage.setItem("phone3d-tex-rot", String(patch.rotation)); } catch {}
    }
    if ("flipX" in patch) {
      setFlipX(patch.flipX);
      try { localStorage.setItem("phone3d-tex-flipx", patch.flipX ? "1" : "0"); } catch {}
    }
    if ("flipY" in patch) {
      setFlipY(patch.flipY);
      try { localStorage.setItem("phone3d-tex-flipy", patch.flipY ? "1" : "0"); } catch {}
    }
    if ("offsetX" in patch) {
      setOffsetX(patch.offsetX);
      try { localStorage.setItem("phone3d-tex-offx", String(patch.offsetX)); } catch {}
    }
    if ("offsetY" in patch) {
      setOffsetY(patch.offsetY);
      try { localStorage.setItem("phone3d-tex-offy", String(patch.offsetY)); } catch {}
    }
    if (pickedName) applyToMaterial(pickedName, patch);
  }

  useEffect(() => {
    const el = viewerRef.current;
    if (!el) return;

    const onError = () => setModelMissing(true);

    const onCameraChange = (e) => {
      if (e.detail && e.detail.source === "user-interaction") {
        setRotating(true);
        if (rotateTimerRef.current) clearTimeout(rotateTimerRef.current);
        rotateTimerRef.current = setTimeout(() => setRotating(false), 800);
      }
    };

    const onLoad = async () => {
      try {
        const materials = el.model && el.model.materials;
        if (!materials || materials.length === 0) return;
        const names = materials.map(m => m.name || "(unnamed)");
        setMaterialNames(names);
        console.log("[Phone3DHero] Materials:", names);
        // Pick: previously-saved choice → heuristic → first material.
        const initial =
          (pickedName && names.includes(pickedName) && pickedName)
          || names.find(n => /screen|display|panel|lcd|oled/i.test(n))
          || names.find(n => /gray|grey|black/i.test(n))
          || names.find(n => /glass|front/i.test(n))
          || names[0];
        if (initial) {
          setPickedName(initial);
          await applyToMaterial(initial);
        }
      } catch (err) {
        console.warn("[Phone3DHero] Load handler failed:", err);
      }
    };

    el.addEventListener("error", onError);
    el.addEventListener("load", onLoad);
    el.addEventListener("camera-change", onCameraChange);
    return () => {
      el.removeEventListener("error", onError);
      el.removeEventListener("load", onLoad);
      el.removeEventListener("camera-change", onCameraChange);
      if (rotateTimerRef.current) clearTimeout(rotateTimerRef.current);
    };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div className={"phone3d-hero" + (rotating ? " rotating" : "")}>
      <span className="phone3d-hero-hint">Drag to spin</span>
      {modelMissing ? (
        <div className="phone3d-hero-missing">
          <strong>3D model not loaded</strong>
          <span>Save a free iPhone <code>.glb</code> file at:</span>
          <code style={{ fontSize: 11 }}>share/assets/iphone.glb</code>
          <span style={{ fontSize: 12, marginTop: 8 }}>
            Try <a href="https://sketchfab.com/3d-models?features=downloadable&q=iphone+15&licenses=322a749bcfa841b29dff1e8a1bb74b0b" target="_blank" rel="noopener" style={{ color: "var(--finn-blue)" }}>Sketchfab</a> or <a href="https://poly.pizza/search/iphone" target="_blank" rel="noopener" style={{ color: "var(--finn-blue)" }}>poly.pizza</a>.
          </span>
        </div>
      ) : (
        <model-viewer
          ref={viewerRef}
          src="assets/iphone.glb"
          alt="iPhone 3D model"
          camera-controls
          touch-action="pan-y"
          /* Start facing the screen, not the back. If your model's
             front is the opposite side, change theta to 180deg. */
          camera-orbit="0deg 90deg auto"
          min-camera-orbit="auto 0deg auto"
          max-camera-orbit="auto 180deg auto"
          shadow-intensity="0.9"
          shadow-softness="1"
          environment-image="neutral"
          exposure="1.1"
          interaction-prompt="none"
        />
      )}
      {/* Hidden source — html2canvas captures THIS to a PNG and applies
          it as the screen-material texture on the model. Positioned far
          off-screen so it doesn't interfere with the visible layout, but
          still rendered (visibility:hidden doesn't work — html2canvas
          needs the node to be laid out).
          The outer div is much larger than the inner JobAdContent so
          there's white padding on every side. That way the UV mapping
          can crop into a sub-region of the texture and still show the
          whole Job Ad. */}
      <div
        ref={sourceRef}
        aria-hidden="true"
        style={{
          position: "fixed",
          left: -9999, top: 0,
          width: 1170, height: 2532,
          background: "#fff", color: "#1d1d1d",
          overflow: "hidden",
          pointerEvents: "none",
        }}
      >
        <div style={{
          /* JobAdContent sits centred in a much larger canvas. The
             Job Ad itself occupies ~33% of each dimension; the rest is
             white padding. That way even if the screen face's UV map
             crops in (which it does on this .glb), the whole Job Ad
             fits inside the visible region. */
          position: "absolute",
          top: 844, left: 390,
          width: 390, height: 844,
          background: "#fff",
        }}>
          <JobAdContent job={JOB} />
        </div>
      </div>
      {/* 2D Job Ad overlay — fallback before the texture has been
          applied to the model. Hidden once the texture swap succeeds. */}
      {!modelMissing && !textured && (
        <div className="phone3d-hero-screen">
          <div style={{
            width: "100%", height: "100%",
            overflowY: "auto", overflowX: "hidden",
            background: "#fff", color: "#1d1d1d",
            transform: "scale(0.78)", transformOrigin: "top center",
          }}>
            <JobAdContent job={JOB} />
          </div>
        </div>
      )}
      <button className="phone3d-hero-cta press" onClick={onEnter}>
        Open the application →
      </button>
      {/* Material picker + texture orientation controls. Once you've
          dialled the right combo (material name + rotation + flip + pan),
          it persists in localStorage so future visits use it automatically. */}
      {materialNames.length > 0 && (() => {
        const panBtnStyle = {
          background: "transparent",
          color: "#fff",
          border: "1px solid rgba(255,255,255,0.25)",
          borderRadius: 6,
          padding: "3px 7px",
          font: "600 12px/1 var(--sys-text)",
          cursor: "pointer",
          minWidth: 26,
        };
        return ((
        <div style={{
          position: "absolute",
          top: 12, left: 12,
          zIndex: 10,
          background: "rgba(0,0,0,0.62)",
          backdropFilter: "blur(8px)",
          color: "#fff",
          padding: "8px 10px",
          borderRadius: 10,
          font: "500 11px/1.2 var(--sys-text)",
          display: "flex", flexDirection: "column", gap: 6,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ opacity: 0.65 }}>Screen:</span>
            <select
              value={pickedName}
              onChange={(e) => {
                setPickedName(e.target.value);
                applyToMaterial(e.target.value);
              }}
              style={{
                background: "transparent",
                color: "#fff",
                border: "1px solid rgba(255,255,255,0.25)",
                borderRadius: 6,
                padding: "3px 6px",
                font: "600 11px/1.2 var(--sys-text)",
                cursor: "pointer",
              }}
            >
              {materialNames.map(n => (
                <option key={n} value={n} style={{ color: "#1d1d1d" }}>{n}</option>
              ))}
            </select>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ opacity: 0.65 }}>Rotate:</span>
            {[0, 90, 180, 270].map(deg => (
              <button
                key={deg}
                onClick={() => adjustTransform({ rotation: deg })}
                style={{
                  background: rotation === deg ? "#fff" : "transparent",
                  color: rotation === deg ? "#1d1d1d" : "#fff",
                  border: "1px solid rgba(255,255,255,0.25)",
                  borderRadius: 6,
                  padding: "3px 6px",
                  font: "600 11px/1.2 var(--sys-text)",
                  cursor: "pointer",
                  minWidth: 32,
                }}
              >
                {deg}°
              </button>
            ))}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ opacity: 0.65 }}>Flip:</span>
            <button
              onClick={() => adjustTransform({ flipX: !flipX })}
              style={{
                background: flipX ? "#fff" : "transparent",
                color: flipX ? "#1d1d1d" : "#fff",
                border: "1px solid rgba(255,255,255,0.25)",
                borderRadius: 6,
                padding: "3px 8px",
                font: "600 11px/1.2 var(--sys-text)",
                cursor: "pointer",
              }}
            >
              X
            </button>
            <button
              onClick={() => adjustTransform({ flipY: !flipY })}
              style={{
                background: flipY ? "#fff" : "transparent",
                color: flipY ? "#1d1d1d" : "#fff",
                border: "1px solid rgba(255,255,255,0.25)",
                borderRadius: 6,
                padding: "3px 8px",
                font: "600 11px/1.2 var(--sys-text)",
                cursor: "pointer",
              }}
            >
              Y
            </button>
          </div>
          {/* Pan controls — shift the Job Ad within the texture canvas
              to align it with the screen face's UV region. */}
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ opacity: 0.65 }}>Pan:</span>
            <button
              onClick={() => adjustTransform({ offsetX: offsetX - 80 })}
              style={panBtnStyle}
              aria-label="Pan left"
            >←</button>
            <button
              onClick={() => adjustTransform({ offsetY: offsetY - 80 })}
              style={panBtnStyle}
              aria-label="Pan up"
            >↑</button>
            <button
              onClick={() => adjustTransform({ offsetY: offsetY + 80 })}
              style={panBtnStyle}
              aria-label="Pan down"
            >↓</button>
            <button
              onClick={() => adjustTransform({ offsetX: offsetX + 80 })}
              style={panBtnStyle}
              aria-label="Pan right"
            >→</button>
            <button
              onClick={() => adjustTransform({ offsetX: 0, offsetY: 0 })}
              style={{ ...panBtnStyle, fontSize: 9, padding: "3px 5px" }}
              aria-label="Reset pan"
            >0</button>
          </div>
          <div style={{ opacity: 0.5, fontSize: 10 }}>
            offset {offsetX},{offsetY}
          </div>
        </div>
        ));
      })()}
    </div>
  );
}

// ===========================================================
// Phone3DStage — drag-to-spin 3D iPhone, iOS Job Ad screen only
// ===========================================================
// Plays only when `active` is true (set by App when platform === "ios" and
// screen === "jobad"). Drag *outside* the device bezel to rotate; tap or
// drag *on* the device passes through to the prototype normally. Release
// eases back to flat. The back panel and four side strips are pure CSS,
// so this has no extra dependencies and stays nimble.
function Phone3DStage({ active, children }) {
  const [rot, setRot] = useState({ x: 0, y: 0 });
  const [grabbing, setGrabbing] = useState(false);
  const [snap, setSnap] = useState(true);
  const dragRef = useRef(null);
  const snapTimerRef = useRef(null);

  // When the stage deactivates (e.g. user navigates away from jobad),
  // ease the phone back to flat so the next visit starts clean.
  useEffect(() => {
    if (active) return;
    setSnap(true);
    setRot({ x: 0, y: 0 });
  }, [active]);

  // Clamp helpers — we don't want the phone to flip completely round,
  // which makes the back unreadable and the gesture feel uncontrolled.
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function onPointerDown(e) {
    if (!active) return;
    // Only rotate when the pointer lands on the *stage padding* — not
    // on the device itself. Tapping the screen content should always
    // pass through to the prototype.
    if (e.target.closest(".device-bezel")) return;
    if (snapTimerRef.current) {
      clearTimeout(snapTimerRef.current);
      snapTimerRef.current = null;
    }
    dragRef.current = {
      startX: e.clientX, startY: e.clientY,
      rotX: rot.x, rotY: rot.y,
    };
    setGrabbing(true);
    setSnap(false);
    e.preventDefault();
  }

  // Global pointer listeners while dragging — keeps tracking even if the
  // pointer leaves the stage rectangle.
  useEffect(() => {
    if (!grabbing) return;
    const onMove = (e) => {
      if (!dragRef.current) return;
      const dx = e.clientX - dragRef.current.startX;
      const dy = e.clientY - dragRef.current.startY;
      setRot({
        // Looser multipliers so a short drag covers more rotation.
        // Y axis (left-right spin) is uncapped — you can roll it 360°.
        // X axis (tilt forward/back) still clamps so the phone can't flip.
        x: clamp(dragRef.current.rotX - dy * 0.75, -40, 40),
        y: dragRef.current.rotY + dx * 0.95,
      });
    };
    const onUp = () => {
      dragRef.current = null;
      setGrabbing(false);
      // No auto-snap — leave the phone where the user spun it so they can
      // hold a pose. Switching screens or platforms still resets it to
      // flat via the `active` effect above.
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
    };
  }, [grabbing]);

  useEffect(() => () => {
    if (snapTimerRef.current) clearTimeout(snapTimerRef.current);
  }, []);

  if (!active) return children;

  return (
    <div
      className={"phone3d-stage" + (grabbing ? " grabbing" : "")}
      onPointerDown={onPointerDown}
    >
      <div
        className={
          "phone3d-shell" +
          (snap ? " snap" : "") +
          /* Glare lights up as soon as the phone leaves flat. Threshold of
             ~3° avoids flickering it on at sub-pixel rotations. */
          (Math.abs(rot.x) > 3 || Math.abs(rot.y) > 3 ? " tilted" : "")
        }
        style={{ transform: `rotateX(${rot.x}deg) rotateY(${rot.y}deg)` }}
      >
        <div className="phone3d-face phone3d-front">
          {children}
          <div className="phone3d-glare" aria-hidden="true" />
        </div>
        <div className="phone3d-face phone3d-back">
          <div className="phone3d-camera">
            <div className="phone3d-lens" />
            <div className="phone3d-lens" />
            <div className="phone3d-lens" />
            <div className="phone3d-flash" />
          </div>
          {/* MagSafe ring sits behind the logo */}
          <div className="phone3d-back-magsafe" />
          {/* Apple-style logo, centred and chrome-finished */}
          <div className="phone3d-back-logo" aria-hidden="true">
            <svg viewBox="0 0 170 200" xmlns="http://www.w3.org/2000/svg">
              <defs>

                  <stop offset="0%"  stopColor="#fafafc" stopOpacity="0.95"/>
                  <stop offset="55%" stopColor="#bcbcc1" stopOpacity="0.85"/>
                  <stop offset="100%" stopColor="#6e6e74" stopOpacity="0.80"/>
                </linearGradient>

              <path
                fill="url(#phone3dLogoGrad)"
                d="M150.37 150.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.197-2.12-9.973-3.17-14.34-3.17-4.58 0-9.492 1.05-14.746 3.17-5.262 2.13-9.501 3.24-12.742 3.35-4.929.21-9.842-1.96-14.746-6.52-3.13-2.73-7.045-7.41-11.735-14.04-5.032-7.08-9.169-15.29-12.41-24.65-3.471-10.11-5.211-19.9-5.211-29.378 0-10.857 2.346-20.221 7.045-28.068 3.693-6.303 8.606-11.275 14.755-14.925s12.793-5.51 19.948-5.629c3.915 0 9.049 1.211 15.429 3.591 6.362 2.388 10.447 3.599 12.235 3.599 1.337 0 5.877-1.415 13.57-4.237 7.275-2.618 13.415-3.702 18.445-3.275 13.63 1.1 23.87 6.473 30.68 16.153-12.19 7.386-18.22 17.731-18.1 31.002.11 10.337 3.86 18.939 11.23 25.769 3.34 3.17 7.07 5.62 11.22 7.36-.9 2.61-1.85 5.11-2.86 7.51zM119.11 27.24c0 8.102-2.96 15.667-8.86 22.669-7.12 8.324-15.732 13.134-25.071 12.375a25.222 25.222 0 0 1-.188-3.07c0-7.778 3.386-16.102 9.399-22.908 3.002-3.446 6.82-6.311 11.45-8.597 4.62-2.252 8.99-3.497 13.1-3.71.12 1.083.17 2.166.17 3.241z"

// Per-platform device metrics — fixes top-chrome overflow and bottom
// system-gesture clearance differences across iOS / Android / Web.
const DEVICE_METRICS = {
  ios:     { statusBarH: 54, homeArea: 34 },
  android: { statusBarH: 36, homeArea: 18 },
  // Web chrome (28 OS bar + ~46 address bar) ≈ 82px tall; add a few px so the
  // NavBar content (back chevron, title, trailing icons) breathes below it.
  web:     { statusBarH: 92, homeArea: 4  },
};
function useMetrics() {
  const base = DEVICE_METRICS[usePlatform()];
  // In fullscreen mode (QR scan on a real phone) we strip the simulated
  // top status-bar height — the real device already has its own status
  // bar, so the prototype shouldn't reserve extra space and end up with
  // big white margins. Same for the simulated home-indicator at bottom.
  if (typeof window !== "undefined") {
    try {
      const p = new URLSearchParams(window.location.search);
      if (p.get("fullscreen") === "1") {
        return { ...base, statusBarH: 0, homeArea: 0 };
      }
    } catch (_) {}
  }
  return base;
}
// Legacy fallbacks (only kept for any non-component contexts)
const STATUS_BAR_H = 54;
const HOME_AREA = 34;

// ===========================================================
// NavBar — single-row layout, no absolute overlap
// ===========================================================
function NavBar({ title, onBack, onClose, trailing }) {
  const { statusBarH } = useMetrics();
  const platform = usePlatform();
  // Platform-correct header height & title style.
  // Material 3 Small Top App Bar: 64dp container (we go 56dp because the
  // status bar already eats 36dp on Android, keeping total chrome ≈ 92dp
  // which matches Pixel reference). on-surface text colour for the back
  // arrow. No resting shadow per M3 — the small hairline below provides
  // separation without simulating elevation we don't actually have.
  // iOS uses FINN's circular floating back/close bubble (white circle,
  // soft shadow, dark icon) per the production Item Page treatment.
  const rowH       = platform === "android" ? 56 : 56;
  const backColor  = platform === "android" ? "#1d1d1d" : "#1d1d1d";
  const backStroke = platform === "android" ? 2.2 : 2.4;
  return (
    <div style={{
      paddingTop: statusBarH, background: "#fff",
      borderBottom: platform === "android" ? "1px solid rgba(0,0,0,0.06)" : "0",
      boxShadow: "none",
      flexShrink: 0, position: "relative", zIndex: 2,
    }}>
      <div style={{
        height: rowH, display: "flex", alignItems: "center",
        padding: platform === "android" ? "0 4px" : "0 12px",
        position: "relative",
      }}>
        {platform === "android" ? (
          <button
            className="press"
            onClick={() => { haptic("tap"); (onBack || onClose)?.(); }}
            aria-label={onBack ? "Back" : "Close"}
            style={{
              width: 44, height: 44, border: 0, background: "transparent", cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name={onBack ? "chevron-left" : "x"} size={24} color={backColor} stroke={backStroke} />
          </button>
        ) : (
          /* iOS — circular floating bubble (FINN Item Page style). */
          <button
            className="press"
            onClick={() => { haptic("tap"); (onBack || onClose)?.(); }}
            aria-label={onBack ? "Back" : "Close"}
            style={{
              width: 40, height: 40, borderRadius: 9999,
              background: "#fff",
              border: "0",
              boxShadow: "0 1px 3px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)",
              cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name={onBack ? "chevron-left" : "x"} size={20} color={backColor} stroke={backStroke} />
          </button>
        )}

        {platform === "android" ? (
          /* Material 3 Small Top App Bar — left-aligned Title Large
             (22sp / 28sp line-height / Regular 400). Padding 16dp leading
             puts the title at the M3-recommended distance from the
             navigation icon. */
          <div style={{
            flex: 1, minWidth: 0,
            fontSize: 22, fontWeight: 400, color: "#1d1d1d",
            letterSpacing: 0, lineHeight: "28px",
            padding: "0 0 0 12px",
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
          }}>{title}</div>
        ) : (
          /* iOS / Web: absolutely-centered headline, safe clearance from edges */
          <div style={{
            position: "absolute", left: 80, right: 80, top: 0, bottom: 0,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 17, fontWeight: 700, color: "#1d1d1d",
            pointerEvents: "none",
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            letterSpacing: -0.3,
          }}>{title}</div>
        )}

        <div style={{ marginLeft: "auto", display: "flex", flexShrink: 0 }}>{trailing}</div>
      </div>
    </div>
  );
}

function CompanyLogo({ size = 56, radius = 12, initials = "PU", color = "#0063fb", bg = "#fff", logo }) {
  if (logo === "politiet") return <PolitietLogo size={size} radius={radius} />;
  return (
    <div style={{
      width: size, height: size, borderRadius: radius,
      background: bg, color,
      boxShadow: "0 2px 10px rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.04)",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontWeight: 700, fontSize: size * 0.38, letterSpacing: -0.4,
      flexShrink: 0, fontFamily: "inherit",
    }}>{initials}</div>
  );
}

function PrimaryButton({ children, onClick, disabled, variant = "primary" }) {
  const platform = usePlatform();
  const isAndroid = platform === "android";
  const radius = PLATFORM_RADII[platform].button;
  const styles = isAndroid
    ? {
        // Material 3 Filled button: primary background, on-primary text,
        // no border, no shadow (filled buttons have zero elevation in M3).
        primary:   { bg: "#0063fb", color: "#fff", border: "none" },
        // Material 3 Filled Tonal button: primary-container background.
        secondary: { bg: "#d4e4ff", color: "#001c42", border: "none" },
      }
    : {
        primary:   { bg: "#0063fb", color: "#fff", border: "1px solid #0063fb" },
        secondary: { bg: "#fff", color: "#0063fb", border: "1px solid rgba(0,99,251,0.5)" },
      };
  const s = styles[variant];
  // Material 3 button text is Label Large: 14sp / Medium 500 / 0.1px tracking.
  // iOS uses Body / 17sp / Semibold 600 / -0.2 tracking.
  const fontSize    = isAndroid ? 14 : platform === "ios" ? 17 : 15;
  const fontWeight  = isAndroid ? 500 : 600;
  // M3 buttons are 40dp tall with 24dp horizontal padding. Vertical
  // padding produces a 48dp touch target. iOS/web stay slightly taller.
  const padding     = isAndroid ? "10px 24px" : "14px 24px";
  const letterSpacing = isAndroid ? 0.1 : platform === "ios" ? -0.2 : 0.05;
  return (
    <button
      className="press"
      onClick={() => { if (!disabled) { haptic("tap"); onClick?.(); } }}
      disabled={disabled}
      style={{
        width: "100%", padding, borderRadius: radius,
        background: s.bg, color: s.color, border: s.border,
        fontFamily: "inherit", fontSize, fontWeight,
        minHeight: isAndroid ? 48 : undefined,  // 48dp touch target
        cursor: disabled ? "not-allowed" : "pointer",
        opacity: disabled ? 0.5 : 1,
        transition: "opacity 320ms cubic-bezier(0.4, 0, 0.2, 1), background 200ms var(--ease-out), color 200ms var(--ease-out)",
        letterSpacing,
        boxShadow: "none",
      }}>{children}</button>
  );
}

function IconBtn({ icon, color, onClick, label }) {
  const platform = usePlatform();
  // Material 3 standard icon button: 48dp touch target with 24dp glyph.
  // iOS/Web stays at 44dp / 22dp glyph.
  const isAndroid = platform === "android";
  const size      = isAndroid ? 48 : 44;
  const glyph     = isAndroid ? 24 : 22;
  const stroke    = isAndroid ? 2.2 : 2;
  const tint      = color || (isAndroid ? "#1d1d1d" : "#0063fb");
  return (
    <button
      className="press"
      onClick={() => { haptic("tap"); onClick?.(); }}
      aria-label={label}
      style={{
        width: size, height: size, border: 0, background: "transparent", cursor: "pointer",
        borderRadius: isAndroid ? 9999 : 0,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
      <Icon name={icon} size={glyph} color={tint} stroke={stroke} />
    </button>
  );
}

function Chip({ icon, children }) {
  const platform = usePlatform();
  const isAndroid = platform === "android";
  // Material 3 Assist Chip: 32dp height, 8dp corner radius, 1dp outline,
  // transparent background, Label Large (14sp / 500). on-surface-variant
  // for text + icon. iOS / Web keep the pill style.
  return (
    <span style={isAndroid ? {
      display: "inline-flex", alignItems: "center", gap: 8,
      height: 32, padding: "0 12px", borderRadius: 8,
      background: "transparent",
      border: "1px solid #79747e",      /* M3 outline */
      color: "#1d1d1d",                  /* on-surface */
      fontSize: 14, fontWeight: 500, letterSpacing: 0.1,
    } : {
      display: "inline-flex", alignItems: "center", gap: 6,
      padding: "6px 12px", borderRadius: 9999,
      background: "#f0f0f3", color: "#404040",
      fontSize: 13, fontWeight: 500,
    }}>
      {icon && <Icon name={icon} size={isAndroid ? 18 : 14} color={isAndroid ? "#1d1d1d" : "#404040"} stroke={2} />}
      {children}
    </span>
  );
}

function Fact({ label, children }) {
  return (
    <div>
      <p style={{ fontSize: 12, color: "#6b6b6b", margin: "0 0 2px" }}>{label}</p>
      <p style={{ fontSize: 15, fontWeight: 600, color: "#1d1d1d", margin: 0 }}>{children}</p>
    </div>
  );
}

// Sheet drag-handle — platform-aware. iOS / web: 40×5px soft grey pill.
// Android (Material 3): 32×4dp on-surface-variant pill, 8dp from top.
function SheetDragHandle() {
  const platform = usePlatform();
  const isAndroid = platform === "android";
  return (
    <div style={{
      width: isAndroid ? 32 : 40,
      height: isAndroid ? 4 : 5,
      borderRadius: 9999,
      background: isAndroid ? "#79747e" : "#d4d4d4",
    }} />
  );
}

// Pure job-ad body (header, facts, role copy). No NavBar, no apply CTA —

function JobAdContent({ job, embedded = false }) {
  const t = useT();
  const platform = usePlatform();
  const cardR = PLATFORM_RADII[platform].card;
  return (
    <>
      <div style={{ padding: embedded ? "8px 20px 16px" : "18px 20px 22px" }}>
        {!embedded && (
          <div style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 16 }}>
            <CompanyLogo size={56} initials={job.initials} color={job.brandColor} bg="#fff" logo={job.logo} />
            <div style={{ flex: 1, minWidth: 0, paddingTop: 2 }}>
              <h1 style={{

// ===========================================================
// APPLICATION PREVIEW SHEET — the merged "reviewable summary card"
// ===========================================================
function ApplicationPreviewSheet({
  job, state, loadingPhase = "ready", version = "mvp",
  magicMode = false, magicStep = 0,
  showJobMatch = false,
  onSend, onClose, onOpenLetter, onOpenCV, onOpenEdit, onFillMissing, onOpenActivity,
}) {
  const t = useT();
  const [exiting, close] = useDelayedClose(onClose, 320);
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;
  const cvLoading = loadingPhase === "loading-cv";
  const letterLoading = loadingPhase === "loading-cv" || loadingPhase === "loading-letter";
  const allReady = loadingPhase === "ready";
  const [sheetTab, setSheetTab] = useState("application"); // "application" | "ad"
  // First-time hint: pulse the inactive 'Job ad' tab once so users discover
  // they can re-read the ad without losing the draft. We use sessionStorage
  // so it stops nagging after the user has seen it.
  const [hintTab, setHintTab] = useState(() => {
    try { return sessionStorage.getItem("vend-tab-hint-seen") !== "1"; }
    catch (_) { return true; }
  });
  useEffect(() => {
    if (!hintTab) return;
    const t = setTimeout(() => {
      setHintTab(false);
      try { sessionStorage.setItem("vend-tab-hint-seen", "1"); } catch (_) {}
    }, 3200);
    return () => clearTimeout(t);
  }, [hintTab]);

  const missPers = state === "missing-personalia";
  const missCv = state === "missing-cv";
  const missQ = state === "missing-questions";
  // MVP = Easy Apply MVP. We strip all the "from profile" / "AI draft"
  // labels and the inline Edit/Endre buttons so the rows read as a clean
  // summary; the whole row is still tappable to open the editor.
  const isMvp = version === "mvp";
  // Employer questions are answered by the user — NOT pre-filled — in MVP.
  // Treat them as needing an answer until the user fills them in.
  const mvpQuestionsUnanswered = isMvp;
  const anyMissing = missPers || missCv || missQ || mvpQuestionsUnanswered;

  const rows = [
    {
      id: "personalia",
      title: t({ en: "Personal details", no: "Personalia" }),
      sub: missPers
        ? t({ en: "Phone number is missing", no: "Telefonnummer mangler" })
        : isMvp
          ? ""
          : t({ en: "Synced from your profile", no: "Hentet fra profilen din" }),
      source: null,
      status: missPers ? "missing" : "done",
      preview: false,
    },
    {
      id: "cv",
      title: "CV",
      sub: cvLoading
        ? t({ en: "Fetching your CV…", no: "Henter CV …" })
        : missCv
          ? t({ en: "No CV added — required to send", no: "Ingen CV lagt til – kreves for å sende" })
          : isMvp
            ? ""
            : t({ en: "Synced from your profile", no: "Hentet fra profilen din" }),
      source: null,
      status: cvLoading ? "loading" : missCv ? "missing" : "done",
      // No eye affordance — Endre is the single entry to the CV picker.
      preview: false,
    },
    {
      id: "letter",
      title: t({ en: "Cover letter", no: "Søknadsbrev" }),
      // Small FINN AI mark inline next to the title text, same height as text.
      // MVP doesn't surface AI provenance, so we drop the inline AI mark too.
      titleSuffix: (letterLoading || isMvp) ? null : <AILogo size={16} />,
      sub: letterLoading
        ? t({ en: "Drafting for this role…", no: "Skriver utkast for denne jobben …" })
        : isMvp
          ? ""
          : t({ en: "AI draft · editable", no: "AI-utkast · kan endres" }),
      // Source pill removed — the inline AI mark + plain-grey sub line carry it.
      source: null,
      status: letterLoading ? "loading" : isMvp ? "done" : "ai",
      // Endre is the single entry — opens the cover letter sheet directly.
      preview: false,
    },
    {
      id: "questions",
      title: t({ en: "Employer questions", no: "Spørsmål fra arbeidsgiver" }),
      sub: (missQ || mvpQuestionsUnanswered)
        ? t({ en: "3 questions need answers", no: "3 spørsmål mangler svar" })
        : isMvp
          ? ""
          : t({ en: "You answered 2 questions", no: "Du svarte på 2 spørsmål" }),
      source: null,
      status: (missQ || mvpQuestionsUnanswered) ? "missing" : "done",
      preview: false,
    },
  ];

  // Magic Apply (v2.0): override per-row statuses to tick off one by one.
  // Rows below the current magicStep look 'queued'; rows at-or-below tick to 'done'.
  // We also drop source pills and the bottom edit action — the user is hands-off.
  const magicRows = magicMode ? rows.map((r, i) => ({
    ...r,
    status: i < magicStep ? "done" : "queued",
    source: i < magicStep ? r.source : null,
    sub:    i < magicStep
              ? t({ en: "Optimised for this role", no: "Tilpasset denne rollen" })
              : t({ en: "Waiting", no: "Venter" }),
    preview: false,
  })) : rows;

  return (
    <div
      className={exiting ? "backdrop-exit" : ""}
      style={{
        position: "absolute", inset: 0, zIndex: 50,
        display: "flex", flexDirection: "column",
        background: "rgba(0,0,0,.30)",
        animation: "fadein 300ms var(--ease-modal)",
      }}>
      <div onClick={close} style={{ flex: `0 0 ${backdropH}px`, cursor: "pointer" }} />
      <div
        className={exiting ? "sheet-exit" : ""}
        style={{
          flex: 1, background: "#fff",
          borderTopLeftRadius: sheetRadius, borderTopRightRadius: sheetRadius,
          display: "flex", flexDirection: "column",
          boxShadow: "0 -4px 24px rgba(0,0,0,.10)",
          position: "relative", overflow: "hidden",
          animation: "slideup 440ms var(--ease-modal)",
        }}>
        {/* FINN Item-Page drawer header — circular close button top-left,
            company + title block below. Drag handle removed to match
            production. */}
        <div style={{ padding: "14px 16px 6px" }}>
          <button
            className="press"
            onClick={() => { haptic("tap"); close(); }}
            aria-label={t({ en: "Close", no: "Lukk" })}
            style={{
              width: 40, height: 40, borderRadius: 9999,
              background: "#f0f0f3", border: 0, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name="x" size={18} color="#1d1d1d" stroke={2.4} />
          </button>
        </div>
        <div style={{
          display: "flex", alignItems: "center", gap: 14,
          padding: "8px 16px 14px",
        }}>
          <CompanyLogo size={56} initials={job.initials} color={job.brandColor} logo={job.logo} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{
              fontSize: 13, fontWeight: 500, color: "#6b6b6b",
              margin: "0 0 2px", lineHeight: 1.2,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>{job.company}</p>
            <p style={{
              fontSize: 20, fontWeight: 700, color: "#1d1d1d",
              margin: 0, lineHeight: 1.2, letterSpacing: -0.3,
            }}>{t({ en: job.title, no: job.titleNo })}</p>
          </div>
        </div>

        {showJobMatch && (
          <div style={{
            padding: "0 16px 10px",
            display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap",
          }}>
            {/* Job match score (1.0+) */}
            <div style={{
              display: "inline-flex", alignItems: "center", gap: 6,
              padding: "5px 10px 5px 8px",
              background: "#eaf2ff",
              border: "1px solid rgba(0,99,251,0.18)",
              borderRadius: 9999,
              fontSize: 12, color: "#0063fb", fontWeight: 600,
              letterSpacing: -0.1,
              lineHeight: 1.35,
              boxSizing: "border-box",
            }}>
              <Icon name="sparkle" size={11} color="#0063fb" stroke={0} fill="#0063fb" />
              {t({ en: "87 % job match", no: "87 % match" })}
            </div>
            <button
              className="press"
              onClick={() => { haptic("tap"); /* future: open Job Match info sheet */ }}
              aria-label={t({ en: "What is Job Match?", no: "Hva er Job Match?" })}
              style={{
                appearance: "none", border: 0, background: "transparent",
                padding: "5px 4px", margin: 0,
                fontFamily: "inherit", fontSize: 12, fontWeight: 600,
                color: "#0063fb", letterSpacing: -0.1,
                cursor: "pointer", lineHeight: 1.35,
                display: "inline-flex", alignItems: "center", gap: 4,
              }}>
              <Icon name="info" size={13} color="#0063fb" stroke={2} />
              {t({ en: "What is Job Match?", no: "Hva er Job Match?" })}
            </button>
          </div>
        )}

        {/* In-sheet tabs: Application ↔ Job ad. Lets the seeker re-read the ad
            without dismissing the draft. iOS segmented control look. Hidden
            on MVP — that pattern lands in 1.0; MVP keeps a single Application
            view (dismiss the sheet to re-read the ad). */}
        {!isMvp && (
        <div style={{ padding: "2px 16px 12px" }}>
          <div role="tablist" aria-label={t({ en: "Sheet view", no: "Visning" })}
            style={{
              position: "relative",
              display: "grid", gridTemplateColumns: "1fr 1fr",
              background: "#eef0f5", borderRadius: 10, padding: 3,
              fontFamily: "inherit",
            }}>
            <div aria-hidden="true" style={{
              position: "absolute", top: 3, bottom: 3,
              left: sheetTab === "application" ? 3 : "calc(50% + 0px)",
              width: "calc(50% - 3px)",
              background: "#fff", borderRadius: 8,
              boxShadow: "0 1px 2px rgba(0,0,0,0.08), 0 1px 1px rgba(0,0,0,0.04)",
              transition: "left 320ms var(--ease-modal)",
            }} />
            <button
              role="tab"
              aria-selected={sheetTab === "application"}
              onClick={() => { haptic("tap"); setSheetTab("application"); }}

              style={{
                position: "relative", zIndex: 1,
                background: "transparent", border: 0,
                padding: "8px 10px",
                font: "600 13px/1 inherit", letterSpacing: -0.1,
                color: sheetTab === "application" ? "#1d1d1d" : "#6b6b6b",
                cursor: "pointer", borderRadius: 8,
                transition: "color 160ms var(--ease-out)",
              }}>
              {t({ en: "Application", no: "Søknaden" })}

              style={{
                position: "relative", zIndex: 1,
                background: "transparent", border: 0,

                color: sheetTab === "ad" ? "#1d1d1d" : "#6b6b6b",
                cursor: "pointer", borderRadius: 8,
                transition: "color 160ms var(--ease-out)",
              }}>
              {t({ en: "Job ad", no: "Annonsen" })}
            </button>
          </div>
        </div>
        )}

        {anyMissing && sheetTab === "application" && (

            background: "#fadddd", borderRadius: PLATFORM_RADII[platform].card,

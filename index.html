  // auto-fills; if the user has already typed something different, the AI
  // answer appears beneath as a "From AI" suggestion with a "Use AI answer"
  // swap. This is the co-draft pattern from the new design.
  const AI_ANSWER = {
    firstName: "George", lastName: "Town",
    email: "georgetownt@gmail.com", phone: "98 73 88 21",
    linkedin: "linkedin.com/in/georgetown",
  };
  const PD_KEYS = ["firstName", "lastName", "email", "phone", "linkedin"];
  const [aiStatus, setAiStatus] = useState({}); // key -> "loading" | "ready"
  const [pdReplaced, setPdReplaced] = useState({}); // key -> user's original value, kept after "Use AI answer" so they can Undo
  const pdTouchedRef = useRef({});
  const pdTimersRef = useRef([]);
  useEffect(() => {
    if (sectionSheet !== "personalia") return;
    pdTouchedRef.current = {};
    setAiStatus({ firstName: "loading", lastName: "loading", email: "loading", phone: "loading", linkedin: "loading" });
    setPdReplaced({});
    // Clear the values so the fields visibly load, then the AI streams them back.
    setFields(prev => {
      const n = { ...prev };
      PD_KEYS.forEach(k => { n[k] = { ...prev[k], v: "", e: false }; });
      return n;
    });
    pdTimersRef.current.forEach(clearTimeout);
    pdTimersRef.current = PD_KEYS.map((k, i) => setTimeout(() => {
      setAiStatus(s => ({ ...s, [k]: "ready" }));
      if (!pdTouchedRef.current[k]) update(k, AI_ANSWER[k]); // auto-fill if still untouched
      haptic("tap");
    }, 1100 + i * 850));
    return () => { pdTimersRef.current.forEach(clearTimeout); pdTimersRef.current = []; };
  }, [sectionSheet]);

  // One co-draft text field: skeleton while loading, editable input always,
  // "From AI" swap row when the AI answer differs from the user's text.
  function pdField(k, label, type = "text", ac, optional = false) {
    const f = fields[k];
    const loading = aiStatus[k] === "loading" && !f.v && !pdTouchedRef.current[k];
    const ready = aiStatus[k] === "ready";
    const replacedFrom = pdReplaced[k];                 // user's original value, kept after they accept the AI answer
    const applied = replacedFrom !== undefined;
    const showSug = ready && AI_ANSWER[k] && f.v && f.v !== AI_ANSWER[k] && !applied;
    const showRow = showSug || applied;
    return (
      <div className="ar-rv" key={k}>
        <p className="ar-rv-heading">
          <span className="ar-rv-heading-label">
            {label}
            {optional && (
              <span style={{ marginLeft: 8, fontSize: 14, fontWeight: 400, color: "#6b6b6b", letterSpacing: -0.05 }}>
                {t({ en: "Optional", no: "Valgfri" })}
              </span>
            )}
          </span>
        </p>
        {loading ? (
          <div style={{ height: 50, borderRadius: 12, background: "#f7f7f9", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 10px 0 16px" }}>
            <div style={{ width: 154, height: 12, borderRadius: 6, background: "#dde5f3", animation: "arSkeletonPulse 1.4s ease-in-out infinite" }} />
            <AILogo size={28} />
          </div>
        ) : (
          <input
            type={type} autoComplete={ac} value={f.v}
            placeholder={t({ en: "Type your answer", no: "Skriv svaret ditt" })}
            onChange={(e) => { pdTouchedRef.current[k] = true; if (pdReplaced[k] !== undefined) setPdReplaced(s => { const n = { ...s }; delete n[k]; return n; }); update(k, e.target.value); }}
            style={{
              width: "100%", boxSizing: "border-box",
              background: "#f7f7f9", border: "1px solid transparent", borderRadius: 12,
              padding: "13px 16px", fontFamily: "inherit", fontSize: 17, fontWeight: 500,
              color: "#1d1d1d", letterSpacing: -0.2, outline: "none", caretColor: "#0063fb",
            }}
            onFocus={(e) => { e.target.style.border = "1px solid #0063fb"; }}
            onBlur={(e) => { e.target.style.border = "1px solid transparent"; }}
          />
        )}
        {showRow && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: "#1f8a3b", background: "#e3f5e9", padding: "3px 9px", borderRadius: 9999, whiteSpace: "nowrap" }}>
              {t({ en: "AI suggestion", no: "AI-forslag" })}
            </span>
            <span style={{ flex: 1, minWidth: 0, fontSize: 15, color: applied ? "#6b6b6b" : "#1d1d1d", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {applied ? t({ en: "Using AI answer", no: "Bruker AI-svaret" }) : AI_ANSWER[k]}
            </span>
            {applied ? (
              <button
                className="press"
                onClick={() => { haptic("tap"); update(k, replacedFrom); setPdReplaced(s => { const n = { ...s }; delete n[k]; return n; }); }}
                style={{
                  flexShrink: 0, padding: "8px 12px", borderRadius: 8,
                  border: "1px solid #d4d4d4", background: "#fff", color: "#404040",
                  fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer",
                }}>
                {t({ en: "Undo", no: "Angre" })}
              </button>
            ) : (
              <button
                className="press"
                onClick={() => { haptic("tap"); setPdReplaced(s => ({ ...s, [k]: f.v })); update(k, AI_ANSWER[k]); }}
                style={{
                  flexShrink: 0, padding: "8px 12px", borderRadius: 8,
                  border: "1px solid #0063fb", background: "#fff", color: "#0063fb",
                  fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer",
                }}>
                {t({ en: "Use AI answer", no: "Bruk AI-svaret" })}
              </button>
            )}
          </div>
        )}
      </div>
    );
  }

  // Stage the preparing phase — each section ticks off one at a time.
  // 1s per section, 3s total. The Doherty Threshold (≤400ms feels instant,
  // ≥1s users start noticing) means we want this as tight as possible
  // without losing the visible "AI is working" reassurance. A short haptic
  // tick fires as each section lands so the user feels progress even if
  // they're not watching the rows. With `prepare-error`, the run fails
  // partway and lands the user on a yellow warning banner.
  useEffect(() => {
    if (isPrepareError) {
      // Personalia gets through, then we fail before vedlegg can land.
      const t1 = setTimeout(() => {
        setSectionPrep({ personalia: "done", vedlegg: "working", questions: "queued" });
        haptic("tap");
      }, 900);
      const t2 = setTimeout(() => {
        setPhase("prepare-error");
        haptic("err");
      }, 1700);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }
    const t1 = setTimeout(() => {
      setSectionPrep({ personalia: "done", vedlegg: "working", questions: "queued" });
      haptic("tap");
    }, 1000);
    const t2 = setTimeout(() => {
      setSectionPrep({ personalia: "done", vedlegg: "done", questions: "working" });
      haptic("tap");
    }, 2000);
    const t3 = setTimeout(() => {
      setSectionPrep({ personalia: "done", vedlegg: "done", questions: "done" });
      setPhase("ready");
      haptic("ok");
    }, 3000);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, [isPrepareError, prepareNonce]);

  // Status-line copy per section while it's "working". When the section is
  // "queued" it shows the generic waiting line; when "done" it falls
  // through to the section's normal summary sub.
  const SECTION_WORKING_TEXT = {
    personalia: { en: "Analysing application…", no: "Analyserer søknaden …" },
    vedlegg:    { en: "Reading documents…",     no: "Leser dokumenter …" },
    questions:  { en: "Building application…",  no: "Bygger søknaden …" },
  };
  const SECTION_QUEUED_TEXT = { en: "Waiting…", no: "Venter …" };

  function update(key, v) {
    setFields(prev => ({
      ...prev,
      [key]: { ...prev[key], v, e: v !== initial[key].v },
    }));
  }

  // Multi-select toggle — adds/removes an option from an array-valued field
  // (qSkills). Edited once anything is chosen.
  function toggleMulti(key, option) {
    setFields(prev => {
      const cur = prev[key].v;
      const next = cur.includes(option)
        ? cur.filter(x => x !== option)
        : [...cur, option];
      return { ...prev, [key]: { ...prev[key], v: next, e: next.length > 0 } };
    });
  }

  // A small "Edited" / "Redigert" chip — appears next to a field label
  // EditedChip lives at module scope now (see top of file) so its function
  // reference is stable across re-renders of AgenticReviewScreen.

  // Skeleton block while preparing.
  function Skeleton({ w = "100%", h = 14, mt = 8 }) {
    return (
      <div style={{
        width: w, height: h, marginTop: mt,
        background: "#dde5f3", borderRadius: 6,
        animation: "arSkeletonPulse 1.4s ease-in-out infinite",
      }} />
    );
  }

  // Source attribution per field — shown as a light-blue tag to the
  // right of the heading. Employer questions (qNorsk, qExp) come straight
  // from the employer so they don't carry a source tag; if the value is
  // empty we show a red "Missing" tag instead.
  const SOURCE_BY_KEY = {
    firstName: { en: "From your profile",       no: "Fra profilen din" },
    lastName:  { en: "From your profile",       no: "Fra profilen din" },
    email:     { en: "From your profile",       no: "Fra profilen din" },
    phone:     { en: "From your profile",       no: "Fra profilen din" },
    gender:    { en: "From your profile",       no: "Fra profilen din" },
    linkedin:  { en: "From your profile",       no: "Fra profilen din" },
    cv:        { en: "From your profile",       no: "Fra profilen din" },
    letter:    { en: "AI draft for this role",  no: "AI-utkast for denne jobben" },
    // qNorsk + qExp: no source tag — employer questions are answered by
    // the seeker, not provided by FINN or pulled from a profile.
  };

  // ReviewItem — the canonical Agentic field pattern. Heading + answer
  // pill + (source tag OR Missing tag). Tap the answer pill to swap into
  // an editable input. For enum fields, pass `options` and the pill row
  // becomes a PillRadio group. If the stored value is empty, a red
  // "Missing" tag replaces the source tag and a "This field is required"
  // line shows under the answer.
  function ReviewItem({ k, type = "text", autoComplete, options, multi = false }) {
    const f = fields[k];
    const isEditing = editing === k;
    const src = SOURCE_BY_KEY[k]; // undefined for employer questions
    // Multi-select is optional here, so it never shows the required "Missing"
    // tag; single-value fields are missing when empty.
    const isMissing = multi ? false : !f.v;

    let control;
    if (multi && options) {
      // Multi-select — filter chips. Several can be active; each selected
      // chip carries a leading check glyph (the cross-platform "checkbox"
      // signal) and a tonal fill, distinct from the solid-fill radios.
      control = (
        <>
          <div className="ar-check-pills" role="group" aria-label={LABELS[k]}>
            {options.map(o => {
              const on = f.v.includes(o.en);
              return (
                <label key={o.en} className={"ar-check-pill press" + (on ? " on" : "")}>
                  <input type="checkbox" name={k} value={o.en} checked={on}
                    onChange={() => { haptic("tap"); toggleMulti(k, o.en); }} />
                  {/* Leading affordance — a "+" on unselected chips that spins
                      into a checkmark when chosen. Both glyphs live in one
                      fixed slot and cross-fade/rotate via the .on state. */}
                  <span className="ar-pill-icon" aria-hidden="true">
                    <svg className="ic-plus" width="16" height="16" viewBox="0 0 24 24"
                      fill="none" stroke="currentColor" strokeWidth="2.4"
                      strokeLinecap="round" strokeLinejoin="round">
                      <line x1="12" y1="5" x2="12" y2="19" />
                      <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <svg className="ic-check" width="16" height="16" viewBox="0 0 24 24"
                      fill="none" stroke="currentColor" strokeWidth="2.6"
                      strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                  </span>
                  {t(o)}
                </label>
              );
            })}
          </div>
          <p className="ar-check-hint">
            {t({ en: "Select all that apply", no: "Velg alle som passer" })}
          </p>
        </>
      );
    } else if (options) {
      control = (
        <div className="ar-radio-pills" role="radiogroup" aria-label={LABELS[k]}>
          {options.map(o => (
            <label key={o.en} className={"ar-radio-pill press" + (f.v === o.en ? " on" : "")}>
              <input type="radio" name={k} value={o.en} checked={f.v === o.en}
                onChange={() => { haptic("tap"); update(k, o.en); }} />
              {t(o)}
            </label>
          ))}
        </div>
      );
    } else if (isEditing) {
      control = (
        <input
          className="ar-rv-input"
          type={type}
          autoComplete={autoComplete}
          value={f.v}
          autoFocus
          onChange={(e) => update(k, e.target.value)}
          onBlur={() => setEditing(null)}
          onKeyDown={(e) => { if (e.key === "Enter") setEditing(null); }}
        />
      );
    } else {
      control = (
        <button className="ar-rv-answer press"
          onClick={() => { haptic("tap"); setEditing(k); }}
          style={isMissing ? { color: "#6b6b6b" } : null}>
          {f.v || <span style={{ color: "#6b6b6b" }}>—</span>}
        </button>
      );
    }

    return (
      <div className="ar-rv">
        <p className="ar-rv-heading">
          <span className="ar-rv-heading-label">{LABELS[k]}</span>
          {/* MVP — no source / edit chips next to inputs. Only the
              red "Missing" tag stays so required fields read clearly. */}
          {isMissing && (
            <span className="ar-rv-missing">{t({ en: "Missing", no: "Mangler" })}</span>
          )}
        </p>
        {control}
        {isMissing && (
          <p className="ar-rv-error">
            {t({ en: "This field is required", no: "Dette feltet er påkrevd" })}
          </p>
        )}
      </div>
    );
  }

  // File rows now drill into a sub-page *inside the same sheet* rather than
  // spawning EditSheet / CoverLetterSheet on top. iOS UINavigationController
  // pattern: tap → page-push transition inside the existing sheet.
  function FileCard({ k }) {
    const f = fields[k];
    const open = () => {
      haptic("tap");
      pushVedleggPage(k === "cv" ? "cv-picker" : "letter-picker");
    };
    return (
      <div className="ar-rv">
        <p className="ar-rv-heading">
          <span className="ar-rv-heading-label">{LABELS[k]}</span>
          {/* MVP — no source / edit chips on file rows. */}
        </p>
        <CVOption
          icon={k === "letter" ? "sparkle" : "file"}
          title={f.v || t({ en: "No file selected", no: "Ingen fil valgt" })}
          sub={t({ en: "Tap to change", no: "Trykk for å bytte" })}
          showChevron
          onClick={open}
        />
      </div>
    );
  }

  // Computed section status — "any field edited?" → drives the Edited chip
  // on the collapsed section row.
  const personaliaEdited = fields.firstName.e || fields.lastName.e || fields.email.e
                        || fields.phone.e || fields.gender.e || fields.linkedin.e;
  const vedleggEdited    = fields.cv.e || fields.letter.e;
  const questionsEdited  = fields.qNorsk.e || fields.qExp.e || fields.qSkills.e;

  // Subtitle summaries (what the agent prepared, in plain text). Enum
  // values are stored canonically in English (Yes/No, Male/Female/Other)
  // so we translate them locally for display.
  const yesNoDisplay = fields.qNorsk.v
    ? t({ en: fields.qNorsk.v, no: fields.qNorsk.v === "Yes" ? "Ja" : "Nei" })
    : "";
  const personaliaSub = `${fields.firstName.v} ${fields.lastName.v} · ${fields.email.v}`;
  const vedleggSub    = [fields.cv.v, fields.letter.v].filter(Boolean).join(" · ")
                        || t({ en: "No attachments", no: "Ingen vedlegg" });
  // Count which additional questions are still unanswered so the row can
  // show "2 questions need answers" instead of an awkward empty summary.
  const questionsMissingCount = (fields.qNorsk.v ? 0 : 1) + (fields.qExp.v ? 0 : 1);
  const questionsMissing = questionsMissingCount > 0;
  const questionsSub = questionsMissing
    ? t({
        en: questionsMissingCount === 1 ? "1 question needs an answer" : `${questionsMissingCount} questions need answers`,
        no: questionsMissingCount === 1 ? "Ett spørsmål mangler svar"   : `${questionsMissingCount} spørsmål mangler svar`,
      })
    : `${t({ en: "Norwegian", no: "Norsk" })}: ${yesNoDisplay} · ${fields.qExp.v}`;

  // SectionRow lives at module scope (see top of file). The inner copy used
  // to redeclare on every parent re-render, which caused React to unmount/
  // remount it and re-fire the .ar-check-land entry animation every time
  // the confirm toggle (or any other state inside this component) changed.

  // Helper — what sub-line to show for a section during preparing phase.
  // "working" → its dedicated working text. "queued" → generic waiting.
  function prepSub(secId) {
    const s = sectionPrep[secId];
    if (s === "working") return t(SECTION_WORKING_TEXT[secId]);
    if (s === "queued")  return t(SECTION_QUEUED_TEXT);
    return null; // "done" falls through to the section's normal summary
  }

  // ─── Sheet body — Application tab ──────────────────────────────────
  // Unified structure across BOTH phases so React reconciles every
  // SectionRow at the same DOM position. Phase-specific UI (the prepare
  // notice, the lede, the confirm card) crossfades in place instead of
  // restructuring the body. This kills the "menu + text flashing" that
  // happened when the whole subtree swapped at phase=ready.
  const isPreparing = phase === "preparing";
  const showPrepareError = phase === "prepare-error";
  const showSendError = sendFailed;
  const normalApplicationBody = (
    <>
      {/* Header band — preparing notice ↔ lede live in the same grid cell
          and crossfade. The cell sizes to the taller of the two so the
          rows underneath don't shift vertically when phase flips. */}
      <div style={{ padding: "14px 20px 6px" }}>
        <div style={{
          display: "grid",
          gridTemplateColumns: "1fr",
          gridTemplateRows: "1fr",
        }}>
          <div style={{
            gridColumn: 1, gridRow: 1,
            padding: "14px 16px",
            background: "#eaf2ff",
            border: "1px solid rgba(0,99,251,0.16)",
            borderRadius: 14,
            color: "#1d1d1d",
            font: "500 14px/1.45 var(--sys-text)",
            letterSpacing: -0.1,
            opacity: isPreparing ? 1 : 0,
            transition: "opacity 380ms cubic-bezier(0.45, 0, 0.25, 1)",
            pointerEvents: isPreparing ? "auto" : "none",
          }} role="status" aria-live="polite">
            {t({
              en: "Preparing your application! Please do not close the page.",
              no: "Forbereder søknaden din! Ikke lukk siden.",
            })}
          </div>
          <p className="ar-lede" style={{
            gridColumn: 1, gridRow: 1,
            margin: 0,
            opacity: isPreparing ? 0 : 1,
            transition: "opacity 420ms cubic-bezier(0.45, 0, 0.25, 1) 100ms",
            pointerEvents: isPreparing ? "none" : "auto",
          }}>
            {t({
              en: "We've auto-filled your application based on your Job profile. Review and confirm, and we'll send it for you.",
              no: "Vi har automatisk fylt ut søknaden din basert på Jobbprofilen din. Se gjennom og bekreft, så sender vi for deg.",
            })}
          </p>
        </div>
      </div>

      {/* Rows — same JSX shape in both phases. Sub-text picks up the
          preparing-phase copy automatically; once done, it falls through
          to the section's final summary. */}
      <div className="ar-rows">
        <SectionRow id="personalia"
          status={isPreparing ? sectionPrep.personalia : "done"}
          title={t({ en: "Personal details", no: "Personopplysninger" })}
          sub={(isPreparing && sectionPrep.personalia !== "done")
            ? prepSub("personalia") : personaliaSub}
          edited={!isPreparing && personaliaEdited}
          onTap={setSectionSheet} />
        <SectionRow id="vedlegg"
          status={isPreparing ? sectionPrep.vedlegg : "done"}
          title={t({ en: "Attachments", no: "Vedlegg" })}
          sub={(isPreparing && sectionPrep.vedlegg !== "done")
            ? prepSub("vedlegg") : vedleggSub}
          edited={!isPreparing && vedleggEdited}
          onTap={setSectionSheet} />
        <SectionRow id="questions"
          status={isPreparing
            ? sectionPrep.questions
            : questionsMissing ? "missing" : "done"}
          title={t({ en: "Additional questions", no: "Tilleggsspørsmål" })}
          sub={(isPreparing && sectionPrep.questions !== "done")
            ? prepSub("questions") : questionsSub}
          edited={!isPreparing && questionsEdited}
          onTap={setSectionSheet} />
      </div>

      {/* Extra confirmation checkbox — unchecked by default. Sits beneath
          the section rows and above the main confirm toggle. */}
      <div style={{
        padding: "8px 20px 0",
        opacity: isPreparing ? 0 : 1,
        transition: "opacity 420ms cubic-bezier(0.45, 0, 0.25, 1) 160ms",
        pointerEvents: isPreparing ? "none" : "auto",
      }}>
        <label className="ar-confirm-check">
          <input
            type="checkbox"
            checked={extraConfirmed}
            onChange={(e) => setExtraConfirmed(e.target.checked)}
          />
          <span>Jeg bekrefter at all informasjonen ovenfor er korrekt</span>
        </label>
      </div>

      {/* Confirm card — fades in at phase=ready but its container reserves
          space so the rows above don't shift down when it appears. */}
      <div style={{
        padding: "20px 20px 12px",
        opacity: isPreparing ? 0 : 1,
        transition: "opacity 420ms cubic-bezier(0.45, 0, 0.25, 1) 160ms",
        pointerEvents: isPreparing ? "none" : "auto",
      }}>
        <div className="ar-confirm-card">
          <IOSSwitch
            checked={confirmed}
            onChange={setConfirmed}
            label={t({
              en: "I confirm all the information above is correct",
              no: "Jeg bekrefter at informasjonen ovenfor er korrekt",
            })}
            hint={confirmed
              ? t({ en: "Ready to send", no: "Klar til å sendes" })
              : t({ en: "Required before sending", no: "Må bekreftes før du sender" })}
          />
        </div>
      </div>
    </>
  );

  // Body swap — backend-error banners take over the full content area;
  // the sheet's header (logo + close) and footer (Send button) stay so
  // the user can dismiss or retry from either the banner CTAs or the X.
  const applicationBody = showPrepareError ? (
    <div style={{ padding: "20px" }}>
      <ApplyErrorBanner
        variant="warning"
        onTryAgain={retryPrepare}
        onBack={() => close()}
      />
    </div>
  ) : showSendError ? (
    <div style={{ padding: "20px" }}>
      <ApplyErrorBanner
        variant="critical"
        onBack={() => close()}
      />
    </div>
  ) : normalApplicationBody;

  // ─── Section sheet bodies ──────────────────────────────────────────
  // Each section's edit form lives in its own bottom drawer that
  // overlays the agentic review sheet. Same shell pattern as MVP's
  // EditSheet so the form-editing experience feels native.
  const SECTION_TITLES = {
    personalia: { en: "Personal details", no: "Personopplysninger" },
    vedlegg:    { en: "Attachments",      no: "Vedlegg" },
    questions:  { en: "Additional questions", no: "Tilleggsspørsmål" },
  };

  const sectionBody = sectionSheet === "personalia" ? (
    <>
      {/* Preparing banner — invites the user to fill in while the AI works. */}
      <div style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "14px 16px", background: "#eaf2ff", borderRadius: 14, marginBottom: 20 }}>
        <div style={{ flexShrink: 0, marginTop: 1 }}><AILogo size={24} /></div>
        <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45, color: "#1d1d1d", letterSpacing: -0.1 }}>
          {t({
            en: "We're preparing your application. In the meantime you're welcome to start filling in the application yourself.",
            no: "Vi forbereder søknaden din. I mellomtiden kan du gjerne begynne å fylle ut søknaden selv.",
          })}
        </p>
      </div>
      {pdField("firstName", LABELS.firstName, "text", "given-name")}
      {pdField("lastName", LABELS.lastName, "text", "family-name")}
      {pdField("email", LABELS.email, "email", "email")}
      {pdField("phone", LABELS.phone, "tel", "tel")}
      <ReviewItem k="gender" options={[

          {/* Footer — context-aware. On a picker sub-page the bottom CTA
              becomes "Use this CV / cover letter" and commits the staged
              upload; everywhere else it's the section's "Done". */}
          <div style={{
            padding: "12px 16px",
            paddingBottom: `calc(12px + ${homeArea}px)`,

            borderTop: "0.5px solid rgba(0,0,0,0.06)",

            ) : (
              <PrimaryButton onClick={() => { haptic("ok"); closeSectionSheet(); }}>
                {t({ en: "Done", no: "Ferdig" })}
              </PrimaryButton>
            )}
          </div>
        </div>
      </div>
    )}

  );

// ApplyDrawer — the 480px right-anchored drawer that hosts the agentic
// review content on desktop. Mirrors the AgenticReviewScreen so labels,
// values, and visuals (.ar-rv field pattern, radio pills, source pills,
// edited chips) are identical to what the mobile section-sheets show —
// just stacked inline since desktop has the vertical room.
function ApplyDrawer({ onClose, confirmed, onConfirmedChange, onSend }) {
  const t = useT();
  const [exiting, close] = useDelayedClose(onClose, 280);
  // Each field carries v (value), r (ready — agent has filled it OR user
  // has touched it), e (edited by user). Initial state: all empty + not
  // ready. Arrival timers below stream values into fields out-of-order,
  // mirroring how the real agent works (instant profile fields, fast
  // questions, slower cover-letter generation). Users can edit any
  // already-ready field while the rest are still streaming.
  const [fields, setFields] = useState({
    firstName: { v: "", r: false, e: false },
    lastName:  { v: "", r: false, e: false },
    email:     { v: "", r: false, e: false },
    phone:     { v: "", r: false, e: false },
    gender:    { v: "", r: false, e: false },
    linkedin:  { v: "", r: false, e: false },
    cv:        { v: "", r: false, e: false },
    letter:    { v: "", r: false, e: false },
    qNorsk:    { v: "", r: false, e: false },
    qExp:      { v: "", r: false, e: false },
  });
  const [includeLinkedin, setIncludeLinkedin] = useState(true);

  // Fields that the agent surfaces but does NOT auto-fill — the user has
  // to answer these. The agent's job here is just to "fetch" them from
  // the ad so they appear in the form; the value stays empty until the
  // user clicks. They show a "Your answer needed" pill (not the
  // "Filling…" shimmer), and the Send button stays locked until both
  // are answered.
  const ASK_USER = useRef(new Set(["qNorsk", "qExp"])).current;

  // Simulated agent arrivals — deliberately out-of-order and stretched
  // to ~90s total so the streaming-in-place pattern is fully observable
  // for testing. Personalia trickles in over the first ~25s; questions
  // land mid-way as empty fields the user must answer; the cover letter
  // is the LLM-slow tail at ~88s. This is "testing speed" — divide every
  // value by ~30 to get realistic production timing (~3s total) when
  // you're done observing.
  const ARRIVALS = useRef([
    { key: "firstName", v: "George",                at:  3000 },
    { key: "email",     v: "georgetownt@gmail.com", at:  7000 },
    { key: "lastName",  v: "Town",                  at: 12000 },
    { key: "qExp",      v: "",                      at: 18000 }, // user-input
    { key: "phone",     v: "98 73 88 21",           at: 24000 },
    { key: "cv",        v: "CV_2025.pdf",           at: 32000 },
    { key: "linkedin",  v: "Georgetownlinkedin",    at: 41000 },
    { key: "qNorsk",    v: "",                      at: 52000 }, // user-input
    { key: "gender",    v: "Male",                  at: 65000 },
    { key: "letter",    v: "Cover_Letter_2025.doc", at: 88000 },
  ]).current;

  useEffect(() => {
    const timers = ARRIVALS.map(({ key, v, at }) =>
      setTimeout(() => {
        setFields(prev => {
          // Don't overwrite a field the user has already edited — first
          // edit wins, agent's draft is silently dropped for that field.
          if (prev[key].e) return prev;
          return { ...prev, [key]: { v, r: true, e: false } };
        });
      }, at)
    );
    return () => timers.forEach(clearTimeout);
  // ARRIVALS is a useRef.current, stable for the life of the component.
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function update(key, v) {
    // User input: mark ready + edited so the pending arrival timer skips
    // it. For ASK_USER fields the user is the original author (not an
    // editor), so we don't set the "edited" flag — that's reserved for
    // fields where the user has changed an agent-provided value.
    setFields(prev => ({
      ...prev,
      [key]: { v, r: true, e: !ASK_USER.has(key) && v !== "" },
    }));
  }

  // Aggregate state per section. Three buckets per field:
  //  • pending    — agent hasn't surfaced it yet (r === false)
  //  • needs-input — agent has surfaced an ASK_USER field that's empty
  //  • complete    — has a value (agent-filled or user-answered)
  // Sections are "done" only when every field is complete.
  const SECTION_KEYS = {
    personalia: ["firstName", "lastName", "email", "phone", "gender", "linkedin"],
    attachments: ["cv", "letter"],
    questions: ["qNorsk", "qExp"],
  };
  function isComplete(k)   { return fields[k].r && (!ASK_USER.has(k) || fields[k].v !== ""); }
  function isNeedsInput(k) { return fields[k].r && ASK_USER.has(k) && fields[k].v === ""; }
  function sectionState(keys) {
    const processed = keys.filter(k => fields[k].r).length;
    const complete  = keys.filter(isComplete).length;
    const needsInput = keys.filter(isNeedsInput).length;
    return {
      processed, complete, needsInput,
      total: keys.length,
      streaming: processed < keys.length,
      done: complete === keys.length,
    };
  }
  const personaliaState  = sectionState(SECTION_KEYS.personalia);
  const attachmentsState = sectionState(SECTION_KEYS.attachments);
  const questionsState   = sectionState(SECTION_KEYS.questions);
  // agentDone — agent has surfaced every field (no spinners left).
  // allReady   — every required field also has a value (send-eligible).
  const agentDone = !personaliaState.streaming && !attachmentsState.streaming && !questionsState.streaming;
  const allReady  = personaliaState.done && attachmentsState.done && questionsState.done;
  // Count of user-input fields still waiting on the user.
  const needsInputCount = personaliaState.needsInput + attachmentsState.needsInput + questionsState.needsInput;

  // Labels are the same as AgenticReviewScreen's LABELS map.
  const LABELS = {
    firstName: t({ en: "First name", no: "Fornavn" }),
    lastName:  t({ en: "Last name",  no: "Etternavn" }),
    email:     t({ en: "Email",      no: "Epost" }),
    phone:     t({ en: "Phone number", no: "Telefonnummer" }),
    gender:    t({ en: "Gender",     no: "Kjønn" }),
    linkedin:  t({ en: "LinkedIn URL", no: "LinkedIn-lenke" }),
    cv:        t({ en: "CV",         no: "CV" }),
    letter:    t({ en: "Cover letter", no: "Søknadsbrev" }),
    qNorsk:    t({ en: "Do you speak fluent Norwegian?", no: "Behersker du norsk flytende?" }),
    qExp:      t({ en: "How many years of relevant experience do you have?", no: "Hvor mange års relevant erfaring har du?" }),
  };

  // Send blocked while anything's still streaming OR user hasn't confirmed.
  const sendBlocked = !allReady || !confirmed;

  return (
    <>
      <div
        className={"apply-backdrop" + (exiting ? " backdrop-exit" : "")}
        onClick={close}
        aria-hidden="true"
      />
    <aside
      className={"apply-drawer" + (exiting ? " drawer-exit" : "")}
      role="dialog"
      aria-modal="true"
      aria-label={t({ en: "Review your application", no: "Se gjennom søknaden din" })}
    >
      <header className="drawer-head">
        <button className="drawer-back" onClick={close}>
          <Icon name="chevron-left" size={16} stroke={2.4} />
          {t({ en: "Back to job page", no: "Tilbake til annonsen" })}
        </button>
        <div className="drawer-title-row">
          <h1>{t({ en: "Review your application", no: "Se gjennom søknaden din" })}</h1>
          {!agentDone ? (
            <span className="drawer-drafting-pill" aria-live="polite">
              <span className="drawer-drafting-dot" />
              <span className="ai-shimmer-text">{t({ en: "Drafting…", no: "Skriver …" })}</span>
            </span>
          ) : needsInputCount > 0 ? (
            <span className="drawer-turn-pill" aria-live="polite">
              <span className="drawer-turn-dot" />
              {t({
                en: needsInputCount === 1 ? "Your answer needed" : "Your answers needed",
                no: needsInputCount === 1 ? "Ditt svar trengs"  : "Dine svar trengs",
              })}
            </span>
          ) : null}
        </div>
        <p className="drawer-sub">Fag- og personalleder — Politiets IT-enhet</p>
        <p className="drawer-lede">{t({
          en: "We're auto-filling your application from your Job profile. Edit anything as it streams in, then send.",
          no: "Vi fyller ut søknaden din fra Jobbprofilen din. Du kan endre alt etter hvert som det kommer inn, og sende når du er klar.",
        })}</p>
      </header>

      <div className="drawer-body">
        {/* Personal details — same field set as the mobile Personalia sheet.
            Section heads echo the loading rows: green check + title + status
            sub, so the eye registers each section as "the loaded version of
            that row" rather than a brand-new affordance. */}
        <section className="drawer-section">
          <header className="drawer-section-head">
            <h2 className="drawer-section-title">
              <SectionStatusGlyph state={personaliaState} />
              <span>{t({ en: "Personal details", no: "Personalia" })}</span>
            </h2>
            <p className="drawer-section-status">
              {personaliaState.done
                ? t({ en: "Synced from your profile", no: "Hentet fra profilen din" })
                : t({
                    en: `Filling ${personaliaState.ready} of ${personaliaState.total} fields…`,
                    no: `Fyller ut ${personaliaState.ready} av ${personaliaState.total} felt …`,
                  })}
            </p>
          </header>
          <div className="drawer-section-fields">
            <DrawerField label={LABELS.firstName} field={fields.firstName} onChange={(v) => update("firstName", v)} autoComplete="given-name" />
            <DrawerField label={LABELS.lastName}  field={fields.lastName}  onChange={(v) => update("lastName",  v)} autoComplete="family-name" />
            <DrawerField label={LABELS.email}     field={fields.email}     onChange={(v) => update("email",     v)} type="email" autoComplete="email" />
            <DrawerField label={LABELS.phone}     field={fields.phone}     onChange={(v) => update("phone",     v)} type="tel"   autoComplete="tel" />
            <DrawerRadio label={LABELS.gender}    field={fields.gender}    onChange={(v) => update("gender",    v)}
              options={[
                { id: "Male",   label: t({ en: "Male",   no: "Mann"   }) },
                { id: "Female", label: t({ en: "Female", no: "Kvinne" }) },
                { id: "Other",  label: t({ en: "Other",  no: "Annet"  }) },
              ]} />
            <div className={"ar-rv" + (!fields.linkedin.r ? " is-pending" : "")}>
              <p className="ar-rv-heading">
                <span className="ar-rv-heading-label">{LABELS.linkedin}</span>
                {!fields.linkedin.r ? (
                  <span className="drawer-pending-pill">
                    <span className="drawer-spinner drawer-spinner-xs" aria-hidden="true" />
                    <span className="ai-shimmer-text">{t({ en: "Filling …", no: "Fyller ut …" })}</span>
                  </span>
                ) : (
                  <span className="ar-rv-source" style={{ background: "#f0f0f3", color: "#6b6b6b" }}>
                    {t({ en: "Optional", no: "Valgfritt" })}
                  </span>
                )}
              </p>
              {!fields.linkedin.r ? (
                <button
                  type="button"
                  className="drawer-skeleton-input"
                  onClick={() => update("linkedin", "")}
                  aria-label={t({ en: "Edit early", no: "Endre nå" })}
                >
                  <span className="skeleton" />
                </button>
              ) : (
                <>
                  <DrawerInput value={fields.linkedin.v} onChange={(v) => update("linkedin", v)} />
                  <label className="drawer-checkrow">
                    <input
                      type="checkbox"
                      checked={includeLinkedin}
                      onChange={(e) => setIncludeLinkedin(e.target.checked)}
                    />
                    <span>{t({ en: "Add this optional information to my application",
                              no: "Inkluder denne valgfrie informasjonen i søknaden min" })}</span>
                  </label>
                </>
              )}
            </div>
          </div>
        </section>

        {/* Vedlegg — CV + Cover letter, FileCard-style. */}
        <section className="drawer-section">
          <header className="drawer-section-head">
            <h2 className="drawer-section-title">
              <SectionStatusGlyph state={attachmentsState} />
              <span>{t({ en: "Attachments", no: "Vedlegg" })}</span>
              <span className="drawer-section-title-suffix"><AILogo size={14} /></span>
            </h2>
            <p className="drawer-section-status">
              {attachmentsState.done
                ? t({ en: "CV from your profile · AI-drafted cover letter",
                     no: "CV fra profilen · AI-utkast for søknadsbrev" })
                : !fields.cv.r
                  ? t({ en: "Fetching your CV…", no: "Henter CV …" })
                  : t({ en: "Drafting your cover letter — feel free to keep reviewing.",
                       no: "Skriver søknadsbrev — du kan fortsette å se gjennom." })}
            </p>
          </header>
          <div className="drawer-section-fields">
            <DrawerFile label={LABELS.cv}     file={fields.cv}     icon="file"
              onSwap={() => update("cv",     "CV_new.pdf")} />
            <DrawerFile label={LABELS.letter} file={fields.letter} icon="sparkle"
              onSwap={() => update("letter", "Cover_letter_new.doc")} />
          </div>
        </section>

        {/* Tilleggsspørsmål — qNorsk + qExp. */}
        <section className="drawer-section">
          <header className="drawer-section-head">
            <h2 className="drawer-section-title">
              <SectionStatusGlyph state={questionsState} />
              <span>{t({ en: "Employer questions", no: "Spørsmål fra arbeidsgiver" })}</span>
            </h2>
            <p className="drawer-section-status">
              {questionsState.done
                ? t({ en: "Answers ready", no: "Svar er klare" })
                : questionsState.streaming
                  ? t({
                      en: `Fetching ${questionsState.total - questionsState.processed} more from the ad…`,
                      no: `Henter ${questionsState.total - questionsState.processed} til fra annonsen …`,
                    })
                  : t({
                      en: `${questionsState.needsInput} ${questionsState.needsInput === 1 ? "question" : "questions"} need your answer`,
                      no: `${questionsState.needsInput} ${questionsState.needsInput === 1 ? "spørsmål trenger" : "spørsmål trenger"} ditt svar`,
                    })}
            </p>
          </header>
          <div className="drawer-section-fields">
            <DrawerRadio label={LABELS.qNorsk} field={fields.qNorsk} askUser
              onChange={(v) => update("qNorsk", v)}
              options={[
                { id: "Yes", label: t({ en: "Yes", no: "Ja"  }) },
                { id: "No",  label: t({ en: "No",  no: "Nei" }) },
              ]} />
            <DrawerField label={LABELS.qExp} field={fields.qExp} askUser onChange={(v) => update("qExp", v)} />
          </div>
        </section>
      </div>

      <footer className="drawer-foot">
        <label className={"drawer-confirm" + (!allReady ? " is-locked" : "")}>
          <input
            type="checkbox"
            checked={confirmed}
            disabled={!allReady}
            onChange={(e) => onConfirmedChange?.(e.target.checked)}
          />
          <span>
            {t({ en: "I confirm all the information above is correct",
                 no: "Jeg bekrefter at informasjonen ovenfor er korrekt" })}
          </span>
        </label>
        <button
          onClick={onSend}
          disabled={sendBlocked}
          className={"drawer-send" + (sendBlocked ? " is-blocked" : "")}
          title={
            !agentDone
              ? t({ en: "Still drafting…", no: "Skriver fortsatt …" })
              : needsInputCount > 0
                ? t({ en: "Answer the remaining questions to send", no: "Svar på resten for å sende" })
                : undefined
          }
        >
          {!agentDone
            ? t({ en: "Drafting…", no: "Skriver …" })
            : needsInputCount > 0
              ? t({
                  en: needsInputCount === 1 ? "Answer 1 question to send" : `Answer ${needsInputCount} questions to send`,
                  no: needsInputCount === 1 ? "Svar på 1 spørsmål for å sende" : `Svar på ${needsInputCount} spørsmål for å sende`,
                })
              : t({ en: "Send application", no: "Send søknad" })}
        </button>
      </footer>
    </aside>
    </>
  );
}

// SectionStatusGlyph — three-state indicator on section heads:
//  • spinner   — agent is still streaming fields into this section
//  • attention — agent is done, but the user has answers to provide
//  • check     — section is fully complete (agent + any user input)
function SectionStatusGlyph({ state }) {
  if (state.done) {
    return <Icon name="check-circle" size={20} color="#1f8a3b" stroke={2} />;
  }
  if (state.streaming) {
    return <span className="section-glyph-spinner" aria-hidden="true" />;
  }
  // Agent done, waiting on the user.
  return <span className="section-glyph-attention" aria-hidden="true" />;
}

// DrawerField — three-state input:
//  • pending     — agent hasn't surfaced it yet → skeleton placeholder
//  • needs-input — agent surfaced an empty field for the user to answer
//                  → enabled input with a "Your answer needed" pill
//  • ready       — has a value (agent-filled or user-answered)
function DrawerField({ label, field, onChange, type = "text", autoComplete, askUser = false }) {
  const t = useT();
  if (!field.r) {
    return (
      <div className="ar-rv is-pending">
        <p className="ar-rv-heading">
          <span className="ar-rv-heading-label">{label}</span>
          <span className="drawer-pending-pill">
            <span className="drawer-spinner drawer-spinner-xs" aria-hidden="true" />
            <span className="ai-shimmer-text">{t({ en: "Filling …", no: "Fyller ut …" })}</span>
          </span>
        </p>
        <button
          type="button"
          className="drawer-skeleton-input"
          onClick={() => onChange?.("")}
          aria-label={t({ en: "Edit early", no: "Endre nå" })}
        >
          <span className="skeleton" />
        </button>
      </div>
    );
  }
  const needsInput = askUser && field.v === "";
  return (
    <div className={"ar-rv" + (needsInput ? " is-needs-input" : "")}>
      <p className="ar-rv-heading">
        <span className="ar-rv-heading-label">{label}</span>
        {needsInput ? (
          <span className="drawer-needs-pill">
            <span className="drawer-needs-dot" />
            {t({ en: "Your answer needed", no: "Ditt svar trengs" })}
          </span>
        ) : (
          field.e && !askUser && <DrawerEditedChip />
        )}
      </p>
      <DrawerInput value={field.v} onChange={onChange} type={type} autoComplete={autoComplete} placeholder={needsInput ? t({ en: "Type your answer…", no: "Skriv svaret ditt …" }) : undefined} />
    </div>
  );
}

function DrawerInput({ value, onChange, type = "text", autoComplete, placeholder }) {
  const [focused, setFocused] = useState(false);
  return (
    <input
      type={type}
      value={value}
      autoComplete={autoComplete}
      placeholder={placeholder}
      onChange={(e) => onChange?.(e.target.value)}
      onFocus={() => setFocused(true)}
      onBlur={() => setFocused(false)}
      className="ar-rv-input"
      style={{ borderColor: focused ? "#0063fb" : "transparent" }}
    />
  );
}

// Radio pills — matches the mobile .ar-radio-pills look exactly.
// WARP-spec radio group used inside the desktop drawer: vertically-stacked
// rows with a true 20px radio control on the left + label on the right.
// Mirrors WARP's @warp-ds/css radio styles (strong border unchecked,
// FINN-blue border + 10px inner dot when checked, 44px tap target).
function DrawerRadio({ label, options, field, onChange, askUser = false }) {
  const t = useT();
  const groupName = (typeof label === "string" ? label : "radio").replace(/\s+/g, "-").toLowerCase();
  const pending = !field.r;
  const needsInput = !pending && askUser && field.v === "";
  return (
    <div className={"ar-rv" + (pending ? " is-pending" : "") + (needsInput ? " is-needs-input" : "")}>
      <p className="ar-rv-heading">
        <span className="ar-rv-heading-label">{label}</span>
        {pending ? (
          <span className="drawer-pending-pill">
            <span className="drawer-spinner drawer-spinner-xs" aria-hidden="true" />
            <span className="ai-shimmer-text">{t({ en: "Filling …", no: "Fyller ut …" })}</span>
          </span>
        ) : needsInput ? (
          <span className="drawer-needs-pill">
            <span className="drawer-needs-dot" />
            {t({ en: "Your answer needed", no: "Ditt svar trengs" })}
          </span>
        ) : (
          field.e && !askUser && <DrawerEditedChip />
        )}
      </p>
      <div className="warp-radio-group" role="radiogroup" aria-label={typeof label === "string" ? label : undefined}>
        {options.map(o => (
          <label key={o.id} className={"warp-radio" + (field.v === o.id ? " is-checked" : "") + (pending ? " is-pending" : "")}>
            <input
              type="radio"
              name={groupName}
              checked={field.v === o.id}
              disabled={pending}
              onChange={() => onChange?.(o.id)}
            />
            <span className="warp-radio-control" aria-hidden="true" />
            <span className="warp-radio-label">{o.label}</span>
          </label>
        ))}
      </div>
    </div>
  );
}

// File card — mirrors the mobile FileCard (icon disk + filename + Tap-to-change).
function DrawerFile({ label, file, icon, onSwap }) {
  const t = useT();
  const pending = !file.r;
  return (
    <div className={"ar-rv" + (pending ? " is-pending" : "")}>
      <p className="ar-rv-heading">
        <span className="ar-rv-heading-label">{label}</span>
        {pending ? (
          <span className="drawer-pending-pill">
            <span className="drawer-spinner drawer-spinner-xs" aria-hidden="true" />
            <span className="ai-shimmer-text">{t({ en: "Filling …", no: "Fyller ut …" })}</span>
          </span>
        ) : (
          file.e && <DrawerEditedChip />
        )}
      </p>
      {pending ? (
        <div className="file-card is-skeleton" aria-hidden="true">
          <span className="icon-disk">
            <Icon name={icon} size={20} color="#9aa3ad" stroke={2} />
          </span>
          <span className="meta">
            <span className="skeleton skeleton-line" style={{ width: "60%", height: 12 }} />
            <span className="skeleton skeleton-line" style={{ width: "40%", height: 10, marginTop: 6 }} />
          </span>
        </div>
      ) : (
        <button type="button" className="file-card" onClick={onSwap}>
          <span className="icon-disk">
            <Icon name={icon} size={20} color="#0063fb" stroke={2} />
          </span>
          <span className="meta">
            <p className="name">{file.v}</p>
            <p className="sub">{t({ en: "Tap to change", no: "Trykk for å bytte" })}</p>
          </span>
          <Icon name="chevron-right" size={18} color="#0063fb" stroke={2.2} />
        </button>
      )}
    </div>
  );
}

// Desktop drawer edited chip — same MVP cleanup; renders nothing.
function DrawerEditedChip() { return null; }

// ─── Vedlegg internal-nav page components ────────────────────────────────
// Rendered inside the agentic section sheet's page stack so we don't have
// to layer a second modal sheet on top of the section sheet. iOS UINavigationController-
// style push/pop, all within one container.
//
// The agentic MVP treats CV and Cover Letter as a single class of thing —
// "attachments." Both use the same VedleggAttachmentPicker below. Each
// offers: pick from profile files (the user may have multiple) or upload
// a new file. New uploads get an optional "Save to profile" toggle. No
// AI-drafted cover letters at MVP; the AI handles personal-details +
// employer-question prep, the user provides the docs.

// AttachmentPicker — used for both CV (`kind="cv"`) and Cover Letter
// (`kind="letter"`). Same shape, same affordances; only the labels and
// the source file list differ.
function VedleggAttachmentPicker({ kind, currentName, onPick, uploaded, setUploaded, saveToProfile, setSaveToProfile }) {
  const t = useT();
  // Mock per-kind profile files. In a real implementation these come from
  // the user's FINN Job Profile via API. Listed newest first.
  const profileFiles = kind === "cv"
    ? [
        { id: "cv-1", name: "Lee_Frost_CV_2025.pdf",      date: { en: "12 Mar 2026", no: "12. mars 2026" }, size: "245 KB" },
        { id: "cv-2", name: "Lee_Frost_CV_2024.pdf",      date: { en: "8 Jan 2025",  no: "8. jan 2025"  }, size: "212 KB" },
        { id: "cv-3", name: "Lee_Frost_CV_engineering.pdf", date: { en: "3 Aug 2024", no: "3. aug 2024"  }, size: "228 KB" },
      ]
    : [
        { id: "cl-1", name: "Cover_letter_2025.doc",      date: { en: "22 Feb 2026", no: "22. feb 2026" }, size: "189 KB" },
        { id: "cl-2", name: "Cover_letter_2024.doc",      date: { en: "8 Dec 2024",  no: "8. des 2024"  }, size: "312 KB" },
      ];

  function simulateUpload() {
    haptic("tap");
    setUploaded({
      name: kind === "cv" ? "Lee_Frost_CV_new.pdf" : "Cover_letter_new.pdf",
      size: kind === "cv" ? "189 KB" : "168 KB",
      date: { en: "just now", no: "akkurat nå" },
    });
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      {/* From profile — list of saved files */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <p style={{
          font: "700 11px/1 var(--sys-text)",
          textTransform: "uppercase", letterSpacing: "0.08em",
          color: "#6b6b6b", margin: 0,
        }}>
          {t({ en: "From your profile", no: "Fra profilen din" })}
        </p>
        {profileFiles.map(f => (
          <CVOption key={f.id}
            icon="file"
            title={f.name}
            sub={`${t(f.date)} · ${f.size}`}
            selected={currentName === f.name}
            showChevron={currentName !== f.name}
            onClick={() => { haptic("tap"); onPick?.(f.name); }}
          />
        ))}
      </div>

      {/* Or upload new — dropzone or, once a file is staged, a confirm card */}

// Confirmation is presented as a bottom sheet over the job ad — the user
// stays anchored to the listing they just applied for, and there's a
// single CTA back to FINN Jobs. Same modal shell language as the apply
// preview sheet so the surfaces feel like one flow.
function ConfirmationScreen({ job, onDone, onReset, magic = false }) {
  const t = useT();
  const [exiting, close] = useDelayedClose(onDone, 320);
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const cardR = PLATFORM_RADII[platform].card;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;
  useEffect(() => { haptic("ok"); }, []);
  return (
    <div
      className={exiting ? "backdrop-exit" : ""}
      style={{
        position: "absolute", inset: 0, zIndex: 70,
        display: "flex", flexDirection: "column",
        background: "rgba(0,0,0,.30)",
        animation: "fadein 300ms var(--ease-modal)",
      }}>
      <div onClick={close} style={{ flex: `0 0 ${backdropH}px`, cursor: "pointer" }} />
      <div
        className={exiting ? "sheet-exit" : ""}
        style={{
          flex: 1, background: "#fff",
          borderTopLeftRadius: sheetRadius, borderTopRightRadius: sheetRadius,
          display: "flex", flexDirection: "column",
          boxShadow: "0 -4px 24px rgba(0,0,0,.10)",
          overflow: "hidden",
          animation: "slideup 440ms var(--ease-modal)",
        }}>
        <div style={{ display: "flex", justifyContent: "center", padding: "10px 0 6px" }}>
          <SheetDragHandle />
        </div>

        <div style={{
          flex: 1, display: "flex", flexDirection: "column",
          alignItems: "center", justifyContent: "center",
          padding: "12px 32px 24px",
          textAlign: "center", gap: 14,
          overflowY: "auto",
        }}>
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            marginBottom: 4, position: "relative",
            animation: "popin 620ms var(--ease-spring)",
          }}>
            <SuccessIllustration size={150} />
          </div>
          <h1 style={{
            fontSize: 24, fontWeight: 700, margin: 0, color: "#1d1d1d", letterSpacing: -0.4,
          }}>{t({ en: "Application sent", no: "Søknad sendt" })}</h1>

          {magic && (
            <div style={{
              display: "inline-flex", alignItems: "center", gap: 6,
              padding: "5px 12px 5px 10px",
              background: "linear-gradient(180deg, #f4f8ff, #eaf2ff)",
              border: "1px solid rgba(0,99,251,0.18)",
              borderRadius: 9999,
              fontSize: 11, color: "#0063fb", fontWeight: 700, letterSpacing: 0.08,
              textTransform: "uppercase",
              animation: "fadein 300ms var(--ease-modal)",
            }}>
              <Icon name="sparkle" size={12} color="#0063fb" stroke={0} fill="#0063fb" />
              {t({ en: "Magic Apply", no: "Smart søknad" })}
            </div>
          )}

          <div style={{
            width: "100%", padding: 14, borderRadius: cardR,
            background: platform === "android" ? "#f3edf7" : "#f7f7f9",
            display: "flex", alignItems: "center", gap: 12, marginTop: 4,
            boxShadow: "none",
          }}>
            <CompanyLogo size={44} radius={Math.min(cardR - 4, 12)} initials={job.initials} color={job.brandColor} logo={job.logo} />
            <div style={{ flex: 1, minWidth: 0, textAlign: "left" }}>
              <p style={{
                fontSize: 15, fontWeight: 600, color: "#1d1d1d", margin: 0, lineHeight: 1.3,
                letterSpacing: -0.1,
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              }}>{t({ en: job.title, no: job.titleNo })}</p>
              <p style={{ fontSize: 13, color: "#6b6b6b", margin: "2px 0 0" }}>
                {job.company} · {t({ en: "sent just now", no: "sendt nå" })}
              </p>
            </div>
          </div>

          <p style={{ fontSize: 14, color: "#6b6b6b", lineHeight: 1.5, margin: "4px 0 0", maxWidth: 320 }}>
            {magic ? t({
              en: <>Application <strong style={{ color: "#1d1d1d" }}>automatically optimised</strong> based on your role and experience — and sent for you. We'll let you know when the employer responds.</>,
              no: <>Søknaden er <strong style={{ color: "#1d1d1d" }}>automatisk tilpasset</strong> rollen og erfaringen din — og sendt for deg. Vi sier ifra når arbeidsgiver svarer.</>,
            }) : t({
              en: <>You'll find this in <strong style={{ color: "#1d1d1d" }}>My applications</strong>. We'll let you know when the employer responds.</>,
              no: <>Du finner søknaden under <strong style={{ color: "#1d1d1d" }}>Mine søknader</strong>. Vi sier ifra når arbeidsgiver svarer.</>,
            })}
          </p>
        </div>

        <div style={{
          padding: "12px 16px",
          paddingBottom: `calc(12px + ${homeArea}px)`,
          background: "#fff", borderTop: "0.5px solid rgba(0,0,0,0.06)",
        }}>
          <PrimaryButton onClick={close}>
            {t({ en: "Back to FINN Jobs", no: "Tilbake til FINN Jobb" })}
          </PrimaryButton>
        </div>
      </div>
    </div>
  );
}

function Dropdown({ label, value, onChange, options, groups, lang }) {
  // Renders either a flat list of options OR a grouped list via <optgroup>
  // when `groups` is supplied. Each group has `{ label, options }`.
  const renderOption = (o) => (
    <option key={o.id} value={o.id}>
      {typeof o.label === "string" ? o.label : (lang === "en" ? o.label.en : o.label.no)}
    </option>
  );
  return (
    <div className="controls-group">
      <div className="controls-label">
        <span>{label}</span>
      </div>
      <div className="dev-select">
        <select value={value} onChange={(e) => onChange(e.target.value)}>
          {groups
            ? groups.map(g => (
                <optgroup key={g.label} label={g.label}>
                  {g.options.map(renderOption)}
                </optgroup>
              ))
            : options.map(renderOption)}
        </select>
      </div>
    </div>
  );
}

function StorymapView({ version, onVersionChange, stories = STORYMAP.stories, onMoveStory, onReset, actorName, ensureActor, onActivity }) {
  const VERSIONS = [
    { id: "all",     label: "All releases" },
    { id: "agentic", label: "MVP (Agentic) only" },
    { id: "mvp",     label: "1.0 only" },
    { id: "v1",      label: "1.2 only" },
    { id: "v2",      label: "2.0 only" },
  ];
  const showRow = (r) => version === "all" || version === r;
  const cols = STORYMAP.backbone.length;
  const [dragOver, setDragOver] = useState(null); // {taskId, release}
  // Open acceptance criteria sheet for a specific story.
  const [acTarget, setAcTarget] = useState(null); // { taskId, story, sid }
  // Map of storyId → bool, "does this card have AC saved?" — lazy-loaded.
  const [acMap, setAcMap] = useState({});
  // Map of storyId → { ready: {...}, done: {...} } for the small per-card pill.
  const [readyMap, setReadyMap] = useState({});
  useEffect(() => {
    if (!cloudStore.enabled) return;
    let cancelled = false;
    (async () => {
      const [acRows, readyRows] = await Promise.all([
        cloudStore.getAcceptanceMap(),
        cloudStore.getReadinessMap(),
      ]);
      if (!cancelled) {
        const flags = {};
        Object.keys(acRows).forEach(k => {
          const r = acRows[k];
          if (r && (r.given || r.when_ || r.then_)) flags[k] = true;
        });
        setAcMap(flags);
        setReadyMap(readyRows || {});
      }
    })();
    return () => { cancelled = true; };
  }, [acTarget]); // refetch when sheet closes (target turns null)

  function onDragStart(taskId, release, idx) {
    return (e) => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("application/json",
        JSON.stringify({ taskId, release, idx }));
      // Some browsers need a text/plain fallback for the drag to register.
      try { e.dataTransfer.setData("text/plain", "story"); } catch (_) {}
    };
  }
  function onDragOver(taskId, release) {
    return (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      setDragOver({ taskId, release });
    };
  }
  function onDragLeaveCell() { setDragOver(null); }
  function onDrop(taskId, release) {
    return (e) => {
      e.preventDefault();
      setDragOver(null);
      let data;
      try { data = JSON.parse(e.dataTransfer.getData("application/json")); }
      catch (_) { return; }
      if (!data || data.taskId !== taskId) return; // only same-column moves
      if (!onMoveStory) return;
      onMoveStory(taskId, data.release, data.idx, release);
    };
  }
  const releases = [
    { id: "agentic", label: "MVP",  now: true  },
    { id: "mvp",     label: "1.0",  now: false },
    { id: "v1",      label: "1.2",  now: false },
    { id: "v2",      label: "2.0",  now: false },
  ].filter(r => showRow(r.id));

  return (
    <section className="surface" aria-label="User-story map">
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>

      <p className="sub" style={{ fontSize: 11, color: "var(--ink-soft)", marginTop: -8 }}>

        Ping Claude in Cowork ("re-sync Jira statuses") to refresh.

      <div className="sm-version-toggle" role="tablist" aria-label="Release filter">
        {VERSIONS.map(v => (
          <button key={v.id} role="tab" aria-selected={version === v.id}
            className={version === v.id ? "active" : ""}

      </div>

      <div className="sm-scroll">

                  <div key={b.id + r.id}
                    className={"sm-cell " + (ri === releases.length - 1 ? "sm-row-last-cell" : "") + (isOver ? " sm-cell-over" : "")}
                    onDragOver={onDragOver(b.id, r.id)}
                    onDragLeave={onDragLeaveCell}
                    onDrop={onDrop(b.id, r.id)}>
                    {cellStories.length === 0 ? (
                      <div className="sm-empty" />
                    ) : cellStories.map((s, si) => {
                      const sid = storyId(b.id, s);
                      return (
                        <SmCard key={si} story={s} release={r.id} now={r.now}
                          draggable
                          onDragStart={onDragStart(b.id, r.id, si)}
                          hasAcceptance={!!acMap[sid]}
                          readiness={readyMap[sid]}
                          onClick={() => setAcTarget({ taskId: b.id, story: s, sid })} />
                      );
                    })}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
      <AcceptanceSheet
        open={!!acTarget}
        story={acTarget && acTarget.story}
        taskId={acTarget && acTarget.taskId}
        sid={acTarget && acTarget.sid}
        actorName={actorName}
        ensureActor={ensureActor || ((cb) => cb && cb("Anonymous"))}
        onActivity={onActivity}
        onClose={() => setAcTarget(null)}
      />
    </section>
  );
}

// ─── Edge cases ("Chaos cards") ─────────────────────────────────────────
// Each card describes an edge case in the agentic apply flow + how we
// expect the agent to handle it. Sourced from the Phase 2 chaos-card
// workshop. Persisted to Supabase under the "edges" key so the team can
// refine collaboratively. Handles ladder by intervention level — lightest
// touch first: auto-resolve → notify (FYI) → ask (needs input) → block →
// punt (out of scope).
const HANDLE_TYPES = [
  { id: "auto",   label: "Auto",        icon: "♻️", color: "#1f8a3b", bg: "#d6f0de", border: "#a8e0bd" },
  { id: "notify", label: "Notify",      icon: "🔔", color: "#7a5b00", bg: "#fff6c2", border: "#ffe88c" },
  { id: "ask",    label: "Ask",         icon: "🤨", color: "#c47a00", bg: "#fff2d4", border: "#ffd98a" },
  { id: "block",  label: "Block",       icon: "✋", color: "#b8403a", bg: "#fadddd", border: "#f5b8b3" },
  { id: "scope",  label: "Out of scope",icon: "❌", color: "#6b6b6b", bg: "#ededed", border: "#cccccf" },
];

function handleType(id) {
  return HANDLE_TYPES.find(h => h.id === id) || HANDLE_TYPES[0];
}

const INITIAL_EDGES = [
  { id: "e1",  title: "Missing critical info", example: "Candidate has no phone number. Right to residency.", handle: "ask" },
  { id: "e2",  title: "Legal dilemma",         example: "Candidate doesn't approve.", handle: "block" },
  { id: "e3",  title: "ATS block",             example: "ATS rejects application.", handle: "notify" },
  { id: "e4",  title: "Ethics",                example: "Candidate doesn't want to share age, gender.", handle: "ask" },
  { id: "e5",  title: "Lacking input data",    example: "Agent lacks input to answer some questions in the form.", handle: "ask" },
  { id: "e6",  title: "Loading time",          example: "Form length is unpredictable / too long / creates uncertainty for the candidate.", handle: "notify" },
  { id: "e7",  title: "Downtime",              example: "ATS API is unavailable.", handle: "block" },
  { id: "e8",  title: "Duplicate profile",     example: "Profile already exists in ATS.", handle: "auto" },
  { id: "e9",  title: "Duplicate applications",example: "Candidate has already applied before, or our agent starts apply to the same ad (e.g. a renewed ad).", handle: "notify" },
  { id: "e10", title: "Incomplete application",example: "Candidate doesn't finish the application.", handle: "notify" },
  { id: "e11", title: "Question type",         example: "The ATS form has a video question.", handle: "scope" },
];

function edgesAreCurrentShape(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return false;
  return arr.every(e =>
    e && typeof e === "object" &&
    typeof e.id === "string" &&
    typeof e.title === "string" &&
    typeof e.example === "string" &&
    typeof e.handle === "string"
  );
}

function EdgeCasesView({ edges, onEditEdges, onResetEdges, actorName }) {
  const [filter, setFilter] = useState("all");
  const [editing, setEditing] = useState(false);
  // Group cards by handle order (Auto → Notify → Ask → Block → Out of scope)
  // so the grid reads from lightest-touch to heaviest intervention.
  const handleOrder = HANDLE_TYPES.reduce((acc, h, i) => { acc[h.id] = i; return acc; }, {});
  const sorted = [...edges].sort((a, b) =>
    (handleOrder[a.handle] ?? 99) - (handleOrder[b.handle] ?? 99)
  );
  const visible = filter === "all" ? sorted : sorted.filter(e => e.handle === filter);
  const counts = HANDLE_TYPES.reduce((acc, h) => {
    acc[h.id] = edges.filter(e => e.handle === h.id).length;
    return acc;
  }, {});

  function patchEdge(id, patch) {
    onEditEdges(prev => prev.map(e => e.id === id ? { ...e, ...patch } : e));
  }
  function addEdge() {
    const id = "e" + Date.now().toString(36);
    onEditEdges(prev => [...prev, { id, title: "New principle", example: "Describe the example…", handle: "ask" }]);
  }
  function removeEdge(id) {
    onEditEdges(prev => prev.filter(e => e.id !== id));
  }
  function cycleHandle(id) {
    const order = HANDLE_TYPES.map(h => h.id);
    onEditEdges(prev => prev.map(e => {
      if (e.id !== id) return e;
      const i = order.indexOf(e.handle);
      return { ...e, handle: order[(i + 1) % order.length] };
    }));
  }

  // Renders bare — the parent Handoff `<section className="surface">` is
  // already the white card surrounding this view, so we don't wrap again.
  return (
    <div aria-label="Operating principles" style={{ paddingTop: 8 }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, flexWrap: "wrap", marginBottom: 16 }}>
        <div>
          <h2 style={{ margin: 0, fontSize: 22, fontWeight: 700, letterSpacing: -0.3 }}>Operating principles</h2>
          <p style={{ margin: "6px 0 0", color: "#6b6b6b", fontSize: 13, lineHeight: 1.55 }}>
            The team-aligned rules for how the agent behaves when the apply
            flow meets the messy real world. Each card names a situation, an
            example, and the agreed handle. Click a card to edit; click the
            handle chip to cycle the decision.
          </p>
        </div>
        <button
          onClick={() => setEditing(v => !v)}
          className="press"
          style={{
            background: editing ? "#0063fb" : "#fff",
            color: editing ? "#fff" : "#0063fb",
            border: "1px solid " + (editing ? "#0063fb" : "rgba(0,99,251,0.45)"),
            borderRadius: 9999, padding: "8px 16px",
            font: "600 13px/1 var(--sys-text)",
            cursor: "pointer", flexShrink: 0,
          }}
        >
          {editing ? "Done editing" : "Edit"}
        </button>
      </div>

      {/* Filter pills */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "0 0 24px" }}>
        <button
          onClick={() => setFilter("all")}
          className="press"
          style={filterChipStyle(filter === "all", "#1d1d1d", "#ededed", "#cccccf")}
        >
          All <span style={{ opacity: 0.6, marginLeft: 4 }}>{edges.length}</span>
        </button>
        {HANDLE_TYPES.map(h => (
          <button
            key={h.id}
            onClick={() => setFilter(h.id)}
            className="press"
            style={filterChipStyle(filter === h.id, h.color, h.bg, h.border)}
          >
            <span style={{ marginRight: 6 }}>{h.icon}</span>
            {h.label}
            <span style={{ opacity: 0.6, marginLeft: 4 }}>{counts[h.id] || 0}</span>
          </button>
        ))}
      </div>

      {/* Card grid */}
      <div className="edges-grid">
        {visible.map(edge => {
          const h = handleType(edge.handle);
          return (
            <div
              key={edge.id}
              className="edge-card"
              style={{
                background: h.bg,
                borderColor: h.border,
              }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 10 }}>
                <button
                  onClick={() => cycleHandle(edge.id)}
                  className="press"
                  title="Click to cycle handle"
                  style={{
                    display: "inline-flex", alignItems: "center", gap: 6,
                    padding: "4px 10px",
                    background: "rgba(255,255,255,0.7)",
                    color: h.color,
                    border: "1px solid " + h.border,
                    borderRadius: 9999,
                    font: "600 11px/1 var(--sys-text)", letterSpacing: "0.04em",
                    textTransform: "uppercase",
                    cursor: "pointer",
                  }}
                >
                  <span>{h.icon}</span>{h.label}
                </button>
                {editing && (
                  <button
                    onClick={() => removeEdge(edge.id)}
                    aria-label="Remove principle"
                    style={{
                      background: "transparent", border: 0, cursor: "pointer",
                      color: "#6b6b6b", padding: 0, fontSize: 16, lineHeight: 1,
                    }}
                  >✕</button>
                )}
              </div>
              <EdgeText
                value={edge.title}
                onChange={(v) => patchEdge(edge.id, { title: v })}
                tag="h3"
                editable={editing}
                placeholder="Title"
                style={{
                  margin: "0 0 8px",
                  font: "700 16px/1.3 var(--sys-text)",
                  color: "#1d1d1d",
                  letterSpacing: "-0.15px",
                }}
              />
              <EdgeText
                value={edge.example}
                onChange={(v) => patchEdge(edge.id, { example: v })}
                tag="p"
                editable={editing}
                placeholder="Example…"
                style={{
                  margin: 0,
                  font: "500 13px/1.5 var(--sys-text)",
                  color: "#404040",
                }}
              />
            </div>
          );
        })}
        {editing && (
          <button
            onClick={addEdge}
            className="press edge-card edge-card-add"
            style={{
              cursor: "pointer", textAlign: "left", color: "#0063fb",
              background: "rgba(0,99,251,0.04)",
              borderColor: "rgba(0,99,251,0.35)",
              borderStyle: "dashed",
              font: "600 14px/1.5 var(--sys-text)",
              display: "flex", alignItems: "center", justifyContent: "center",
              gap: 8,
            }}
          >
            <span style={{ fontSize: 18, lineHeight: 1 }}>+</span> Add principle
          </button>
        )}
      </div>

      {visible.length === 0 && (
        <p style={{ color: "#6b6b6b", textAlign: "center", padding: "32px 0", margin: 0 }}>
          No cards in this filter yet.
        </p>
      )}

      {editing && onResetEdges && (
        <div style={{ marginTop: 24, textAlign: "right" }}>
          <button
            onClick={onResetEdges}
            style={{
              background: "transparent", border: "1px solid #cccccf",
              color: "#6b6b6b", borderRadius: 9999,
              padding: "6px 14px", font: "500 12px/1 var(--sys-text)",
              cursor: "pointer",
            }}
          >
            Reset to defaults
          </button>
        </div>
      )}
    </div>
  );
}

function filterChipStyle(active, color, bg, border) {
  return {
    appearance: "none", cursor: "pointer",
    display: "inline-flex", alignItems: "center",
    padding: "6px 12px",
    borderRadius: 9999,
    background: active ? bg : "#fff",
    color: active ? color : "#6b6b6b",
    border: "1px solid " + (active ? border : "#ededed"),
    font: "600 12px/1 var(--sys-text)",
    letterSpacing: "-0.05px",
    transition: "background 140ms var(--ease-out), border-color 140ms var(--ease-out)",
  };
}

function EdgeText({ value, onChange, tag = "p", editable, placeholder, style }) {
  if (!editable) {
    return React.createElement(tag, { style }, value);
  }
  return (
    <textarea
      defaultValue={value}
      onBlur={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      rows={tag === "h3" ? 1 : 3}
      style={{
        width: "100%", border: "1px dashed rgba(0,0,0,0.18)", borderRadius: 8,
        outline: "0", resize: "vertical", padding: "6px 8px",
        background: "rgba(255,255,255,0.65)",
        fontFamily: "inherit",
        boxSizing: "border-box",
        ...style,
        margin: tag === "h3" ? "0 0 8px" : 0,
      }}
    />
  );
}

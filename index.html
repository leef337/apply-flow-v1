// Inner body for the Tree view. Owns the edit-mode toggle and all the
// editable affordances. No Miro toggle / iframe — the team's authoritative
// tree now lives *here* (cloud-synced via Supabase); Miro stays an
// orthogonal sketching tool the team can use however they like.
function OpportunityTreeBody({ business, outcome, problems, lastEdited, onEditTree, onResetTree, actorName }) {
  const [isEditing, setIsEditing] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);
  const editable = !!onEditTree;

  // Drag state for HTML5 drag-reorder. `dragRef` is the moving node's
  // address (kind + index path); `dropTarget` is the hovered drop slot.
  const dragRef = useRef(null);
  const [dropTarget, setDropTarget] = useState(null);

  function startDrag(kind, path) {
    return (e) => {
      if (!isEditing) return;
      dragRef.current = { kind, path };
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", "ot-" + kind); } catch (_) {}
    };
  }
  function overDrag(kind, path) {
    return (e) => {
      if (!isEditing || !dragRef.current) return;
      if (dragRef.current.kind !== kind) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      setDropTarget({ kind, path });
    };
  }
  function endDrag() {
    dragRef.current = null;
    setDropTarget(null);
  }
  function dropOn(kind, path) {
    return (e) => {
      e.preventDefault();
      const src = dragRef.current;
      endDrag();
      if (!src || src.kind !== kind) return;
      onEditTree(draft => {
        if (kind === "problem") {
          const arr = draft.problems;
          const [moved] = arr.splice(src.path[0], 1);
          arr.splice(path[0], 0, moved);
        } else if (kind === "hypothesis") {
          if (src.path[0] !== path[0]) return draft;
          const arr = draft.problems[path[0]].hypotheses;
          const [moved] = arr.splice(src.path[1], 1);
          arr.splice(path[1], 0, moved);
        } else if (kind === "solution") {
          if (src.path[0] !== path[0] || src.path[1] !== path[1]) return draft;
          const arr = draft.problems[path[0]].hypotheses[path[1]].solutions;
          const [moved] = arr.splice(src.path[2], 1);
          arr.splice(path[2], 0, moved);
        }
        return draft;
      }, { action: "edit-tree", detail: { op: "reorder", kind } });
    };
  }

  return (
    <>
      {/* Tools row — edit toggle, last-edited stamp, history button,
          optional reset (when editing). Lives above the tree so it
          doesn't compete with the outcome card's visual weight. */}
      {editable && (
            <div className="otree-tools">
              <button
                className={"otree-edit-toggle press" + (isEditing ? " on" : "")}
                onClick={() => setIsEditing(v => !v)}>
                <Icon name={isEditing ? "check" : "edit"} size={14} stroke={2.2} color={isEditing ? "#fff" : "currentColor"} />
                {isEditing ? "Done editing" : "Edit tree"}
              </button>
              {isEditing && onResetTree && (
                <button className="otree-reset-btn press" onClick={onResetTree}
                  title="Discard team edits and restore the original tree">
                  Reset to defaults
                </button>
              )}
              <button className="otree-history-btn press" onClick={() => setHistoryOpen(true)}>
                <Icon name="clock" size={14} stroke={2.2} color="currentColor" />
                History
              </button>
              {lastEdited && lastEdited.who && (
                <span className="otree-last-edited">
                  Last edited by <strong>{lastEdited.who}</strong> · {relativeTime(lastEdited.when)}
                </span>
              )}
              <TreePresenceDots actorName={actorName} isEditing={isEditing} />
            </div>
          )}

          <div className={"otree-tree-root" + (isEditing ? " otree-edit-mode" : "")}>
            <div className="otree-outcome">
              <div className="label">Desired outcome</div>
              <div className="text">
                <EditableText
                  value={outcome.text}
                  multiline
                  editing={isEditing}
                  onCommit={(v) => onEditTree && onEditTree(d => { d.outcome.text = v; },
                    { action: "edit-tree", detail: { op: "edit-outcome" } })}
                />
              </div>
              {(outcome.meta || isEditing) && (
                <div className="meta">
                  <EditableText
                    value={outcome.meta || ""}
                    placeholder="OKR context / KR refs (optional)"
                    editing={isEditing}
                    onCommit={(v) => onEditTree && onEditTree(d => { d.outcome.meta = v; },
                      { action: "edit-tree", detail: { op: "edit-outcome-meta" } })}
                  />
                </div>
              )}
            </div>
            {Array.isArray(outcome.measurables) && outcome.measurables.length > 0 && (
              <div className="otree-target-card">
                {outcome.measurables.map((raw, mi) => (
                  <p key={mi} className="otree-target-line">{String(raw)}</p>
                ))}
                {outcome.measurablesMeta && (
                  <p className="otree-target-meta">{outcome.measurablesMeta}</p>
                )}
              </div>
            )}
            <div className="otree-spine" aria-hidden="true" />
            <div className="otree-cols">
              {problems.map((p, pi) => {
                const isDragging = dragRef.current && dragRef.current.kind === "problem" && dragRef.current.path[0] === pi;
                const isProblemDropTarget = dropTarget && dropTarget.kind === "problem" && dropTarget.path[0] === pi;
                return (
                  <div key={p.id}
                    className={"otree-col c" + p.key.slice(1)
                      + (isDragging ? " ot-dragging" : "")
                      + (isProblemDropTarget ? " ot-drop-target" : "")}
                    draggable={isEditing}
                    onDragStart={startDrag("problem", [pi])}
                    onDragOver={overDrag("problem", [pi])}
                    onDrop={dropOn("problem", [pi])}
                    onDragEnd={endDrag}>
                    <div className={"otree-problem " + p.key} style={isEditing ? { position: "relative" } : null}>
                      <span className="badge">
                        <span className="ot-drag-handle" aria-hidden="true">⠿</span>
                        Opportunity #{pi + 1}
                      </span>
                      <EditableText
                        value={p.title}
                        editing={isEditing}
                        className="title"
                        onCommit={(v) => onEditTree(d => { d.problems[pi].title = v; },
                          { action: "edit-tree", detail: { op: "edit-problem-title", title: v } })}
                      />
                      {(p.sub || isEditing) && (
                        <EditableText
                          value={p.sub || ""}
                          editing={isEditing}
                          className="sub"
                          placeholder="(optional user voice)"
                          onCommit={(v) => onEditTree(d => { d.problems[pi].sub = v; },
                            { action: "edit-tree", detail: { op: "edit-problem-sub" } })}
                        />
                      )}
                      <EditableText
                        value={p.pct}
                        editing={isEditing}
                        className="pct"
                        placeholder="e.g. 30% drop out because…"
                        onCommit={(v) => onEditTree(d => { d.problems[pi].pct = v; },
                          { action: "edit-tree", detail: { op: "edit-problem-pct" } })}
                      />
                      {isEditing && (
                        <button className="ot-remove" aria-label="Remove opportunity"
                          style={{ position: "absolute", top: 8, right: 8 }}
                          onClick={() => {
                            if (!window.confirm(`Remove opportunity "${p.title}"?`)) return;
                            onEditTree(d => { d.problems.splice(pi, 1); },
                              { action: "edit-tree", detail: { op: "remove-problem", title: p.title } });
                          }}>
                          <Icon name="x" size={12} stroke={2.4} color="currentColor" />
                        </button>
                      )}
                    </div>
                    {p.hypotheses.map((h, hi) => {
                      const isHypDragging = dragRef.current && dragRef.current.kind === "hypothesis" && dragRef.current.path[0] === pi && dragRef.current.path[1] === hi;
                      const isHypDrop = dropTarget && dropTarget.kind === "hypothesis" && dropTarget.path[0] === pi && dropTarget.path[1] === hi;
                      return (
                        <div key={h.id}
                          className={"otree-hyp" + (h.needs ? " needs" : "")
                            + (isHypDragging ? " ot-dragging" : "")
                            + (isHypDrop ? " ot-drop-target" : "")}
                          draggable={isEditing}
                          onDragStart={startDrag("hypothesis", [pi, hi])}
                          onDragOver={overDrag("hypothesis", [pi, hi])}
                          onDrop={dropOn("hypothesis", [pi, hi])}
                          onDragEnd={endDrag}
                          style={isEditing ? { position: "relative" } : null}>
                          <div className="hyp-head">
                            <span className="ot-drag-handle" aria-hidden="true">⠿</span>
                            <span className="htag">Hypothesis {pi + 1}.{hi + 1}</span>
                            {h.needs && <span className="hneeds" title="Needs validation / open questions">Needs validation</span>}
                            {isEditing && (
                              <button className="ot-remove" aria-label="Remove hypothesis"
                                style={{ marginLeft: "auto" }}
                                onClick={() => {
                                  if (!window.confirm("Remove this hypothesis?")) return;
                                  onEditTree(d => { d.problems[pi].hypotheses.splice(hi, 1); },
                                    { action: "edit-tree", detail: { op: "remove-hypothesis" } });
                                }}>
                                <Icon name="x" size={12} stroke={2.4} color="currentColor" />
                              </button>
                            )}
                          </div>
                          <EditableText
                            value={h.text}
                            editing={isEditing}
                            multiline
                            className="htext"
                            placeholder="If we…, then…"
                            onCommit={(v) => onEditTree(d => { d.problems[pi].hypotheses[hi].text = v; },
                              { action: "edit-tree", detail: { op: "edit-hypothesis" } })}
                          />
                          {(h.note || isEditing) && (
                            <EditableText
                              value={h.note || ""}
                              editing={isEditing}
                              multiline
                              className="hnote"
                              placeholder="Open questions / notes (optional)"
                              onCommit={(v) => onEditTree(d => { d.problems[pi].hypotheses[hi].note = v || undefined; },
                                { action: "edit-tree", detail: { op: "edit-hypothesis-note" } })}
                            />
                          )}
                          {h.solutions.length > 0 ? (
                            <div className="otree-sols">
                              {h.solutions.map((s, si) => {
                                const isSolDragging = dragRef.current && dragRef.current.kind === "solution"
                                  && dragRef.current.path[0] === pi && dragRef.current.path[1] === hi && dragRef.current.path[2] === si;
                                const isSolDrop = dropTarget && dropTarget.kind === "solution"
                                  && dropTarget.path[0] === pi && dropTarget.path[1] === hi && dropTarget.path[2] === si;
                                return (
                                  <div key={s.n != null ? s.n : si}
                                    className={"otree-sol"
                                      + (isSolDragging ? " ot-dragging" : "")
                                      + (isSolDrop ? " ot-drop-target" : "")}
                                    draggable={isEditing}
                                    onDragStart={startDrag("solution", [pi, hi, si])}
                                    onDragOver={overDrag("solution", [pi, hi, si])}
                                    onDrop={dropOn("solution", [pi, hi, si])}
                                    onDragEnd={endDrag}
                                    style={isEditing ? { position: "relative", paddingRight: 30 } : null}>
                                    <span className="ot-drag-handle" aria-hidden="true">⠿</span>
                                    <span className="num">{s.n != null ? s.n : "•"}</span>
                                    <EditableText
                                      value={s.text}
                                      editing={isEditing}
                                      multiline
                                      placeholder="A specific design / build that exercises this hypothesis"
                                      onCommit={(v) => onEditTree(d => { d.problems[pi].hypotheses[hi].solutions[si].text = v; },
                                        { action: "edit-tree", detail: { op: "edit-solution" } })}
                                    />
                                    {(s.owners && s.owners.length > 0) && (
                                      <span style={{ display: "inline-flex", flexWrap: "wrap", gap: 4, marginLeft: 8, verticalAlign: "middle" }}>
                                        {s.owners.map(o => { const oc = RM_OWNER[o] || { bg: "#888", fg: "#fff" }; return <span key={o} style={{ fontSize: 9, fontWeight: 700, color: oc.fg, background: oc.bg, padding: "1px 6px", borderRadius: 9999 }}>{o}</span>; })}
                                      </span>
                                    )}
                                    {isEditing && (
                                      <button className="ot-remove" aria-label="Remove solution"
                                        style={{ position: "absolute", top: 6, right: 6 }}
                                        onClick={() => {
                                          if (!window.confirm("Remove this solution?")) return;
                                          onEditTree(d => { d.problems[pi].hypotheses[hi].solutions.splice(si, 1); },
                                            { action: "edit-tree", detail: { op: "remove-solution" } });
                                        }}>
                                        <Icon name="x" size={12} stroke={2.4} color="currentColor" />
                                      </button>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          ) : (!isEditing && (
                            <div className="otree-empty">No prototype solution yet.</div>
                          ))}
                          {isEditing && (
                            <button className="ot-add-btn" style={{ marginTop: 8 }}
                              onClick={() => onEditTree(d => {
                                d.problems[pi].hypotheses[hi].solutions.push({
                                  n: null, text: "New solution — describe what we'd build to exercise this hypothesis.",
                                });
                              }, { action: "edit-tree", detail: { op: "add-solution" } })}>
                              <Icon name="plus" size={12} stroke={2.4} color="currentColor" />
                              Add solution
                            </button>
                          )}
                        </div>
                      );
                    })}
                    {isEditing && (
                      <button className="ot-add-btn in-col"
                        onClick={() => onEditTree(d => {
                          const next = d.problems[pi].hypotheses;
                          next.push({
                            id: freshId("h"),
                            text: "If we…, then…",
                            solutions: [],
                          });
                        }, { action: "edit-tree", detail: { op: "add-hypothesis" } })}>
                        <Icon name="plus" size={12} stroke={2.4} color="currentColor" />
                        Add hypothesis
                      </button>
                    )}
                  </div>
                );
              })}
              {isEditing && (
                <button className="ot-add-col-btn"
                  onClick={() => onEditTree(d => {
                    // Default new opportunities to the green/tech key (pc) — gentle
                    // visual cue that it's a placeholder ready to be reclassified.
                    d.problems.push({
                      id: freshId("p"),
                      key: "pc",
                      title: "New opportunity",
                      pct: "Add the size / qualitative description of the problem",
                      hypotheses: [],
                    });
                  }, { action: "edit-tree", detail: { op: "add-problem" } })}>
                  <Icon name="plus" size={20} stroke={2.4} color="currentColor" />
                  Add opportunity
                </button>
              )}
            </div>
          </div>
      {historyOpen && (
        <TreeHistorySheet onClose={() => setHistoryOpen(false)} />
      )}
    </>
  );
}

// ─── Editable text — inline-editable when the parent passes editing=true.
// In view mode it renders as a plain span; in edit mode it becomes a
// textarea (multiline) or text input. Commits via onBlur + Enter (single-
// line) or Cmd/Ctrl+Enter (multiline). Empty strings become the placeholder.
function EditableText({ value, onCommit, editing, multiline, placeholder, className }) {
  const [draft, setDraft] = useState(value);
  // Reset the draft whenever the upstream value changes (e.g. cloud sync
  // brought in a remote edit, or another field reset the tree).
  useEffect(() => { setDraft(value); }, [value]);

  if (!editing) {
    return <span className={className}>{value || (placeholder ? <em style={{ opacity: 0.5 }}>{placeholder}</em> : null)}</span>;
  }

  const commit = () => {
    if (draft === value) return;
    onCommit && onCommit(draft.trim());
  };

  const onKey = (e) => {
    if (multiline) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        e.currentTarget.blur();
      }
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      e.currentTarget.blur();
    } else if (e.key === "Escape") {
      setDraft(value);
      e.currentTarget.blur();
    }
  };

  const Tag = multiline ? "textarea" : "input";
  return (
    <Tag
      className={"ot-editable " + (className || "")}
      value={draft}
      placeholder={placeholder || ""}
      rows={multiline ? Math.max(2, Math.min(8, (draft || "").split("\n").length + 1)) : undefined}
      onChange={(e) => setDraft(e.target.value)}
      onBlur={commit}
      onKeyDown={onKey}
    />
  );
}

// ─── Presence dots — show who else has the tree open right now. Real-time
// presence over Supabase Realtime would be richer, but for the prototype's
// purposes we approximate "currently editing" by reading recent tree-edit
// activity-log events (anyone who edited in the last 90s is "active").
function TreePresenceDots({ actorName, isEditing }) {
  const [active, setActive] = useState([]);
  useEffect(() => {
    if (!cloudStore.enabled) return;
    let cancelled = false;
    async function pull() {
      try {
        const cutoff = Date.now() - 90 * 1000;
        const events = await cloudStore.getEvents(30);
        if (cancelled) return;
        // Unique actors who touched the tree in the last 90s, excluding
        // the current user (their own dot would be redundant).
        const set = new Map();
        (events || []).forEach(ev => {
          if (!ev || typeof ev.action !== "string") return;
          if (!ev.action.includes("tree")) return;
          if (!ev.actor) return;
          const t = ev.created_at ? new Date(ev.created_at).getTime() : 0;
          if (t < cutoff) return;
          set.set(ev.actor, ev.actor);
        });
        if (actorName) set.delete(actorName);
        setActive(Array.from(set.keys()));
      } catch (_) {}
    }
    pull();
    const t = setInterval(pull, 15000);
    return () => { cancelled = true; clearInterval(t); };
  }, [actorName, isEditing]);
  if (active.length === 0) return null;
  return (
    <span className="otree-presence" title={active.join(", ") + " also editing recently"}>
      {active.slice(0, 4).map((name, i) => {
        // Stable colour per name from a hash so the same person reads the
        // same dot colour across sessions.
        const hue = (name.split("").reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7) % 360 + 360) % 360;
        return (
          <span key={name} className="otree-presence-dot"
            style={{ background: `hsl(${hue} 65% 45%)`, zIndex: 10 - i }}>
            {name.slice(0, 1).toUpperCase()}
          </span>
        );
      })}
      {active.length > 4 && (
        <span className="otree-presence-dot" style={{ background: "#9a9a9a" }}>+{active.length - 4}</span>
      )}
    </span>
  );
}

// ─── Tree history sheet — shows tree-edit activity from the cloud feed.
function TreeHistorySheet({ onClose }) {
  const [events, setEvents] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (!cloudStore.enabled) { setEvents([]); return; }
        const rows = await cloudStore.getEvents(80);
        if (cancelled) return;
        const treeRows = (rows || []).filter(e => e && typeof e.action === "string" && e.action.includes("tree"));
        setEvents(treeRows);
      } catch (_) { setEvents([]); }
    })();
    return () => { cancelled = true; };
  }, []);
  return (
    <div className="ot-history-backdrop" onClick={onClose}>
      <div className="ot-history-sheet" onClick={(e) => e.stopPropagation()}>
        <header>
          <div>
            <h3>Tree edit history</h3>
            <p className="sub">Every change anyone makes to the opportunity tree — newest first.</p>
          </div>
          <button className="otree-reset-btn" onClick={onClose}>Close</button>
        </header>
        <div className="ot-history-list">
          {events === null && <div className="ot-history-empty">Loading…</div>}
          {events && events.length === 0 && (
            <div className="ot-history-empty">No tree edits yet. Be the first.</div>
          )}
          {events && events.map((ev, i) => {
            const hue = (ev.actor || "?").split("").reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
            const realHue = (hue % 360 + 360) % 360;
            return (
              <div key={i} className="ot-history-row">
                <span className="who" style={{ background: `hsl(${realHue} 65% 45%)` }}>
                  {(ev.actor || "?").slice(0, 1).toUpperCase()}
                </span>
                <span className="what">
                  <strong>{ev.actor || "Someone"}</strong>
                  {" "}<em>{treeEventLabel(ev)}</em>
                </span>
                <span className="when">{relativeTime(ev.created_at || ev.createdAt || ev.when)}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function treeEventLabel(ev) {
  const op = ev.detail && ev.detail.op;
  switch (op) {
    case "edit-outcome":          return "edited the desired outcome";
    case "edit-outcome-meta":     return "edited the outcome's OKR context";
    case "edit-problem-title":    return "renamed an opportunity";
    case "edit-problem-pct":      return "updated an opportunity's evidence line";
    case "edit-hypothesis":       return "edited a hypothesis";
    case "edit-hypothesis-note":  return "noted open questions on a hypothesis";
    case "edit-solution":         return "edited a solution";
    case "add-problem":           return "added a new opportunity";
    case "add-hypothesis":        return "added a hypothesis";
    case "add-solution":          return "added a solution";
    case "remove-problem":        return `removed opportunity "${(ev.detail && ev.detail.title) || ""}"`;
    case "remove-hypothesis":     return "removed a hypothesis";
    case "remove-solution":       return "removed a solution";
    case "reorder":               return `reordered ${(ev.detail && ev.detail.kind) || "items"}`;
    default:
      if (ev.action === "reset-tree") return "reset the tree to defaults";
      return "edited the tree";
  }
}

function ImpactEffortView({ solutions = SOLUTIONS, onMoveSolution, onReset, embedded }) {
  const [hoverN, setHoverN] = useState(null);
  const [draggingN, setDraggingN] = useState(null);
  const stageRef = useRef(null);
  // Map score 0..10 → percentage inside the plot area.
  // X (effort) low on left, high on right. Y (impact) low at bottom, high at top.
  const xPct = v => (v / 10) * 100;
  const yPct = v => (1 - v / 10) * 100;
  const selected = solutions.find(s => s.n === hoverN) || null;

  function handlePointerDown(n) {
    return function (e) {
      e.preventDefault();
      setDraggingN(n);
      setHoverN(n);
      const stage = stageRef.current;
      function onMove(ev) {
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        const x = (ev.clientX - rect.left) / rect.width;
        const y = (ev.clientY - rect.top) / rect.height;
        const effort = Math.max(0, Math.min(10, +(x * 10).toFixed(1)));
        const impact = Math.max(0, Math.min(10, +((1 - y) * 10).toFixed(1)));
        onMoveSolution && onMoveSolution(n, impact, effort);
      }
      function onUp() {
        setDraggingN(null);
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        haptic("tap");
      }
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    };
  }

  // When `embedded` (rendered inside the Opportunity-tree page surface),
  // skip our own section wrapper + H1 + Reset — the parent owns those so
  // the header chrome stays in one place across sub-tabs.
  const Wrap = embedded ? React.Fragment : "section";
  const wrapProps = embedded ? {} : { className: "surface", "aria-label": "Impact and effort matrix" };
  return (
    <Wrap {...wrapProps}>
      {!embedded && (
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <h1 style={{ margin: 0 }}>Impact–Effort matrix</h1>
        {onReset && (
          <button onClick={onReset}
            style={{
              appearance: "none", border: "1px solid var(--hair)",
              background: "#fff", borderRadius: 999,
              padding: "6px 12px", fontSize: 12, fontWeight: 600,
              color: "var(--ink-mute)", cursor: "pointer",
              fontFamily: "inherit",
            }}>Reset positions</button>
        )}
      </div>
      )}
      {!embedded && (
      <p className="sub">
        Every initiative from the opportunity tree, plotted by estimated lift on apply-step conversion (impact)
        against shipping cost (effort). Colour = source opportunity (Latency · Trust/Control · Tech bugs);
        quadrant = the priority call. App-vs-backend splits (7.1 / 7.2 / 6.1) appear in both their quadrants.
      </p>
      )}

      <div className="matrix-wrap">
        <div className="matrix-stage" role="img" aria-label="Impact and effort scatter plot">
          <div className="matrix-grid" ref={stageRef}>
            <div className="matrix-axisline matrix-axis-y" />
            <div className="matrix-axisline matrix-axis-x" />

            <div className="matrix-quad" style={{ top: "8%",  left: "8%"  }}>
              <span className="q-title">Quick wins</span>
              high impact · low effort
            </div>
            <div className="matrix-quad" style={{ top: "8%",  right: "8%", textAlign: "right" }}>
              <span className="q-title">Big bets</span>
              high impact · high effort
            </div>
            <div className="matrix-quad" style={{ bottom: "8%", left: "8%" }}>
              <span className="q-title">Fill-ins</span>
              low impact · low effort
            </div>
            <div className="matrix-quad" style={{ bottom: "8%", right: "8%", textAlign: "right" }}>
              <span className="q-title">Thankless tasks</span>
              low impact · high effort
            </div>

            {solutions.map(s => (
              <button
                key={s.n}
                className={"matrix-dot " + s.key + ((hoverN === s.n || draggingN === s.n) ? " active" : "")}
                style={{
                  left: xPct(s.effort) + "%",
                  top: yPct(s.impact) + "%",
                  cursor: draggingN === s.n ? "grabbing" : "grab",
                  transition: draggingN === s.n ? "none" : undefined,
                }}
                onPointerDown={handlePointerDown(s.n)}
                onMouseEnter={() => setHoverN(s.n)}
                onMouseLeave={() => { if (draggingN === null) setHoverN(null); }}
                onFocus={() => setHoverN(s.n)}
                aria-label={"Solution " + (s.id || s.n) + ": " + s.title + ". Impact " + s.impact + ", effort " + s.effort + "."}>
                {s.id || s.n}
              </button>
            ))}
          </div>

          <div className="matrix-axis-label y">Impact →</div>
          <div className="matrix-axis-label x">Effort →</div>
          <div className="matrix-tick y-low">low</div>
          <div className="matrix-tick y-high">high</div>
          <div className="matrix-tick x-low">low</div>
          <div className="matrix-tick x-high">high</div>
        </div>

        <aside className="matrix-side">
          <div className="matrix-legend">
            <h4>Source problem</h4>
            <div className="row"><span className="swatch" style={{ background: "#0063fb" }} /><span>A · Latency (32% · median 83s)</span></div>
            <div className="row"><span className="swatch" style={{ background: "#6f3bd0" }} /><span>B · Trust / control (41%)</span></div>
            <div className="row"><span className="swatch" style={{ background: "#1f8a3b" }} /><span>C · Tech bugs</span></div>
          </div>

          <div className="matrix-detail">
            {selected ? (
              <>
                <div className={"pill " + selected.key}>Problem {selected.problem}</div>
                <div className="title">{selected.id || selected.n} · {selected.title}</div>
                <div className="scores">
                  <span>Impact <b>{selected.impact}/10</b></span>
                  <span>Effort <b>{selected.effort}/10</b></span>
                </div>
                <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <JiraChip jira={selected.jira} />
                  {selected.release && (
                    <span
                      title={RELEASE_META[selected.release].hint}
                      style={{
                        display: "inline-flex", alignItems: "center",
                        padding: "3px 8px", borderRadius: 9999,
                        fontSize: 11, fontWeight: 600, letterSpacing: -0.05,
                        background: RELEASE_META[selected.release].bg,
                        color:      RELEASE_META[selected.release].fg,
                      }}>
                      {RELEASE_META[selected.release].label}
                    </span>
                  )}
                </div>
              </>
            ) : (
              <div className="empty">Hover or tap a dot to see the solution it represents.</div>
            )}
          </div>

          {/* Release-tier legend — explains the chips that appear next to each
              solution in the table below. Tiered against the T2 OKR window:
              1.0-must = ships for 30.06.26; 1.2-can-wait = polish; post-2.0
              = doesn't fit this cycle. */}
          <div className="matrix-legend" style={{ marginTop: 12 }}>
            <h4>Release tier</h4>
            {Object.entries(RELEASE_META).map(([id, m]) => (
              <div className="row" key={id} title={m.hint}>
                <span className="swatch" style={{ background: m.bg, borderRadius: 9999 }} />
                <span><strong>{m.label}</strong> — {m.hint}</span>
              </div>
            ))}
          </div>
        </aside>
      </div>

      <table className="matrix-table" aria-label="Solutions list">
        <thead>
          <tr>
            <th></th>
            <th>Solution</th>
            <th>Source</th>
            <th>Release</th>
            <th>Jira</th>
            <th className="num">Impact</th>
            <th className="num">Effort</th>
          </tr>
        </thead>
        <tbody>
          {/* Sort by release tier first (1.0-must on top), then by net value
              (impact − effort). Makes the must-ships easy to scan + the team
              can see which 1.0-must items still have weak scores. */}
          {(() => {
            const tierOrder = { "1.0-must": 0, "1.2-can-wait": 1, "post-2.0": 2 };
            return [...solutions].sort((a, b) => {
              const ta = tierOrder[a.release] ?? 9;
              const tb = tierOrder[b.release] ?? 9;
              if (ta !== tb) return ta - tb;
              return (b.impact - b.effort) - (a.impact - a.effort);
            });
          })().map(s => (
            <tr key={s.n}
                onMouseEnter={() => setHoverN(s.n)}
                onMouseLeave={() => setHoverN(null)}>
              <td><span className={"ref " + s.key}>{s.id || s.n}</span></td>
              <td>{s.title}</td>
              <td>{s.problem}</td>
              <td>
                {s.release && RELEASE_META[s.release] && (
                  <span
                    title={RELEASE_META[s.release].hint}
                    style={{
                      display: "inline-flex", alignItems: "center",
                      padding: "2px 8px", borderRadius: 9999,
                      fontSize: 11, fontWeight: 600, letterSpacing: -0.05,
                      background: RELEASE_META[s.release].bg,
                      color:      RELEASE_META[s.release].fg,
                      whiteSpace: "nowrap",
                    }}>
                    {RELEASE_META[s.release].label}
                  </span>
                )}
              </td>
              <td><JiraChip jira={s.jira} /></td>
              <td className="num">{s.impact}</td>
              <td className="num">{s.effort}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </Wrap>
  );
}

// ─── Confetti burst — small particle celebration ───────────────────────────
// Used on the Confirmation screen (Peak-End amplifier) and by the Konami egg.
function ConfettiBurst({ count = 32, spread = 180, gravity = 220, palette }) {
  const colors = palette || ["#0063fb", "#62E3FF", "#1f8a3b", "#ffce2e", "#6f3bd0", "#ff6fb3"];
  const particles = React.useMemo(() => {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI + Math.random() * Math.PI; // upward fan
      const speed = 0.5 + Math.random() * 0.7;
      const dx = Math.cos(angle) * spread * speed + (Math.random() - 0.5) * 30;
      const dy = Math.sin(angle) * spread * speed + gravity * (0.4 + Math.random() * 0.8);
      arr.push({
        dx, dy,
        rot: (Math.random() - 0.5) * 720,
        color: colors[i % colors.length],
        w: 5 + Math.random() * 5,
        h: (Math.random() < 0.4 ? 0.4 : 1) * (5 + Math.random() * 5),
        round: Math.random() < 0.18,
        delay: Math.random() * 90,
        dur: 1100 + Math.random() * 1300,
      });
    }
    return arr;
  }, [count, spread, gravity, colors.join(",")]);
  return (
    <div className="confetti" aria-hidden="true">
      {particles.map((p, i) => (
        <span key={i} className="cf" style={{
          background: p.color,
          width: p.w, height: p.h,
          borderRadius: p.round ? 9999 : 1.5,
          "--dx": p.dx + "px",
          "--dy": p.dy + "px",
          "--rot": p.rot + "deg",
          animationDelay: p.delay + "ms",
          animationDuration: p.dur + "ms",
        }} />
      ))}
    </div>
  );
}

// ─── Google sign-in gate ───────────────────────────────────────────────────
// Replaces the client-side password gate with Supabase Auth + Google OAuth.
// Domain allowlist enforced both here (defence-in-depth UX) and in Supabase
// RLS policies (the real boundary). See SECURITY.md for setup + SQL.
const ALLOWED_DOMAINS = ["finn.no", "m10s.io", "vend.com"];

// Plain helper — used both by the gate and by RLS-failure recovery paths.
function emailDomain(email) {
  if (!email || typeof email !== "string") return "";
  const at = email.lastIndexOf("@");
  return at < 0 ? "" : email.slice(at + 1).toLowerCase();
}
function isAllowedDomain(email) {
  return ALLOWED_DOMAINS.includes(emailDomain(email));
}

// useAuth — single source of truth for "who is signed in?" Returns
// { status, user, signInWithGoogle, signOut }.
//   status: "loading" → waiting for Supabase to rehydrate session on mount
//           "signed-out" → no session, show the gate
//           "wrong-domain" → signed in but the email isn't in ALLOWED_DOMAINS
//           "signed-in" → fully authenticated team member
function useAuth() {
  const [status, setStatus] = useState(cloudStore.enabled ? "loading" : "signed-out");
  const [user, setUser]     = useState(null);
  const supabase = cloudStore.client || null;

  // On mount: rehydrate any persisted session and subscribe to changes.
  useEffect(() => {
    if (!supabase) { setStatus("signed-out"); return; }
    let unsub = null;
    let cancelled = false;
    (async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (cancelled) return;
        applySession(session);
      } catch (_) { setStatus("signed-out"); }
      // Subscribe to live auth changes (sign-in, sign-out, token refresh).
      const sub = supabase.auth.onAuthStateChange((_event, session) => {
        applySession(session);
      });
      unsub = () => { try { sub.data.subscription.unsubscribe(); } catch (_) {} };
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function applySession(session) {
    if (!session || !session.user) {
      setUser(null);
      setStatus("signed-out");
      return;
    }
    const u = session.user;
    if (!isAllowedDomain(u.email)) {
      setUser(u);
      setStatus("wrong-domain");
      return;
    }
    setUser(u);
    setStatus("signed-in");
  }

  async function signInWithGoogle() {
    if (!supabase) return;
    try {
      await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          // hd is a soft hint to Google's chooser — picks the first allowed
          // domain so most users skip the account picker. The real domain
          // check happens after the redirect, on every email.
          queryParams: { hd: ALLOWED_DOMAINS[0], prompt: "select_account" },
          redirectTo: window.location.origin + window.location.pathname,
        },
      });
    } catch (e) {
      console.warn("[auth] signInWithOAuth failed:", e);
    }
  }
  async function signOut() {
    if (!supabase) {
      setUser(null);
      setStatus("signed-out");
      return;
    }
    try { await supabase.auth.signOut(); } catch (_) {}
    setUser(null);
    setStatus("signed-out");
  }
  return { status, user, signInWithGoogle, signOut };
}

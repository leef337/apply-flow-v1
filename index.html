            }}>
              <AILogo size={28} />
            </div>
            <div style={{ minWidth: 0 }}>
              <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#0a3a8a", letterSpacing: -0.1 }}>
                {t({ en: "FINN is applying for you", no: "FINN søker for deg" })}
              </p>
              <p style={{ margin: "2px 0 0", fontSize: 11, color: "#0063fb" }}>
                {t({ en: "Optimising each section to match the role…",
                    no: "Tilpasser hver del til rollen …" })}
              </p>
            </div>
          </div>
        )}

        {/* Body — swaps between Application rows and the Job ad based on sheetTab. */}
        <div className="scroll-area" style={{ flex: 1, overflowY: "auto" }}>
          {sheetTab === "application" ? (
            <div key="app-body" style={{ animation: "fadeup 320ms var(--ease-modal)" }}>
              {magicRows.map((r, i) => (
                <PreviewRow
                  key={r.id} row={r} isLast={i === magicRows.length - 1}
                  onEdit={() => {
                    // Letter "Edit" routes to the AI Writing Assistant (see + edit).
                    // CV row routes to the picker — single CV decision point.
                    if (r.id === "letter") onOpenLetter?.();
                    else onOpenEdit(r.id);
                  }}
                  onPreview={null}
                  // MVP — strip the inline Edit button; entire row is the tap target.
                  hideEdit={isMvp}
                  // No eye anywhere. Endre is the single entry for every row;
                  // letter row opens the cover letter sheet, CV row opens the
                  // picker, others open their respective editors.
                />
              ))}

              <p style={{
                fontSize: 12, color: "#6b6b6b", lineHeight: 1.5,
                margin: "20px 24px 8px", textAlign: "center", letterSpacing: -0.05,
              }}>
                {t({
                  en: <>Edit anything before you send.<br/>We'll keep a draft in your profile.</>,
                  no: <>Du kan endre alt før du sender.<br/>Vi lagrer kladden i profilen din.</>,
                })}
              </p>
            </div>
          ) : (
            <div key="ad-body" style={{ animation: "fadeup 340ms var(--ease-modal)" }}>
              <JobAdContent job={job} embedded />
              <div style={{ height: 12 }} />
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{
          padding: "12px 16px",
          paddingBottom: `calc(12px + ${homeArea}px)`,
          background: "#fff", borderTop: "0.5px solid rgba(0,0,0,0.06)",
          display: "flex", flexDirection: "column", gap: 8,
        }}>
          {magicMode ? (
            // Send button replaced with an auto-sending indicator. Disabled — the
            // flow is hands-off; user just watches it land.
            <div style={{
              minHeight: 52,
              display: "flex", alignItems: "center", justifyContent: "center",
              gap: 10, padding: "0 16px",
              background: "#0063fb", color: "#fff",
              borderRadius: 14,
              fontWeight: 600, fontSize: 15, letterSpacing: -0.1,
              opacity: 0.92,
            }}>
              <span style={{
                width: 16, height: 16, borderRadius: 9999,
                border: "2px solid rgba(255,255,255,0.4)",
                borderTopColor: "#fff",
                animation: "spin 1.6s cubic-bezier(0.5, 0, 0.5, 1) infinite",
                display: "inline-block",
              }} />
              {t({ en: "Sending automatically…", no: "Sender automatisk …" })}
            </div>
          ) : anyMissing ? (
            <PrimaryButton onClick={onFillMissing}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                <Icon name="alert" size={18} color="#fff" stroke={2.2} />
                {t({ en: "Fix what's missing", no: "Fyll inn det som mangler" })}
              </span>
            </PrimaryButton>
          ) : (
            <PrimaryButton
              onClick={() => { haptic("ok"); onSend(); }}
              disabled={!allReady}>
              {/* Stacked content — Drafting and Send states share the SAME
                  grid cell so the button sizes to the wider of the two and
                  stays put. Pure opacity crossfade, no width changes. */}
              <span style={{
                display: "inline-grid",
                gridTemplateColumns: "1fr",
                gridTemplateRows: "1fr",
                alignItems: "center", justifyItems: "center",
                minHeight: 22,
              }}>
                <span style={{
                  gridColumn: 1, gridRow: 1,
                  display: "inline-flex", alignItems: "center", gap: 8,
                  whiteSpace: "nowrap",
                  opacity: allReady ? 0 : 1,
                  transition: "opacity 320ms cubic-bezier(0.4, 0, 0.2, 1)",
                  pointerEvents: allReady ? "none" : "auto",
                }}>
                  <span style={{
                    width: 16, height: 16, borderRadius: 9999,
                    border: "2px solid rgba(255,255,255,0.4)",
                    borderTopColor: "#fff",
                    animation: "spin 1.6s cubic-bezier(0.5, 0, 0.5, 1) infinite",
                    display: "inline-block",
                  }} />
                  {t({ en: "Drafting — keep scrolling", no: "Skriver utkast – bla videre" })}
                </span>
                <span style={{
                  gridColumn: 1, gridRow: 1,
                  display: "inline-flex", alignItems: "center", gap: 8,
                  whiteSpace: "nowrap",
                  opacity: allReady ? 1 : 0,
                  transition: "opacity 360ms cubic-bezier(0.4, 0, 0.2, 1) 80ms",
                  pointerEvents: allReady ? "auto" : "none",
                }}>
                  <Icon name="send" size={18} color="#fff" stroke={2.2} />
                  {t({ en: "Send application", no: "Send søknad" })}
                </span>
              </span>
            </PrimaryButton>
          )}
        </div>
      </div>
    </div>
  );
}

// ===========================================================
// SLOW-LOAD APPLY SHEET — the "co-draft" pattern
// -----------------------------------------------------------
// Demonstrates the dev "Slow load" user state. The AI fetch +
// draft is deliberately slow (a real ~2-minute job), so instead
// of trapping the seeker behind a spinner we render the whole
// form instantly and let them fill it in while the agent works.
//
// Personal details carry the centrepiece interaction: the seeker
// can type their own answer right away. When the AI's result
// arrives, it NEVER overwrites what they wrote — it docks UNDER
// their answer as a suggestion they can accept ("Bruk forslaget")
// or dismiss ("Behold mitt"). If the field is still empty, the AI
// result simply fills it as an editable draft.
//
// UX grounding:
//  • Nielsen #1 visibility of system status — a live, honest AI
//    status strip ("this can take up to 2 minutes").
//  • Nielsen #3 user control & freedom — input is never clobbered;
//    the user can send at any point without waiting.
//  • Vend insight (HUB): latency = 31% of drop-outs and "fill it
//    myself" control = 38%. Filling-while-waiting serves both.
//  • iOS HIG — modal sheet, activity indicators, haptics on
//    state changes, 44pt targets.
// ===========================================================

// Real, deliberately-long background timings (ms). The whole point
// of this state is to validate the WAIT, so these are NOT
// compressed — full data lands at ~2 min. Tune here if needed.
const SLOW_LOAD_MS = {
  syncContact:  12000,  // name + email arrive from the profile
  cv:           35000,  // CV finishes syncing
  phone:        55000,  // phone parsed from CV → suggestion / autofill
  questions:    80000,  // employer-question answers drafted
  letter:      115000,  // cover-letter draft lands (the slowest task)
};

// SlowLoadApplySheet is rebuilt to reuse the SAME building blocks as
// ApplicationPreviewSheet so it reads as the same product, not a new
// screen: identical sheet chrome + header, the shared FINN-AI banner
// (same style as Magic Apply), the shared PreviewRow + RiveSpinner
// status rows, the shared InputField cards for editing, and the same
// footnote + footer button. The only net-new element is the co-draft
// suggestion that docks under the user's phone answer — and it borrows
// the established AI vocabulary (#f7f7f9 answer card, FINN AI mark,
// blue text-actions like "Endre").
//
// UX grounding: Nielsen #1 visibility of status (live banner + per-row
// status), #3 user control (input is never overwritten; send anytime),
// and the HUB latency(31%)+control(38%) tracks — fill while the agent
// works instead of staring at a spinner. iOS HIG: modal sheet, activity
// indicators, haptics, 44pt targets.
function SlowLoadApplySheet({ job, onSend, onClose }) {
  const t = useT();
  const [exiting, close] = useDelayedClose(onClose, 320);
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;

  // ── Background AI / sync stages ──────────────────────────
  const [contactReady, setContactReady]     = useState(false);
  const [cvReady, setCvReady]               = useState(false);
  const [questionsReady, setQuestionsReady] = useState(false);
  const [letterReady, setLetterReady]       = useState(false);
  const allReady = contactReady && cvReady && questionsReady && letterReady;

  // ── User-editable personal details ───────────────────────
  const [name, setName]   = useState("");
  const [email, setEmail] = useState("");
  const [phone, setPhone] = useState("");
  const [nameSrc, setNameSrc]   = useState("pending"); // pending | synced | user | edited
  const [emailSrc, setEmailSrc] = useState("pending");
  const [phoneSrc, setPhoneSrc] = useState("empty");   // empty | user | ai | edited
  const [phoneSug, setPhoneSug] = useState(null);      // docked AI suggestion
  const phoneTouchedRef = useRef(false);
  const nameTouchedRef  = useRef(false);
  const emailTouchedRef = useRef(false);

  const timersRef = useRef([]);
  useEffect(() => {
    const push = (fn, ms) => timersRef.current.push(setTimeout(fn, ms));
    // Contact details quietly sync in from the saved profile.
    push(() => {
      setContactReady(true);
      if (!nameTouchedRef.current)  { setName("Jonas Berg");            setNameSrc("synced"); }
      if (!emailTouchedRef.current) { setEmail("jonas.berg@gmail.com"); setEmailSrc("synced"); }
    }, SLOW_LOAD_MS.syncContact);
    push(() => setCvReady(true), SLOW_LOAD_MS.cv);
    // Phone parsed from the CV — the co-draft moment.
    push(() => {
      const parsed = "+47 412 90 312";
      if (phoneTouchedRef.current) { setPhoneSug(parsed); haptic("tap"); } // user typed → dock, don't overwrite
      else { setPhone(parsed); setPhoneSrc("ai"); }                        // empty → fill as editable draft
    }, SLOW_LOAD_MS.phone);
    push(() => setQuestionsReady(true), SLOW_LOAD_MS.questions);
    push(() => { setLetterReady(true); haptic("ok"); }, SLOW_LOAD_MS.letter);
    return () => { timersRef.current.forEach(clearTimeout); timersRef.current = []; };
  }, []);

  function editName(v)  { nameTouchedRef.current = true;  setName(v);  setNameSrc(s => s === "synced" ? "edited" : "user"); }
  function editEmail(v) { emailTouchedRef.current = true; setEmail(v); setEmailSrc(s => s === "synced" ? "edited" : "user"); }
  function editPhone(v) { phoneTouchedRef.current = true; setPhone(v); setPhoneSrc(s => s === "ai" ? "edited" : "user"); }
  function acceptPhoneSug() { haptic("tap"); setPhone(phoneSug); setPhoneSrc("ai"); setPhoneSug(null); }
  function dismissPhoneSug() { haptic("tap"); setPhoneSug(null); }

  const srcNote = (src) =>
    src === "synced" ? t({ en: "Synced from your profile", no: "Hentet fra profilen din" })
    : src === "ai"   ? t({ en: "Found in your CV", no: "Funnet i CV-en din" })
    : src === "edited" ? t({ en: "Edited by you", no: "Endret av deg" })
    : null;

  // Background-task rows reuse the shared PreviewRow vocabulary.
  const prepRows = [
    {
      id: "cv", title: "CV", source: null, preview: false,
      status: cvReady ? "done" : "loading",
      sub: cvReady ? t({ en: "Synced from your profile", no: "Hentet fra profilen din" })
                   : t({ en: "Fetching your CV…", no: "Henter CV-en din …" }),
    },
    {
      id: "questions", title: t({ en: "Employer questions", no: "Spørsmål fra arbeidsgiver" }),
      source: null, preview: false,
      status: questionsReady ? "done" : "loading",
      sub: questionsReady ? t({ en: "3 suggestions ready — review", no: "3 forslag klare – se over" })
                          : t({ en: "Drafting answers…", no: "Skriver forslag til svar …" }),
    },
    {
      id: "letter", title: t({ en: "Cover letter", no: "Søknadsbrev" }),
      titleSuffix: letterReady ? <AILogo size={16} /> : null,
      source: null, preview: false,
      status: letterReady ? "ai" : "loading",
      sub: letterReady ? t({ en: "AI draft · editable", no: "AI-utkast · kan endres" })
                       : t({ en: "Writing for this role…", no: "Skriver for denne jobben …" }),
    },
  ];

  // Send is allowed once the essentials the user controls are present —
  // never blocked by the AI still drafting the letter.
  const canSend = name.trim() && email.trim() && phone.trim() && cvReady;

  const blueAction = {
    background: "transparent", border: 0, padding: "8px 2px",
    color: "#0063fb", fontFamily: "inherit", fontSize: 15, fontWeight: 600,
    letterSpacing: -0.1, cursor: "pointer", minHeight: 44,
  };
  const greyAction = { ...blueAction, color: "#6b6b6b", fontWeight: 500 };

  return (
    <div
      className={exiting ? "backdrop-exit" : ""}
      style={{
        position: "absolute", inset: 0, zIndex: 50,
        display: "flex", flexDirection: "column",
        background: "rgba(0,0,0,.30)",
        animation: "fadein 300ms var(--ease-modal)",
      }}>
      <div onClick={close} style={{ flex: `0 0 ${backdropH}px`, cursor: "pointer" }} />
      <div
        className={exiting ? "sheet-exit" : ""}
        style={{
          flex: 1, background: "#fff",
          borderTopLeftRadius: sheetRadius, borderTopRightRadius: sheetRadius,
          display: "flex", flexDirection: "column",
          boxShadow: "0 -4px 24px rgba(0,0,0,.10)",
          position: "relative", overflow: "hidden",
          animation: "slideup 440ms var(--ease-modal)",
        }}>
        {/* Header — identical to ApplicationPreviewSheet */}
        <div style={{ padding: "14px 16px 6px" }}>
          <button
            className="press"
            onClick={() => { haptic("tap"); close(); }}
            aria-label={t({ en: "Close", no: "Lukk" })}
            style={{
              width: 40, height: 40, borderRadius: 9999,
              background: "#f0f0f3", border: 0, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name="x" size={18} color="#1d1d1d" stroke={2.4} />
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "8px 16px 14px" }}>
          <CompanyLogo size={56} initials={job.initials} color={job.brandColor} logo={job.logo} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{
              fontSize: 13, fontWeight: 500, color: "#6b6b6b",
              margin: "0 0 2px", lineHeight: 1.2,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>{job.company}</p>
            <p style={{
              fontSize: 20, fontWeight: 700, color: "#1d1d1d",
              margin: 0, lineHeight: 1.2, letterSpacing: -0.3,
            }}>{t({ en: job.title, no: job.titleNo })}</p>
          </div>
        </div>

        {/* FINN-AI working banner — same style as the Magic Apply banner. */}
        {!allReady && (
          <div style={{
            margin: "0 16px 10px", padding: "10px 14px",
            background: "linear-gradient(180deg, #f4f8ff 0%, #eaf2ff 100%)",
            border: "1px solid rgba(0,99,251,0.18)",
            borderRadius: PLATFORM_RADII[platform].card,
            display: "flex", alignItems: "center", gap: 10,
            animation: "fadein 300ms var(--ease-modal)",
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: 9, background: "#fff", padding: 2,
              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
              boxShadow: "0 4px 10px rgba(0,99,251,0.30)",
              animation: "pulse 2.2s ease-in-out infinite",
            }}>
              <AILogo size={28} />
            </div>
            <div style={{ minWidth: 0 }}>
              <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#0a3a8a", letterSpacing: -0.1 }}>
                {t({ en: "FINN is working for you", no: "FINN jobber for deg" })}
              </p>
              <p style={{ margin: "2px 0 0", fontSize: 11, color: "#0063fb" }}>
                {t({ en: "Fill in your details while you wait — up to 2 min",
                    no: "Fyll inn mens du venter – opptil 2 min" })}
              </p>
            </div>
          </div>
        )}

        {/* Body */}
        <div className="scroll-area" style={{ flex: 1, overflowY: "auto" }}>
          {/* Personal details — same row head as the list, expanded into
              the shared InputField cards so the seeker can fill now. */}
          <div style={{
            borderTop: "0.5px solid #ededed",
            display: "flex", alignItems: "flex-start", gap: 14, padding: "16px 16px 6px",
          }}>
            <div style={{ width: 32, height: 32, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              {contactReady
                ? <Icon name="check-circle" size={28} color="#1f8a3b" stroke={2} />
                : <RiveSpinner size={32} src="assets/finn_ai_spinner_allstates.riv" />}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ fontSize: 16, fontWeight: 600, color: "#1d1d1d", margin: 0, lineHeight: 1.25, letterSpacing: -0.2 }}>
                {t({ en: "Personal details", no: "Personalia" })}
              </p>
              <p style={{ fontSize: 13, color: "#6b6b6b", margin: 0, lineHeight: 1.35 }}>
                {contactReady
                  ? t({ en: "Synced from your profile — review", no: "Hentet fra profilen din – se over" })
                  : t({ en: "Fill in now while FINN fetches the rest", no: "Fyll inn nå mens FINN henter resten" })}
              </p>
            </div>
          </div>
          <div style={{ padding: "8px 20px 18px" }}>
            <InputField
              label={t({ en: "Name", no: "Navn" })}
              value={name} onChange={editName} autoComplete="name"
              placeholder={t({ en: "Your name", no: "Navnet ditt" })}
            />
            <InputField
              label={t({ en: "Email", no: "E-post" })}
              value={email} onChange={editEmail} type="email" autoComplete="email"
              placeholder={t({ en: "your@email.com", no: "din@epost.no" })}
            />
            <div>
              <InputField
                label={t({ en: "Phone", no: "Telefon" })}
                value={phone} onChange={editPhone} type="tel" autoComplete="tel" last
                placeholder={t({ en: "Type it, or wait for FINN", no: "Skriv det selv, eller vent på FINN" })}
              />
              {/* Co-draft suggestion — docks UNDER the user's own answer.
                  Uses the established AI vocabulary (grey answer card +
                  FINN AI mark + blue text-actions). Never overwrites input. */}
              {phoneSug && (
                <div style={{
                  marginTop: 10, padding: "12px 14px",
                  background: "#f7f7f9", borderRadius: 12,
                  animation: "fadein 220ms var(--ease-out)",
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                    <AILogo size={14} />
                    <span style={{ fontSize: 12, color: "#6b6b6b", letterSpacing: -0.05 }}>
                      {t({ en: "FINN's suggestion · found in your CV", no: "Forslag fra FINN · funnet i CV-en din" })}
                    </span>
                  </div>
                  <p style={{ fontSize: 17, fontWeight: 500, color: "#1d1d1d", margin: "0 0 6px", letterSpacing: -0.2 }}>
                    {phoneSug}
                  </p>
                  <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
                    <button className="press" onClick={acceptPhoneSug} style={blueAction}>
                      {t({ en: "Use suggestion", no: "Bruk forslaget" })}
                    </button>
                    <button className="press" onClick={dismissPhoneSug} style={greyAction}>
                      {t({ en: "Keep mine", no: "Behold mitt" })}
                    </button>
                  </div>
                </div>
              )}
              {!phoneSug && srcNote(phoneSrc) && (
                <p style={{ fontSize: 12, color: "#6b6b6b", margin: "8px 4px 0", lineHeight: 1.4 }}>
                  {srcNote(phoneSrc)}
                </p>
              )}
            </div>
          </div>

          {/* Background tasks — shared PreviewRow status rows. */}
          {prepRows.map((r, i) => (
            <PreviewRow
              key={r.id} row={r} isLast={i === prepRows.length - 1}
              hideEdit onEdit={() => {}} onPreview={null}
            />
          ))}

          <p style={{
            fontSize: 12, color: "#6b6b6b", lineHeight: 1.5,
            margin: "20px 24px 8px", textAlign: "center", letterSpacing: -0.05,
          }}>
            {t({
              en: <>Edit anything before you send.<br/>We'll keep a draft in your profile.</>,
              no: <>Du kan endre alt før du sender.<br/>Vi lagrer kladden i profilen din.</>,
            })}
          </p>
        </div>

        {/* Footer — same as ApplicationPreviewSheet. Send is never blocked
            by the AI; it enables as soon as the user's details are in. */}
        <div style={{
          padding: "12px 16px",
          paddingBottom: `calc(12px + ${homeArea}px)`,
          background: "#fff", borderTop: "0.5px solid rgba(0,0,0,0.06)",
          display: "flex", flexDirection: "column", gap: 8,
        }}>
          <PrimaryButton onClick={() => { haptic("ok"); onSend(); }} disabled={!canSend}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
              <Icon name="send" size={18} color="#fff" stroke={2.2} />
              {t({ en: "Send application", no: "Send søknad" })}
            </span>
          </PrimaryButton>
        </div>
      </div>
    </div>
  );
}

function PreviewRow({ row, onEdit, onPreview, isLast, editLabel, hideEdit = false }) {
  const t = useT();
  const isLoading = row.status === "loading";
  const label = editLabel ?? t({ en: "Edit", no: "Endre" });

  // Keep the spinner mounted briefly after isLoading flips so the crossfade
  // has a target to fade out against, instead of the canvas vanishing the
  // moment React unmounts the loading branch.
  const [spinnerLatched, setSpinnerLatched] = useState(isLoading);
  useEffect(() => {
    if (isLoading) {
      setSpinnerLatched(true);
      return;
    }
    const t = setTimeout(() => setSpinnerLatched(false), 360);
    return () => clearTimeout(t);
  }, [isLoading]);

  const StatusIcon = () => {
    const isDone     = row.status === "done" || row.status === "ai";
    const isQueued   = row.status === "queued";
    const isMissing  = !isLoading && !isDone && !isQueued;
    return (
      <div style={{
        position: "relative", width: 32, height: 32, flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        {/* Spinner — stays mounted for ~360ms after isLoading flips so we
            can fade it out instead of just dropping the canvas. */}
        {spinnerLatched && (
          <div style={{
            position: "absolute", inset: 0,
            display: "flex", alignItems: "center", justifyContent: "center",
            opacity: isLoading ? 1 : 0,
            transition: "opacity 320ms cubic-bezier(0.4, 0, 0.2, 1)",
          }}>
            <RiveSpinner size={32} src="assets/finn_ai_spinner_allstates.riv" />
          </div>
        )}
        {/* Completed — check-circle. No scale overshoot; just a soft fade in
            via CSS animation so it works whether the element mounts pre-loaded
            (personalia/questions) or after loading→done (CV/letter). */}
        {isDone && (
          <div style={{
            position: "absolute", inset: 0,
            display: "flex", alignItems: "center", justifyContent: "center",
            animation: "softLand 380ms cubic-bezier(0.4, 0, 0.2, 1) both",
          }}>
            <Icon name="check-circle" size={28} color="#1f8a3b" stroke={2} />
          </div>
        )}
        {/* Queued — neutral outlined disc. */}
        {isQueued && (
          <div style={{
            position: "absolute", inset: 0, borderRadius: 9999,
            border: "1.5px solid #d4d4d4", background: "#fff",
            opacity: 0.85,
            animation: "softLand 320ms cubic-bezier(0.4, 0, 0.2, 1) both",
          }} />
        )}
        {/* Missing — red alert. */}
        {isMissing && (
          <div style={{
            position: "absolute", inset: 0, borderRadius: 9999,
            background: "#fadddd",
            display: "flex", alignItems: "center", justifyContent: "center",
            animation: "softLand 380ms cubic-bezier(0.4, 0, 0.2, 1) both",
          }}>
            <Icon name="alert" size={18} color="#cc1414" stroke={2.4} />
          </div>
        )}
      </div>
    );
  };

  const pill = (() => {
    if (row.status === "ai")      return { bg: "#eaf2ff", fg: "#0063fb" };
    if (row.status === "missing") return { bg: "#fadddd", fg: "#cc1414" };
    return { bg: "#f0f0f3", fg: "#404040" };
  })();

  return (
    <div style={{
      borderTop: "0.5px solid #ededed",
      borderBottom: isLast ? "0.5px solid #ededed" : "none",
      position: "relative",
    }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 14, padding: "16px 16px" }}>
        {/* Status icon — fixed 32×32 slot so swap between spinner/check/queued
            never shifts horizontal layout. Inner element fades in on mount. */}
        <div style={{
          width: 32, height: 32, flexShrink: 0,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <StatusIcon />
        </div>
        {/* Content column — height is locked by the always-rendered sub <p>
            below, so the row never grows/shrinks when loading completes.
            No more whole-content opacity flash; each element fades on its own. */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            display: "flex", alignItems: "center", gap: 8, marginBottom: 4,
            flexWrap: "wrap", minHeight: 20,
          }}>
            {/* Title — two stacked copies for a soft shimmer↔plain crossfade
                instead of a hard class swap. The plain <p> is the one in
                document flow (so titleSuffix size is reserved correctly);
                the shimmer <p> is absolutely positioned on top of it. */}
            <span style={{ position: "relative", display: "inline-flex", alignItems: "center" }}>
              <p
                style={{
                  fontSize: 16, fontWeight: 600, color: "#1d1d1d",
                  margin: 0, lineHeight: 1.25, letterSpacing: -0.2,
                  display: "inline-flex", alignItems: "center", gap: 6,
                  opacity: isLoading ? 0 : 1,
                  transition: "opacity 360ms cubic-bezier(0.4, 0, 0.2, 1) 80ms",
                }}
              >
                {row.title}
                {row.titleSuffix}
              </p>
              <p
                className="ai-shimmer-text"
                aria-hidden="true"
                style={{
                  position: "absolute", top: 0, left: 0,
                  fontSize: 16, fontWeight: 600,
                  margin: 0, lineHeight: 1.25, letterSpacing: -0.2,
                  display: "inline-flex", alignItems: "center", gap: 6,
                  whiteSpace: "nowrap",
                  opacity: isLoading ? 1 : 0,
                  transition: "opacity 280ms cubic-bezier(0.4, 0, 0.2, 1)",
                  pointerEvents: "none",
                }}
              >
                {row.title}
              </p>
            </span>
            {row.source && (
              <span style={{
                fontSize: 11, fontWeight: 500,
                padding: "2px 8px", borderRadius: 9999,
                background: pill.bg, color: pill.fg,
                whiteSpace: "nowrap", letterSpacing: -0.05,
              }}>{row.source}</span>
            )}
          </div>
          {/* Sub-area — height locked to the loaded text's height so the
              skeleton/text crossfade never causes the row to grow. Both
              children share the same coordinate space; opacities flip with
              a tiny stagger so the swap feels like a soft handover. */}
          <div style={{ position: "relative", minHeight: 18 }}>
            {row.sub && (
              <p style={{
                fontSize: 13,
                color: row.status === "missing" ? "#cc1414" : "#6b6b6b",
                margin: 0, lineHeight: 1.35,
                opacity: isLoading ? 0 : 1,
                transition: "opacity 360ms cubic-bezier(0.4, 0, 0.2, 1) 80ms",
              }}>{row.sub}</p>
            )}
            <span
              className="skeleton"
              style={{
                position: "absolute", top: 4, left: 0,
                width: 168, height: 10,
                opacity: isLoading ? 1 : 0,
                transition: "opacity 280ms cubic-bezier(0.4, 0, 0.2, 1)",
                pointerEvents: "none",
              }}
              aria-hidden="true"
            />
          </div>
        </div>
        {row.preview && (
          <button
            className="press"
            onClick={() => { haptic("tap"); onPreview?.(); }}
            aria-label={t({ en: "Preview", no: "Forhåndsvis" })}
            style={{
              width: 36, height: 36, borderRadius: 9999,
              background: "#dceafe", border: 0, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>
            <Icon name="eye" size={18} color="#0063fb" stroke={2} />
          </button>
        )}
        {!hideEdit && (
          <button
            className="press"
            onClick={() => { if (!isLoading) { haptic("tap"); onEdit?.(); } }}
            disabled={isLoading}
            style={{
              display: "inline-flex", alignItems: "center", gap: 2,
              background: "transparent", border: 0,
              cursor: isLoading ? "not-allowed" : "pointer",
              color: isLoading ? "#a5a5a5" : "#0063fb",
              fontFamily: "inherit",
              fontSize: 15, fontWeight: 600, padding: "8px 2px 8px 8px",
              flexShrink: 0, minHeight: 44, letterSpacing: -0.1,
            }}>
            {label}
            <Icon name="chevron-right" size={16} color={isLoading ? "#a5a5a5" : "#0063fb"} stroke={2.2} />
          </button>
        )}
        {hideEdit && (
          /* MVP — no explicit Edit button. The whole row becomes a tap target
             so the user can still open the editor without an extra chip. */
          <button
            className="press"
            onClick={() => { if (!isLoading) { haptic("tap"); onEdit?.(); } }}
            disabled={isLoading}
            aria-label={label}
            style={{
              position: "absolute", inset: 0,
              background: "transparent", border: 0, padding: 0,
              cursor: isLoading ? "not-allowed" : "pointer",
            }}
          />
        )}
      </div>
    </div>
  );
}

// CV preview sits above the picker (z=72) when reached via Rediger/Endre.
// Going back unmounts only the preview — the picker is already there underneath.
function CVPreviewSheet({ onClose, onBack, onCommit, initialSource = "profile", uploadMode = false }) {
  const t = useT();
  // Close fires the same animation whether the user taps Back, Done, or
  // the dimmed backdrop — onClose unmounts the sheet, onBack returns to
  // the picker underneath. We pick a delegate per action and route through
  // the delayed-close hook so the slide-down always plays first.
  const [exiting, runDelayedClose] = useDelayedClose(() => {
    if (delegateRef.current) {
      const fn = delegateRef.current;
      delegateRef.current = null;
      fn?.();
    }
  }, 320);
  const delegateRef = useRef(null);
  function dispatchClose(fn) {
    delegateRef.current = fn || onClose;
    runDelayedClose();
  }
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;
  // Source is now decided in the picker, so this is fixed for the lifetime of the sheet.
  const source = initialSource;
  const [uploaded, setUploaded] = useState(uploadMode ? null : {
    name: "Lee_Frost_CV_2025.pdf", size: "245 KB", ext: "PDF", date: "12 March 2026",
  });
  // Chevron-back returns to the picker; tapping the dimmed backdrop is a full close.
  const goBack = () => dispatchClose(onBack || onClose);
  const goCommit = () => dispatchClose(onCommit || onClose);
  const goClose = () => dispatchClose(onClose);
  // Human label of the source we're previewing (shown in the header).
  const sourceLabel = source === "uploaded"
    ? t({ en: "Uploaded CV", no: "Opplastet CV" })

function TailorSheet({ onDone, onClose }) {
  const t = useT();
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const { statusBarH, homeArea } = useMetrics();
  const backdropH = statusBarH + 16;
  const [step, setStep] = useState(0);
  const [picked, setPicked] = useState(null);

  const questions = [
    {
      q: t({ en: "How many years of leadership experience?", no: "Hvor mange års lederfaring har du?" }),
      hint: t({ en: "We'll mention this at the top of your cover letter.", no: "Vi nevner det øverst i søknadsbrevet." }),
      options: [
        t({ en: "Less than 2", no: "Mindre enn 2" }),
        t({ en: "2–5 years", no: "2–5 år" }),
        t({ en: "5–10 years", no: "5–10 år" }),
        t({ en: "More than 10", no: "Mer enn 10" }),
      ],
    },
    {
      q: t({ en: "Have you led distributed teams?", no: "Har du ledet distribuerte team?" }),
      hint: t({ en: "The employer flagged this as a plus.", no: "Arbeidsgiver oppgir at dette er en fordel." }),
      options: [
        t({ en: "Yes, for years", no: "Ja, flere år" }),
        t({ en: "Yes, briefly", no: "Ja, kort" }),
        t({ en: "No", no: "Nei" }),
      ],
    },
    {
      q: t({ en: "When can you start?", no: "Når kan du tiltre?" }),
      hint: t({ en: "We'll add this under 'Availability'.", no: "Vi legger det inn under «Tilgjengelighet»." }),
      options: [
        t({ en: "Right away", no: "Umiddelbart" }),
        t({ en: "Within 1 month", no: "Innen 1 måned" }),
        t({ en: "Within 3 months", no: "Innen 3 måneder" }),
        t({ en: "By arrangement", no: "Etter avtale" }),
      ],
    },
  ];
  const total = questions.length;
  const current = questions[step];

  function next() {
    haptic("tap");
    if (step + 1 >= total) {
      haptic("ok");
      onDone();
    } else {
      setStep(step + 1);
      setPicked(null);
    }
  }

  return (
    <div style={{
      position: "absolute", inset: 0, zIndex: 70,
      background: "rgba(0,0,0,.34)",
      display: "flex", flexDirection: "column",
      animation: "fadein 300ms var(--ease-modal)",

      <div style={{
        flex: 1, background: "#fff",
        borderTopLeftRadius: sheetRadius, borderTopRightRadius: sheetRadius,
        display: "flex", flexDirection: "column",
        animation: "slideup 440ms var(--ease-modal)",
      }}>
        <div style={{ display: "flex", justifyContent: "center", padding: "10px 0 4px" }}>
          <SheetDragHandle />
        </div>

        <div style={{ padding: "8px 8px 8px 16px", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 38, height: 38, borderRadius: 10,
            background: "#fff", padding: 2,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 4px 12px rgba(0,99,251,0.25)",
          }}>
            <AILogo size={34} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{ fontSize: 14, fontWeight: 600, color: "#1d1d1d", margin: 0, letterSpacing: -0.1 }}>
              {t({ en: "Tailor for this role", no: "Tilpass for denne jobben" })}
            </p>
            <p style={{ fontSize: 12, color: "#6b6b6b", margin: "2px 0 0" }}>
              {t({ en: `Question ${step + 1} of ${total}`, no: `Spørsmål ${step + 1} av ${total}` })}
            </p>
          </div>
          <IconBtn icon="x" color="#1d1d1d" onClick={onClose} label={t({ en: "Close", no: "Lukk" })} />
        </div>

          <p style={{ fontSize: 13, color: "#6b6b6b", margin: "0 0 6px", letterSpacing: 0.1 }}>

          <h2 style={{
            fontSize: 22, fontWeight: 700, color: "#1d1d1d",

            {current.hint}

            {current.options.map(opt => {
              const selected = picked === opt;
              return (
                <button
                  key={opt}
                  className="press"
                  onClick={() => { haptic("tap"); setPicked(opt); }}
                  style={{
                    textAlign: "left", padding: "14px 16px", borderRadius: 14,
                    background: selected ? "#eaf2ff" : "#fff",
                    border: `1px solid ${selected ? "#0063fb" : "#ededed"}`,
                    color: "#1d1d1d", fontFamily: "inherit",
                    fontSize: 16, fontWeight: 500, cursor: "pointer",
                    display: "flex", alignItems: "center", gap: 12,
                    transition: "background 120ms var(--ease-out), border-color 120ms var(--ease-out)",
                    letterSpacing: -0.1,
                  }}>
                  <div style={{
                    width: 22, height: 22, borderRadius: 9999,
                    border: `2px solid ${selected ? "#0063fb" : "#c9c9c9"}`,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    background: selected ? "#0063fb" : "#fff",
                    transition: "all 120ms var(--ease-out)",
                  }}>
                    {selected && <Icon name="check" size={14} color="#fff" stroke={3} />}
                  </div>
                  {opt}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{
          padding: "14px 16px",
          paddingBottom: `calc(14px + ${homeArea}px)`,
          borderTop: "0.5px solid rgba(0,0,0,0.06)",
        }}>
          <PrimaryButton onClick={next} disabled={!picked}>
            {step + 1 === total
              ? t({ en: "Update application", no: "Oppdater søknad" })
              : t({ en: "Next", no: "Neste" })}
          </PrimaryButton>
        </div>
      </div>
    </div>
  );
}

function InputField({ label, value, onChange, type = "text", autoComplete, placeholder, last, dimmed = false }) {
  const [focused, setFocused] = useState(false);
  // Filled-card style: label above the input in sentence case, input
  // itself is a grey #f7f7f9 rounded card with finn-blue border on
  // focus. Used everywhere across MVP (Agentic), 1.0, 1.2 and 2.0 so the
  // form-input language is consistent.
  // `dimmed` softens the field — used for optional inputs (e.g. LinkedIn)
  // that should read as not-yet-filled / lower priority.
  return (
    <div style={{
      display: "flex", flexDirection: "column",
      paddingBottom: last ? 0 : 14,
      opacity: dimmed ? 0.5 : 1,
      transition: "opacity 200ms var(--ease-out)",
    }}>
      <label style={{
        display: "flex", alignItems: "center", gap: 8,
        fontSize: 14, color: "#6b6b6b", fontWeight: 400,
        marginBottom: 6, fontFamily: "inherit",
        letterSpacing: -0.05,
      }}>{label}</label>
      <input
        type={type} value={value}
        autoComplete={autoComplete} placeholder={placeholder}
        onChange={(e) => onChange?.(e.target.value)}
        onFocus={() => { if (!dimmed) setFocused(true); }}
        onBlur={() => setFocused(false)}
        disabled={dimmed}
        style={{
          fontSize: 17, color: "#1d1d1d", fontWeight: 500,
          border: focused ? "1px solid #0063fb" : "1px solid transparent",
          outline: 0,
          background: "#f7f7f9",
          padding: "14px 16px",
          borderRadius: 12,
          fontFamily: "inherit",
          letterSpacing: -0.2, width: "100%",
          boxSizing: "border-box",
          caretColor: "#0063fb",
          cursor: dimmed ? "not-allowed" : "text",
          transition: "border-color 160ms var(--ease-out)",
        }}
      />
    </div>
  );
}

function IOSSwitch({ checked, onChange, label, hint }) {
  return (
    <button
      onClick={() => { haptic("tap"); onChange?.(!checked); }}
      className="press"
      style={{
        display: "flex", alignItems: "center", gap: 12,
        background: "transparent", border: 0, padding: "14px 0",
        cursor: "pointer", width: "100%", textAlign: "left",
        fontFamily: "inherit",
      }}>
      <div style={{ flex: 1 }}>
        <p style={{
          fontSize: 15, fontWeight: 500, color: "#1d1d1d", margin: 0, letterSpacing: -0.1,
        }}>{label}</p>
        {hint && <p style={{ fontSize: 12, color: "#6b6b6b", margin: "2px 0 0" }}>{hint}</p>}
      </div>
      <div style={{
        width: 51, height: 31, borderRadius: 9999,
        background: checked ? "#34c759" : "#e9e9eb",
        position: "relative", flexShrink: 0,
        transition: "background 220ms var(--ease-out)",
      }}>
        <div style={{
          position: "absolute",
          top: 2, left: checked ? 22 : 2,
          width: 27, height: 27, borderRadius: 9999,
          background: "#fff",
          boxShadow: "0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.1)",
          transition: "left 240ms cubic-bezier(.2,1.05,.3,1.2)",
        }} />
      </div>
    </button>
  );
}

function FieldRow({ label, value, last }) {

// Personal details editor — inline editable, with iOS-style toggle
function PersonaliaEditor({ version = "mvp" }) {
  const t = useT();
  const isMvp = version === "mvp";
  const [v, setV] = useState({
    name: "Lee Frost",
    email: "lee@example.com",
    phone: "+47 412 34 567",
    location: "Oslo",
    linkedin: "",
  });
  // MVP default: "Add optional info" is off and LinkedIn is dimmed until
  // the user opts in. Other versions surface optional info by default.
  const [showOptional, setShowOptional] = useState(!isMvp);
  const [saveToProfile, setSaveToProfile] = useState(!isMvp);
  const update = (k) => (val) => setV(prev => ({ ...prev, [k]: val }));
  return (
    <div style={{ padding: "0 20px" }}>
      <InputField label={t({ en: "Name", no: "Navn" })} value={v.name} onChange={update("name")} autoComplete="name" />
      <InputField label={t({ en: "Email", no: "E-post" })} value={v.email} onChange={update("email")} type="email" autoComplete="email" />
      <InputField label={t({ en: "Phone", no: "Telefon" })} value={v.phone} onChange={update("phone")} type="tel" autoComplete="tel" />
      <InputField label={t({ en: "Location", no: "Bosted" })} value={v.location} onChange={update("location")} autoComplete="address-level2" />
      <InputField
        label={t({ en: "LinkedIn (optional)", no: "LinkedIn (valgfritt)" })}
        value={v.linkedin}
        onChange={update("linkedin")}
        placeholder={t({ en: "linkedin.com/in/your-handle", no: "linkedin.com/in/ditt-navn" })}
        autoComplete="url"
        dimmed={!showOptional}
        last
      />
      <div style={{ marginTop: 8, borderTop: "0.5px solid #ededed", paddingTop: 4 }}>
        <IOSSwitch
          checked={showOptional}
          onChange={setShowOptional}
          label={t({ en: "Add optional info", no: "Legg til valgfri info" })}
          hint={showOptional
            ? t({ en: "LinkedIn and other optional fields are visible", no: "LinkedIn og andre valgfrie felt vises" })
            : t({ en: "Show LinkedIn and other optional fields", no: "Vis LinkedIn og andre valgfrie felt" })}
        />
        {!isMvp && (
          <IOSSwitch
            checked={saveToProfile}
            onChange={setSaveToProfile}
            label={t({ en: "Also save to my profile", no: "Lagre også til profilen" })}
            hint={saveToProfile
              ? t({ en: "Future applications will use these details", no: "Fremtidige søknader bruker disse opplysningene" })
              : t({ en: "Changes apply only to this application", no: "Endringene gjelder kun denne søknaden" })}
          />
        )}
      </div>
    </div>
  );
}

// Employer questions — inline answer for the missing one
function QuestionsEditor({ version = "mvp" }) {
  const t = useT();
  const lang = useLang();
  const isMvp = version === "mvp";
  // MVP: questions start unanswered, no provenance tags. The user fills
  // all three before they can send. Other versions prefill the first two
  // from profile / Tilpass so the user only sees one open question.
  const [answer, setAnswer] = useState("");
  const filled = answer.trim().length >= 12;
  const suggestion = lang === "no"
    ? "Det som motiverer meg mest, er sjansen til å lede et plattform-team der driftssikkerhet er produktet, ikke en bivirkning."
    : "What excites me most is the chance to lead a platform team where reliability is the product, not an afterthought.";
  return (
    <div style={{ padding: "0 20px", display: "flex", flexDirection: "column", gap: 20 }}>
      <Question
        q={t({ en: "How many years of leadership experience?", no: "Hvor mange års lederfaring har du?" })}
        a={isMvp ? null : t({ en: "2–5 years", no: "2–5 år" })}
        from={isMvp ? null : t({ en: "From your Tailor answers", no: "Fra svarene i Tilpass" })}
      />
      <Question
        q={t({ en: "Are you eligible to work in Norway?", no: "Har du tillatelse til å jobbe i Norge?" })}
        a={isMvp ? null : t({ en: "Yes", no: "Ja" })}
        from={isMvp ? null : t({ en: "From your profile", no: "Fra profilen din" })}
      />
      <div>
        <p style={{ fontSize: 15, fontWeight: 600, color: "#1d1d1d", margin: "0 0 8px", letterSpacing: -0.1 }}>
          {t({ en: "What draws you to this role?", no: "Hva tiltrekker deg ved denne stillingen?" })}
        </p>
        <div style={{
          borderRadius: 12, border: `1px solid ${filled ? "#1f8a3b" : "#0063fb"}`,
          background: "#fff", overflow: "hidden",
          transition: "border-color 200ms var(--ease-out)",
        }}>
          <textarea
            value={answer}
            onChange={(e) => setAnswer(e.target.value)}
            placeholder={t({ en: "Type your answer…", no: "Skriv svaret ditt …" })}
            rows={4}
            style={{
              width: "100%", border: 0, outline: 0, resize: "none",
              padding: "12px 14px",
              fontFamily: "inherit", fontSize: 15, color: "#1d1d1d",
              lineHeight: 1.45, background: "transparent",
              caretColor: "#0063fb",
            }}
          />
          <div style={{
            display: "flex", alignItems: "center",
            padding: "8px 14px", borderTop: "0.5px solid #ededed",
            background: "#fafafa",
          }}>
            <button
              className="press"
              onClick={() => { haptic("tap"); setAnswer((a) => a + (a ? " " : "") + suggestion); }}
              style={{
                background: "transparent", border: 0, padding: 4,
                color: "#0063fb", fontFamily: "inherit",
                fontSize: 13, fontWeight: 600, cursor: "pointer",
                display: "inline-flex", alignItems: "center", gap: 6,
                letterSpacing: -0.05,
              }}>
              <Icon name="sparkle" size={14} color="#0063fb" stroke={0} fill="#0063fb" />
              {t({ en: "Suggest an answer", no: "Foreslå svar" })}
            </button>
            <span style={{
              marginLeft: "auto",
              fontSize: 12, color: filled ? "#1f8a3b" : "#6b6b6b",
              fontWeight: 500,
            }}>
              {filled
                ? t({ en: "Ready", no: "Klar" })
                : t({ en: "Min 12 characters", no: "Minst 12 tegn" })}
            </span>
          </div>
        </div>
        <p style={{ fontSize: 12, color: "#6b6b6b", margin: "6px 4px 0" }}>
          {t({ en: "Required before you can send", no: "Må fylles ut før du sender" })}
        </p>
      </div>
    </div>
  );
}

// ===========================================================
// CONFIRMATION
// ===========================================================
// ─── AgenticReviewScreen ─────────────────────────────────────────────
// Full-screen iOS view (not a bottom sheet) — port of the live web Agentic
// flow into the native design language. Two internal phases:
//   1. "preparing" — sparkle + skeleton placeholders while the agent
//      "analyzes" the application (~1.6s simulated).
//   2. "ready"     — three editable sections (Personopplysninger,
//      Vedlegg, Tilleggsspørsmål), a confirmation checkbox, and Send.
// Each field is tappable to edit inline; on edit, a "Redigert" chip
// appears next to that field's label so reviewers see what the user
// touched after the agent's draft.

// Lifted out of AgenticReviewScreen so its function identity stays stable
// across parent re-renders. When this lived inside AgenticReviewScreen, every
// re-render (e.g. toggling the confirm switch) created a new function
// reference, React saw a "different" SectionRow type at the same position
// and unmounted/remounted it — which made the .ar-check-land entry
// animation re-fire on every parent render. That's why the ticks flashed.
function SectionRow({ id, title, sub, edited, status = "done", onTap }) {
  const t = useT();
  const loading = status === "working";
  const queued  = status === "queued";
  const missing = status === "missing";
  const idle    = loading || queued;
  let leadingIcon;
  if (loading) {
    leadingIcon = (
      <div key="working" className="ar-soft-fade" style={{
        width: 32, height: 32,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <RiveSpinner size={32} src="assets/finn_ai_spinner_allstates.riv" />
      </div>
    );
  } else if (queued) {
    leadingIcon = (
      <div key="queued" className="ar-soft-fade" style={{
        width: 32, height: 32, borderRadius: 9999,
        border: "1.5px solid #d4d4d4", background: "#fff",
      }} />
    );
  } else if (missing) {
    leadingIcon = (
      <div key="missing" className="ar-check-land" style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: 32, height: 32, borderRadius: 9999,
        background: "#fadddd",
      }}>
        <Icon name="alert" size={18} color="#cc1414" stroke={2.4} />
      </div>
    );
  } else {
    leadingIcon = (
      <div key="done" className="ar-check-land" style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: 32, height: 32,
      }}>
        <Icon name="check-circle" size={28} color="#1f8a3b" stroke={2} />
      </div>
    );
  }
  return (
    <div className="ar-row">
      <button className="ar-row-head press"
        onClick={() => { if (!idle) { haptic("tap"); onTap?.(id); } }}
        disabled={idle}
        aria-haspopup="dialog"
        aria-busy={loading || undefined}
        style={{ cursor: idle ? "default" : "pointer" }}>
        <span className="ar-row-check" aria-hidden="true">
          {leadingIcon}
        </span>
        <span className="ar-row-text">
          <span className="ar-row-title">
            {title}
            {edited && !idle && !missing && (
              <span style={{
                display: "inline-flex",
                opacity: 1,
                transition: "opacity 380ms cubic-bezier(0.45, 0, 0.25, 1)",
              }}><EditedChip /></span>
            )}
          </span>
          <span className="ar-row-sub" style={missing ? { color: "#cc1414" } : null}>
            {sub}
          </span>
        </span>
        <span className="ar-row-edit" style={{
          opacity: idle ? 0 : 1,
          transition: "opacity 380ms cubic-bezier(0.45, 0, 0.25, 1)",
          pointerEvents: idle ? "none" : "auto",
        }}>
          {missing
            ? t({ en: "Add", no: "Legg til" })
            : t({ en: "Edit", no: "Endre" })}
          <Icon name="chevron-right" size={16} color="#0063fb" stroke={2.2} />
        </span>
      </button>
    </div>
  );
}

// SourcePill — a Source-attribution chip with a tappable "Why this answer?"
// affordance. Lives at module scope so its `showExplanation` state isn't
// reset on every parent re-render. Tap toggles a short, single-line
// explanation underneath; tap again or click elsewhere dismisses.
function SourcePill({ source, explanation, variant = "ai" }) {
  const t = useT();
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [open]);
  const hasExplain = !!explanation;
  return (
    <span ref={wrapRef} style={{ position: "relative", display: "inline-flex" }}>
      <button
        type="button"
        onClick={(e) => { if (!hasExplain) return; e.stopPropagation(); haptic("tap"); setOpen(v => !v); }}
        className="ar-rv-source"
        aria-expanded={hasExplain ? open : undefined}
        aria-haspopup={hasExplain ? "true" : undefined}
        style={{
          cursor: hasExplain ? "pointer" : "default",
          font: "500 11px/1.2 var(--sys-text)", letterSpacing: -0.05,
          display: "inline-flex", alignItems: "center", gap: 4,
        }}>
        {t(source)}
        {hasExplain && (
          <span aria-hidden="true" style={{
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            width: 12, height: 12, borderRadius: 9999,
            border: "1px solid currentColor", fontSize: 9, fontWeight: 700,
            lineHeight: 1, marginLeft: 1,
          }}>?</span>
        )}
      </button>
      {open && hasExplain && (
        <span role="tooltip"
          style={{
            position: "absolute", top: "calc(100% + 6px)", left: 0, zIndex: 5,
            background: "#1d1d1d", color: "#fff",
            padding: "8px 12px", borderRadius: 10,
            fontSize: 12, lineHeight: 1.45, letterSpacing: -0.05,
            maxWidth: 280, width: "max-content",
            boxShadow: "0 6px 18px rgba(0,0,0,0.15)",
            animation: "fadein 180ms cubic-bezier(0.45, 0, 0.25, 1)",
          }}>
          {t(explanation)}
        </span>
      )}
    </span>
  );
}

function AgenticReviewScreen({ job, onClose, onSend, userState = "ready", initialSection = null }) {
  const t = useT();
  const [exiting, close] = useDelayedClose(onClose, 320);
  // Simulated backend errors. `prepare-error` aborts the preparing phase
  // with a yellow warning banner + Try again / Back to job ad. `send-error`
  // intercepts the Send tap and shows a red critical banner + Back to job
  // ad. "Try again" resets to a fresh preparing run; "Back to job ad"
  // closes the agentic sheet.
  const isPrepareError = userState === "prepare-error";
  const isSendErrorState = userState === "send-error";
  const [sendFailed, setSendFailed] = useState(false);
  // Independent exit state for the inner section sheet (Personalia /
  // Vedlegg / Questions) so its slide-down doesn't share timing with the
  // outer agentic sheet's close.
  const [sectionSheetExiting, setSectionSheetExiting] = useState(false);
  const sectionExitTimerRef = useRef(null);
  useEffect(() => () => {
    if (sectionExitTimerRef.current) clearTimeout(sectionExitTimerRef.current);
  }, []);
  function closeSectionSheet() {
    if (sectionSheetExiting) return;
    setSectionSheetExiting(true);
    sectionExitTimerRef.current = setTimeout(() => {
      setSectionSheet(null);
      setSectionSheetExiting(false);
      // Reset internal navigation so reopening Vedlegg starts on the
      // main page, not the last page the user was on.
      setVedleggStack(["main"]);
      setVedleggDir("push");
    }, 320);
  }

  // ─── Internal page-navigation stack for the Vedlegg section sheet ─────
  // Replaces the previous behaviour of stacking EditSheet → CVPreviewSheet
  // on top of the section sheet (four-deep modal stack). Now we push
  // pages *inside* the same sheet — iOS-native UINavigationController
  // pattern. Pages: main · cv-picker · cv-preview · letter · select-letter
  const [vedleggStack, setVedleggStack] = useState(["main"]);
  // Direction of the most-recent navigation, drives push-in / pop-in CSS.
  const [vedleggDir, setVedleggDir] = useState("push");
  function pushVedleggPage(page) {
    setVedleggDir("push");
    setVedleggStack(s => [...s, page]);
    // Reset the in-flight upload state any time we enter a fresh picker.
    setPickerUploaded(null);
    setPickerSaveToProfile(true);
  }
  function popVedleggPage() {
    setVedleggDir("pop");
    setVedleggStack(s => s.length > 1 ? s.slice(0, -1) : s);
  }
  const vedleggPage = vedleggStack[vedleggStack.length - 1];
  const vedleggCanGoBack = vedleggStack.length > 1;
  // Lifted picker state — sits up here so the bottom footer can commit
  // the upload with a single "Use this CV / cover letter" button instead
  // of the picker carrying its own inline primary button.
  const [pickerUploaded, setPickerUploaded] = useState(null);
  const [pickerSaveToProfile, setPickerSaveToProfile] = useState(true);
  function commitPickerUpload() {
    if (!pickerUploaded) return;
    haptic("ok");
    const fieldKey = vedleggPage === "cv-picker" ? "cv" : "letter";
    update(fieldKey, pickerUploaded.name);
    popVedleggPage();
    setPickerUploaded(null);
  }
  const { statusBarH, homeArea } = useMetrics();
  const platform = usePlatform();
  const sheetRadius = PLATFORM_RADII[platform].sheet;
  const backdropH = statusBarH + 16;
  const [sheetTab, setSheetTab] = useState("application"); // application | ad
  const [phase, setPhase] = useState("preparing"); // preparing | ready

  // Labels are re-computed every render so a language toggle relabels the
  // form without resetting user edits. Initial values for "value" fields
  // (gender, qNorsk) are stored as the *English* canonical value to keep
  // the edit-flag comparison stable across language switches.
  const LABELS = {
    firstName: t({ en: "First name", no: "Fornavn" }),
    lastName:  t({ en: "Last name",  no: "Etternavn" }),
    email:     t({ en: "Email",      no: "Epost" }),
    phone:     t({ en: "Phone number", no: "Telefonnummer" }),
    gender:    t({ en: "Gender",     no: "Kjønn" }),
    linkedin:  t({ en: "LinkedIn URL", no: "LinkedIn-lenke" }),
    cv:        t({ en: "CV",         no: "CV" }),
    letter:    t({ en: "Cover letter", no: "Søknadsbrev" }),
    qNorsk:    t({ en: "Do you speak fluent Norwegian?", no: "Behersker du norsk flytende?" }),
    qExp:      t({ en: "How many years of relevant experience do you have?", no: "Hvor mange års relevant erfaring har du?" }),
    qSkills:   t({ en: "Which of these skills do you have?", no: "Hvilke av disse ferdighetene har du?" }),
  };

  // Value-field initial state. For free-text fields these are stored as-is;
  // for enum fields (gender, qNorsk) we store the *English* canonical so
  // the "edited" flag survives a language toggle. The rendered radio labels
  // are translated locally in GenderRow / YesNoRow.
  const initial = {
    firstName: { v: "George",                e: false },
    lastName:  { v: "Town",                  e: false },
    email:     { v: "georgetownt@gmail.com", e: false },
    phone:     { v: "98 73 88 21",           e: false },
    gender:    { v: "Male",                  e: false }, // canonical English
    linkedin:  { v: "Georgetownlinkedin",    e: false },
    cv:        { v: "CV_2025.pdf",           e: false },
    letter:    { v: "Cover_Letter_2025.doc", e: false },
    // Additional questions start empty — user fills them in. No AI pre-fill
    // in MVP (Hypothesis 2.2 — seekers want control on user-answered Qs).
    qNorsk:    { v: "",                      e: false },
    qExp:      { v: "",                      e: false },
    // Multi-select: value is an array of chosen (English canonical) options.
    qSkills:   { v: [],                      e: false },
  };
  const [fields, setFields] = useState(initial);
  // Optional info (LinkedIn) is opt-in. Defaults off so the linked-in field
  // reads as a deliberate add-on rather than implicit profile data.
  const [includeLinkedin, setIncludeLinkedin] = useState(false);
  const [confirmed, setConfirmed] = useState(false);
  // Extra confirmation checkbox — unchecked by default, sits above the
  // main confirm toggle beneath the section rows.
  const [extraConfirmed, setExtraConfirmed] = useState(false);
  const [editing, setEditing] = useState(null); // field key currently inline-edited
  // Which section's child edit sheet is currently open. The agentic review

  const [sectionSheet, setSectionSheet] = useState(initialSection || null); // null | "personalia" | "vedlegg" | "questions"

  const [sectionPrep, setSectionPrep] = useState({

    vedlegg:    "queued",
    questions:  "queued",

  // Re-run the preparing phase when this nonce bumps (used by the

  function retryPrepare() {

  // ─── Co-draft personalia (Figma 962:2855) ──────────────────────────

// Detect fullscreen mode — the QR code embeds ?fullscreen=1 so scanning
// on a phone lands directly in a clean, edge-to-edge prototype view with
// no site chrome, no dev panel, no feedback FABs. Bypasses the auth gate
// too — the prototype itself uses no team data, so there's nothing to
// protect; the gate exists for the strategy/team views, not the demo.
function isFullscreenMode() {
  if (typeof window === "undefined") return false;
  try {
    const p = new URLSearchParams(window.location.search);
    return p.get("fullscreen") === "1";
  } catch (_) { return false; }
}

function App() {
  const fullscreen = isFullscreenMode();
  useEffect(() => {
    if (typeof document === "undefined") return;
    if (fullscreen) {
      document.body.classList.add("fs-mode");
      document.documentElement.classList.add("fs-mode");
      // iOS Safari trick: scrolling to 1px collapses the URL bar so the
      // prototype takes the full visible height. Defer slightly to let
      // the layout settle first.
      const ticker = setTimeout(() => {
        try { window.scrollTo(0, 1); } catch (_) {}
      }, 50);
      return () => {
        clearTimeout(ticker);
        document.body.classList.remove("fs-mode");
        document.documentElement.classList.remove("fs-mode");
      };
    } else {
      document.body.classList.remove("fs-mode");
      document.documentElement.classList.remove("fs-mode");
    }
  }, [fullscreen]);
  // Fullscreen mode (scanned via QR) bypasses the auth gate so phones can
  // drop straight into the prototype without signing in — the prototype's
  // demo screens use no team data, so there's nothing to protect; the gate
  // exists for the strategy / team views, not the demo.
  if (fullscreen) return <AppShell fullscreen />;

  const auth = useAuth();

  // If cloud auth isn't configured (SUPABASE_URL missing), fall through to
  // the prototype without a gate so a contributor cloning the repo and
  // running it locally without secrets still sees the app.
  if (!cloudStore.enabled) return <AppShell />;

  // Local-dev bypass — when opened from file:// or localhost (or with
  // ?nogate=1 in the URL), skip the Google sign-in gate so we can preview
  // edits without OAuth bouncing us back to the live deployment. Keeps the
  // full AppShell (site chrome + dev panel), unlike ?fullscreen=1.
  const isLocalPreview = (typeof window !== "undefined") && (
    window.location.protocol === "file:" ||
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1" ||
    new URLSearchParams(window.location.search).get("nogate") === "1"
  );
  if (isLocalPreview) return <AppShell />;

  if (auth.status === "loading") {
    return (
      <div className="pwgate">
        <div className="pwgate-card">
          <h1>Vend · User Connect</h1>
          <p className="pwgate-sub">Checking your session…</p>
        </div>
      </div>
    );
  }
  if (auth.status === "signed-out" || auth.status === "wrong-domain") {
    return (
      <GoogleSignInGate
        status={auth.status}
        user={auth.user}
        onSignIn={auth.signInWithGoogle}
        onSignOut={auth.signOut}
      />
    );
  }
  return <AppShell authUser={auth.user} onSignOut={auth.signOut} />;
}

// ─── Helpers: derive feature flags from a (potentially edited) storymap ──
// Ordering for "what features have shipped by version X" rollups. The dev
// panel version `agentic` ships first (MVP), then `mvp` (1.0), then `v1`
// (1.2), then `v2` (2.0). featuresInVersion(stories, "v1") returns every
// `feature` tag from agentic, mvp, and v1 — i.e. everything that's in by 1.2.
const RELEASE_ORDER = { agentic: 0, mvp: 1, v1: 2, v2: 3 };
function featuresInVersion(stories, version) {
  const cur = RELEASE_ORDER[version] ?? 0;
  const set = new Set();
  for (const task of Object.values(stories)) {
    for (const r of ["agentic", "mvp", "v1", "v2"]) {
      if ((RELEASE_ORDER[r] ?? 0) <= cur) {
        (task[r] || []).forEach(s => { if (s.feature) set.add(s.feature); });
      }
    }
  }
  return set;
}
function deepCloneJSON(o) { return JSON.parse(JSON.stringify(o)); }

// ─── Persistence shape guards ─────────────────────────────────────────────
// SCHEMA bumps invalidate localStorage automatically, but cloud (Supabase)
// stores across bumps and can re-poison localStorage if a stale cloud value
// is adopted on first load. These helpers detect new-shape markers on
// stored payloads so we can fall back to defaults when the data is stale.
function storiesAreCurrentShape(data) {
  if (!data || typeof data !== "object") return false;
  // The agentic slot was added in SCHEMA 4. Sample a known backbone task.
  const probe = data["open-ad"];
  return !!probe && Array.isArray(probe.agentic);
}
function solutionsAreCurrentShape(data) {
  if (!Array.isArray(data) || data.length === 0) return false;
  // The `release` tier (1.0-must / 1.2-can-wait / post-2.0) was added in
  // SCHEMA 4. Any item carrying that field means we're on the new shape.
  return data.some(s => typeof s.release === "string");
}
function treeIsCurrentShape(data) {
  // SCHEMA 7 — outcome carries `measurables` + `measurablesMeta`, and the
  // first problem carries an optional `sub`. Reject the old shape so cloud
  // copies from earlier builds get reseeded from TREE_DATA on next load.
  if (!data || typeof data !== "object") return false;
  if (!data.outcome || typeof data.outcome.text !== "string") return false;
  if (!Array.isArray(data.outcome.measurables)) return false;
  if (typeof data.outcome.measurablesMeta !== "string") return false;
  if (!Array.isArray(data.problems)) return false;
  return true;
}
// Stable ID generator for newly-created tree nodes — sortable + readable.
// Used when a PM adds a hypothesis or solution; needs to never collide.
function freshId(prefix) {
  return prefix + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 9999).toString(36);
}

// ─── Feedback bridge — copies a Jira-formatted note + opens JEA-1179 ──────
// Turn a raw Supabase error message into something a designer can act on.
function friendlyCloudError(raw) {
  if (!raw) return "";
  const s = String(raw).toLowerCase();
  if (s.includes("relation") && s.includes("does not exist")) {
    return "The prototype_comments table doesn't exist yet. Open Supabase → SQL Editor and re-run the updated SQL block from the README (the one that creates prototype_comments + its policies).";
  }
  if (s.includes("row-level security") || s.includes("rls") || s.includes("permission denied")) {
    return "Supabase is rejecting the write. Most often this means the matching RLS policy hasn't been created yet — open SQL Editor and run the 'team can delete comments' policy from the README (or the full token-gated block to refresh all of them).";
  }
  if (s.includes("failed to fetch") || s.includes("network")) {
    return "Couldn't reach Supabase. Check your internet connection and that the project URL in index.html is correct.";
  }
  if (s.includes("invalid api key") || s.includes("jwt")) {
    return "Supabase rejected the API key. Check SUPABASE_ANON_KEY in index.html.";
  }
  return "Save failed: " + raw;
}

// Pin layer — an absolutely-positioned overlay on top of the iPhone
// device that (a) captures clicks when pinMode is on and (b) renders
// numbered dots for existing pinned comments on the current screen.
// Pins anchor to the *scrolled content* of the prototype, not the
// viewport: we capture the y-coordinate relative to the full scroll
// height when adding, and translate by current scrollTop when rendering,
// so pins stay attached to the UI element they were dropped on as the
// user scrolls.
function PinLayer({
  pinMode, onAddPin, pendingPin, pinnedComments, onOpenPin,
}) {
  const layerRef = useRef(null);
  const [scrollTick, setScrollTick] = useState(0);

  // Find the nearest scrollable ancestor by walking up from the layer.
  function getScrollContainer() {
    let el = layerRef.current && layerRef.current.parentElement;
    while (el) {
      const cs = window.getComputedStyle(el);
      const oy = cs.overflowY;
      if ((oy === "auto" || oy === "scroll") && el.scrollHeight > el.clientHeight) {
        return el;
      }
      el = el.parentElement;
    }
    return null;
  }

  // Subscribe to scroll on the surrounding scrollable element so pin
  // positions re-render. Re-attach if the scrollable element changes
  // (e.g. switching screens inside the prototype).
  useEffect(() => {
    let raf = 0;
    function bump() {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setScrollTick(t => t + 1));
    }
    // Try the immediate parent first; otherwise scan ancestors.
    const containers = new Set();
    const direct = layerRef.current && layerRef.current.parentElement;
    if (direct) containers.add(direct);
    const scrollable = getScrollContainer();
    if (scrollable) containers.add(scrollable);
    // Also listen to the device-bezel itself in case its inner content scrolls.
    const bezel = layerRef.current && layerRef.current.closest(".device-bezel");
    if (bezel) containers.add(bezel);
    containers.forEach(c => c.addEventListener("scroll", bump, { passive: true }));
    return () => {
      cancelAnimationFrame(raf);
      containers.forEach(c => c.removeEventListener("scroll", bump));
    };
  }, [pinnedComments.length]);

  function handleClick(e) {
    if (!pinMode) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const sc = getScrollContainer();
    // y is captured relative to FULL scroll height when there's an
    // internal scroll, so the pin stays attached to the underlying
    // content even as the user scrolls.
    if (sc) {
      const scRect = sc.getBoundingClientRect();
      const xPct = ((e.clientX - scRect.left) / sc.clientWidth) * 100;
      const contentY = (e.clientY - scRect.top) + sc.scrollTop;
      const yPct = (contentY / sc.scrollHeight) * 100;
      onAddPin({ x: xPct, y: yPct, scrolled: true });
    } else {
      const x = ((e.clientX - rect.left) / rect.width)  * 100;
      const y = ((e.clientY - rect.top)  / rect.height) * 100;
      onAddPin({ x, y, scrolled: false });
    }
  }

  // Compute on-screen position for a pin, translating from
  // content-relative % into current viewport-relative px when scrolled.
  function pinPosition(p) {
    const sc = getScrollContainer();
    if (sc && p.scrolled) {
      const scRect = sc.getBoundingClientRect();
      const layerRect = layerRef.current ? layerRef.current.getBoundingClientRect() : { top: 0, left: 0 };
      const contentY = (p.y / 100) * sc.scrollHeight;
      const viewY = contentY - sc.scrollTop + (scRect.top - layerRect.top);
      const viewX = (p.x / 100) * sc.clientWidth + (scRect.left - layerRect.left);
      return { left: viewX + "px", top: viewY + "px" };
    }
    return { left: p.x + "%", top: p.y + "%" };
  }

  // scrollTick is referenced so re-renders are scheduled on scroll.
  void scrollTick;

  return (
    <div
      ref={layerRef}
      className={"pin-layer" + (pinMode ? " pin-mode" : "")}
      onClick={handleClick}>
      {pinnedComments.map((c, i) => {
        const p = c.context && c.context.pin;
        if (!p) return null;
        return (
          <button
            key={c.id}
            className="pin-dot"
            style={pinPosition(p)}
            onClick={(e) => { e.stopPropagation(); onOpenPin(c.id); }}
            title={c.author + " · " + (c.body || "").slice(0, 80)}
            aria-label={"Open comment by " + c.author}>
            {i + 1}
          </button>
        );
      })}
      {pendingPin && (
        <span
          className="pin-dot pin-pending"
          style={pinPosition(pendingPin)}
          aria-hidden="true">+</span>
      )}
    </div>
  );
}

// ─── Feedback panel — threaded comments backed by Supabase ─────────────
// Slides in from the right. Anyone can leave a top-level comment or reply
// to an existing one. Comments auto-capture the current view/screen context
// so reviewers see exactly where you were when you wrote them.
function FeedbackPanel({
  open, onClose, currentContext, actorName, ensureActor,
  pendingPin, focusCommentId, onCommentsChanged,
}) {
  // If there's a pending pin, attach its coords to the comment context.
  const ctxWithPin = pendingPin
    ? { ...currentContext, pin: { x: pendingPin.x, y: pendingPin.y, surface: pendingPin.surface || "device" } }
    : currentContext;
  const [comments, setComments] = useState([]);
  const [loading, setLoading] = useState(false);
  const [filter, setFilter] = useState("open"); // all | thisview | open
  const [body, setBody] = useState("");
  const [replyParent, setReplyParent] = useState(null);
  const [replyBody, setReplyBody] = useState("");
  const [busy, setBusy] = useState(false);
  const [errMsg, setErrMsg] = useState("");
  // ID of the comment currently in "are you sure?" delete-confirm state.
  const [confirmDelete, setConfirmDelete] = useState(null);

  async function refresh() {
    setLoading(true);
    const data = await cloudStore.getComments(200);
    setComments(data);
    setLoading(false);
  }
  useEffect(() => {
    if (!open || !cloudStore.enabled) return;
    let cancelled = false;
    refresh();
    const t = setInterval(() => { if (!cancelled) refresh(); }, 30000);
    return () => { cancelled = true; clearInterval(t); };
  }, [open]);
  // If a pin was clicked, jump to "All" filter so we can find it, then
  // scroll the matching article into view.
  useEffect(() => {
    if (!focusCommentId || !open) return;
    setFilter("all");
    const t = setTimeout(() => {
      const el = document.querySelector("[data-fbp-id='" + focusCommentId + "']");
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("fbp-focused");
        setTimeout(() => el.classList.remove("fbp-focused"), 2200);
      }
    }, 250);
    return () => clearTimeout(t);
  }, [focusCommentId, open, comments]);

  async function submitTopLevel() {
    if (!body.trim()) return;
    setErrMsg("");
    ensureActor(async (who) => {
      setBusy(true);
      const { row, error } = await cloudStore.addComment({
        author: who,
        body: body.trim(),
        context: ctxWithPin,
      });
      setBusy(false);
      if (error) {
        setErrMsg(friendlyCloudError(error));
        haptic("err");
        return;
      }
      if (row) {
        setBody("");
        haptic("ok");
        cloudStore.logEvent({
          action: "comment-added",
          actor: who,
          detail: { excerpt: row.body.slice(0, 60), view: ctxWithPin?.view },
        });
        postCommentToSlack({
          author: who,
          body: row.body,
          context: ctxWithPin,
          deepLink: typeof window !== "undefined" ? window.location.href : null,
        });
        refresh();
        onCommentsChanged && onCommentsChanged();
      }
    });
  }
  async function submitReply(parentId) {
    if (!replyBody.trim()) return;
    setErrMsg("");
    ensureActor(async (who) => {
      setBusy(true);
      const { row, error } = await cloudStore.addComment({
        parent_id: parentId,
        author: who,
        body: replyBody.trim(),
        context: currentContext,
      });
      setBusy(false);
      if (error) {
        setErrMsg(friendlyCloudError(error));
        haptic("err");
        return;
      }
      if (row) {
        setReplyBody("");
        setReplyParent(null);
        haptic("ok");
        refresh();
        onCommentsChanged && onCommentsChanged();
      }
    });
  }
  async function toggleResolve(c) {
    ensureActor(async (who) => {
      const next = !c.resolved;
      const ok = await cloudStore.setCommentResolved(c.id, next, who);
      if (ok) {
        cloudStore.logEvent({
          action: next ? "comment-resolved" : "comment-reopened",
          actor: who,
          detail: { excerpt: c.body.slice(0, 60) },
        });
        refresh();
        onCommentsChanged && onCommentsChanged();
      }
    });
  }
  async function deleteComment(c) {
    setErrMsg("");
    ensureActor(async (who) => {
      setBusy(true);
      const { ok, error } = await cloudStore.deleteComment(c.id);
      setBusy(false);
      if (!ok) {
        setErrMsg(friendlyCloudError(error || "Couldn't delete the comment."));
        haptic("err");
        return;
      }
      cloudStore.logEvent({
        action: "comment-deleted",
        actor: who,
        detail: { excerpt: c.body.slice(0, 60), wasReply: !!c.parent_id },
      });
      setConfirmDelete(null);
      haptic("ok");
      refresh();
      onCommentsChanged && onCommentsChanged();
    });
  }

  if (!open) return null;

  // Build the tree: top-level comments + nested replies.
  const tops = comments.filter(c => !c.parent_id);
  const repliesOf = (parentId) =>
    comments.filter(c => c.parent_id === parentId)
            .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  // Apply the filter to the top-level list.
  const visible = tops.filter(c => {
    if (filter === "open" && c.resolved) return false;
    if (filter === "thisview") {
      if (!c.context || !currentContext) return false;
      return c.context.view === currentContext.view;
    }
    return true;
  });

  return (
    <>
      <div className="fbp-backdrop" onClick={onClose} />
      <aside className="fbp-sheet" role="dialog" aria-label="Feedback">
        <header className="fbp-head">
          <h3>Feedback</h3>
          <button className="fbp-close" onClick={onClose} aria-label="Close">×</button>
        </header>
        <div className="fbp-filter" role="tablist" aria-label="Filter">
          {[
            { id: "open",     label: "Open" },
            { id: "thisview", label: "This view" },
            { id: "all",      label: "All" },
          ].map(t => (
            <button key={t.id} role="tab" aria-selected={filter === t.id}
              className={filter === t.id ? "active" : ""}
              onClick={() => setFilter(t.id)}>{t.label}</button>
          ))}
          <span className="fbp-count">{visible.length} {visible.length === 1 ? "comment" : "comments"}</span>
        </div>

        <div className="fbp-list">
          {!cloudStore.enabled ? (
            <p className="fbp-empty">Cloud isn't configured — paste your Supabase URL + key in <code>index.html</code> to enable shared feedback.</p>
          ) : loading && visible.length === 0 ? (
            <p className="fbp-empty">Loading…</p>
          ) : visible.length === 0 ? (
            <p className="fbp-empty">
              {filter === "open"     ? "No open feedback. 🎉" :
               filter === "thisview" ? "No feedback on this view yet." :
                                       "No feedback yet — be the first."}
            </p>
          ) : visible.map(c => (
            <article key={c.id} data-fbp-id={c.id} className={"fbp-c" + (c.resolved ? " resolved" : "")}>
              <div className="fbp-c-meta">
                <span className="fbp-author">{c.author || "Anonymous"}</span>
                <span className="fbp-time">{relativeTime(c.created_at)}</span>
              </div>
              {c.context && (
                <div className="fbp-ctx">
                  {c.context.view     && <span className="ctx"><span className="k">view</span> {c.context.view}</span>}
                  {c.context.screen   && <span className="ctx"><span className="k">screen</span> {c.context.screen}</span>}
                  {c.context.platform && <span className="ctx"><span className="k">platform</span> {c.context.platform}</span>}
                  {c.context.version  && <span className="ctx"><span className="k">version</span> {c.context.version}</span>}
                </div>
              )}
              <p className="fbp-body">{c.body}</p>
              {c.resolved && (
                <p className="fbp-resolved-line">
                  Resolved {c.resolved_by ? "by " + c.resolved_by : ""} {c.resolved_at ? "· " + relativeTime(c.resolved_at) : ""}
                </p>
              )}
              <div className="fbp-actions">
                <button onClick={() => setReplyParent(replyParent === c.id ? null : c.id)}>
                  {replyParent === c.id ? "Cancel" : "Reply"}
                </button>
                <button onClick={() => toggleResolve(c)}>
                  {c.resolved ? "Reopen" : "Resolve"}
                </button>
                {confirmDelete === c.id ? (
                  <>
                    <button className="fbp-confirm-delete" onClick={() => deleteComment(c)} disabled={busy}>
                      {busy ? "Deleting…" : "Confirm delete"}
                    </button>
                    <button onClick={() => setConfirmDelete(null)}>Cancel</button>
                  </>
                ) : (
                  <button className="fbp-danger" onClick={() => setConfirmDelete(c.id)}>Delete</button>
                )}
              </div>
              {/* Reply composer */}
              {replyParent === c.id && (
                <div className="fbp-reply">
                  <textarea
                    rows="2" autoFocus
                    placeholder={"Reply as " + (actorName || "you") + "…"}
                    value={replyBody}
                    onChange={(e) => setReplyBody(e.target.value)} />
                  <button className="fbp-send" onClick={() => submitReply(c.id)}
                    disabled={!replyBody.trim() || busy}>
                    {busy ? "Sending…" : "Reply"}
                  </button>
                </div>
              )}
              {/* Nested replies */}
              {repliesOf(c.id).map(r => (
                <div key={r.id} className="fbp-reply-item">
                  <div className="fbp-c-meta">
                    <span className="fbp-author">{r.author || "Anonymous"}</span>
                    <span className="fbp-time">{relativeTime(r.created_at)}</span>
                    {confirmDelete === r.id ? (
                      <span style={{ marginLeft: "auto", display: "inline-flex", gap: 4 }}>
                        <button className="fbp-confirm-delete fbp-reply-del" onClick={() => deleteComment(r)} disabled={busy}>
                          {busy ? "…" : "Confirm"}
                        </button>
                        <button className="fbp-reply-del" onClick={() => setConfirmDelete(null)}>Cancel</button>
                      </span>
                    ) : (
                      <button className="fbp-reply-del fbp-danger"
                        style={{ marginLeft: "auto" }}
                        onClick={() => setConfirmDelete(r.id)}
                        aria-label="Delete this reply">Delete</button>
                    )}
                  </div>
                  <p className="fbp-body">{r.body}</p>
                </div>
              ))}
            </article>
          ))}
        </div>

        <div className="fbp-composer">
          {errMsg && (
            <div className="fbp-err" role="alert">
              <strong>Save failed.</strong> {errMsg}
              <button className="fbp-err-close" onClick={() => setErrMsg("")} aria-label="Dismiss">×</button>
            </div>
          )}
          <div className="fbp-ctx-preview" title="This comment will be tagged with the current view + screen">
            Posting on:
            {currentContext?.view     && <span className="ctx">{currentContext.view}</span>}
            {currentContext?.screen   && <span className="ctx">{currentContext.screen}</span>}
            {currentContext?.platform && <span className="ctx">{currentContext.platform}</span>}
            {currentContext?.version  && <span className="ctx">{currentContext.version}</span>}
            {pendingPin && (
              <span className="ctx" style={{ background: "#1f3a5a", color: "#9cc0ff" }}>
                📍 Pinned ({Math.round(pendingPin.x)}%, {Math.round(pendingPin.y)}%)
              </span>
            )}
          </div>
          <textarea
            rows="3"
            placeholder={cloudStore.enabled ? "Leave feedback for the team…" : "Cloud not configured — feedback won't be saved"}
            value={body}
            disabled={!cloudStore.enabled}
            onChange={(e) => setBody(e.target.value)} />
          <div className="fbp-composer-actions">
            <span className="fbp-as">As <strong>{actorName || "Anonymous"}</strong></span>
            <button className="fbp-send" onClick={submitTopLevel}
              disabled={!body.trim() || busy || !cloudStore.enabled}>
              {busy ? "Sending…" : "Post"}
            </button>
          </div>
        </div>
      </aside>
    </>
  );
}

function FeedbackBridge({ context, onClose }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [showToast, setShowToast] = useState(false);
  const ctxLine =
    "Prototype URL: " + (typeof window !== "undefined" ? window.location.href : "") +
    "\nView: " + (context.view || "—") +
    (context.screen   ? "\nScreen: "   + context.screen   : "") +
    (context.platform ? "\nPlatform: " + context.platform : "") +
    (context.version  ? "\nVersion: "  + context.version  : "");

  async function submit() {
    if (!text.trim()) return;
    setBusy(true);
    const payload =
      "Prototype feedback\n\n" + ctxLine + "\n\n— —\n" + text.trim();
    try {
      await navigator.clipboard.writeText(payload);
      setShowToast(true);
      setTimeout(() => {
        window.open("https://nmp-jira.atlassian.net/browse/JEA-1179?focusedCommentId=&focusedAddCommentDialog=true", "_blank", "noopener");
      }, 250);
      setTimeout(() => { onClose(); }, 1200);
    } catch (e) {
      // Fallback: open Jira with the comment in the URL hash for manual paste.
      window.open("https://nmp-jira.atlassian.net/browse/JEA-1179", "_blank", "noopener");
      onClose();
    }
  }

  return (
    <>
      {showToast && <div className="fb-toast">Copied to clipboard · Paste into the Jira comment box</div>}
      <div className="fb-backdrop" onClick={onClose} />
      <div className="fb-modal" role="dialog" aria-label="Leave feedback">
        <h2>Leave feedback</h2>
        <p className="lead">
          We'll copy your note to your clipboard and open <span className="ticket-pill">JEA-1179</span> in Jira.
          Paste into the comment box there to post — Jira will tag you as the author automatically.
        </p>
        <div className="fb-context">
          {context.view     && <span className="ctx"><span className="k">view:</span> {context.view}</span>}
          {context.screen   && <span className="ctx"><span className="k">screen:</span> {context.screen}</span>}
          {context.platform && <span className="ctx"><span className="k">platform:</span> {context.platform}</span>}
          {context.version  && <span className="ctx"><span className="k">version:</span> {context.version}</span>}
        </div>
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          autoFocus
          placeholder="What's working? What's confusing? Anything you'd ship differently?"
        />
        <div className="fb-actions">
          <button className="secondary" onClick={onClose} type="button">Cancel</button>
          <button className="primary" onClick={submit} disabled={!text.trim() || busy}>
            Copy & open in Jira
          </button>
        </div>
        <p className="footnote">
          Feedback lands on JEA-1179 in <strong>nmp-jira</strong>. You must be logged in to Jira to post.
        </p>
      </div>
    </>
  );
}

function AppShell({ fullscreen = false, authUser = null, onSignOut = null }) {
  const isMobile = useIsMobile();
  const [mobSheet, setMobSheet] = useState(false);
  const [feedbackOpen, setFeedbackOpen] = useState(false);
  // Pin mode for click-anywhere-to-comment overlay on the prototype.
  const [pinMode, setPinMode] = useState(false);
  // Pending pin: where the user clicked, waiting on the composer to submit.
  const [pendingPin, setPendingPin] = useState(null); // { x, y, surface }
  // Open-comment counts per view → small badges on the TopNav tabs.
  const [openCounts, setOpenCounts] = useState({});
  // Comments for the current screen (used to render existing pins).
  const [screenPins, setScreenPins] = useState([]);
  // Comment id → focus (for opening just that thread from a pin click).
  const [focusCommentId, setFocusCommentId] = useState(null);

  // Refresh comment counts + the pin-eligible list. Called on a 60s
  // timer, when the feedback panel closes, AND whenever the panel
  // commits a mutation (add/resolve/reopen). Resolved comments are
  // filtered out of BOTH the badge counts (server-side via .eq("resolved", false))
  // and the pin layer (client-side filter below).
  const [allPrototypeComments, setAllPrototypeComments] = useState([]);
  async function refreshCommentsAndCounts() {
    if (!cloudStore.enabled) return;
    const [counts, all] = await Promise.all([
      cloudStore.getOpenCommentCounts(),
      cloudStore.getComments(500),
    ]);
    setOpenCounts(counts);
    // Pins only render for unresolved comments — resolved threads
    // shouldn't litter the canvas with stale dots.
    setAllPrototypeComments(all.filter(c =>
      c.context && c.context.view === "Prototype" && c.context.pin && !c.resolved
    ));
  }
  useEffect(() => {
    if (!cloudStore.enabled) return;
    refreshCommentsAndCounts();
    const t = setInterval(refreshCommentsAndCounts, 60000);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  useEffect(() => {
    if (feedbackOpen) return;
    refreshCommentsAndCounts();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [feedbackOpen]);
  const [screenshotState, setScreenshotState] = useState("idle"); // idle | working | sent | fail

  function captureAndSendToMiro() {
    if (typeof window === "undefined" || !window.html2canvas) {
      setScreenshotState("fail");
      setTimeout(() => setScreenshotState("idle"), 2400);
      return;
    }

    setScreenshotState("working");

    const target =
      document.querySelector(".device-bezel") ||
      document.querySelector(".surface") ||
      document.body;

    // Build a Promise that resolves to the screenshot PNG blob.
    // html2canvas runs async, but we want to call clipboard.write
    // *synchronously* inside the click handler so the browser preserves
    // user-activation for the clipboard API. ClipboardItem accepts a
    // Promise as its value — the browser will hold the write open until
    // the blob resolves. This is the only reliable cross-browser pattern
    // for image-to-clipboard from inside a click.
    const blobPromise = window.html2canvas(target, {
      backgroundColor: null,
      scale: Math.min(window.devicePixelRatio || 1, 2),
      logging: false,
      useCORS: true,
      // Skip embedded iframes (Miro/Rive) — they don't render through canvas anyway.
      ignoreElements: (el) =>
        el.tagName === "IFRAME" ||
        el.classList.contains("kbd") ||
        el.classList.contains("fb-fab-tray"),
    }).then(canvas => new Promise(resolve => canvas.toBlob(resolve, "image/png")));

    // Synchronous clipboard.write with a Promise blob — keeps user activation.
    let clipboardSupported = false;
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        const item = new window.ClipboardItem({ "image/png": blobPromise });
        clipboardSupported = true;
        navigator.clipboard.write([item]).then(() => {
          setScreenshotState("sent");
          haptic("ok");
          // Stay visible longer so the user can read the next-step toast.
          setTimeout(() => setScreenshotState("idle"), 8000);
        }).catch((err) => {
          console.warn("[screenshot] clipboard.write rejected:", err);
          downloadFallback();
        });
      } catch (e) {
        console.warn("[screenshot] ClipboardItem unsupported:", e);
      }
    }
    if (!clipboardSupported) downloadFallback();

    async function downloadFallback() {
      try {
        const blob = await blobPromise;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "user-connect-feedback.png";
        document.body.appendChild(a); a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        setScreenshotState("downloaded");
        haptic("ok");
        setTimeout(() => setScreenshotState("idle"), 8000);
      } catch (e) {
        setScreenshotState("fail");
        setTimeout(() => setScreenshotState("idle"), 2400);
      }
    }
  }

  function openMiroBoard() {
    // Separate handler so the click that opens Miro is its own fresh
    // user-gesture (popup blockers are happy, and the user knows when
    // the tab will open).
    window.open(MIRO_BOARD_URL, "_blank", "noopener,noreferrer");
  }
  // In fullscreen mode we lock to the prototype view; everything else
  // (Tree, Matrix, Storymap, Handoff) is team chrome that doesn't belong
  // on a "scan to test on phone" experience.
  const [view, setView] = useState(fullscreen ? "prototype" : "prototype");
  const [storyVersion, setStoryVersion] = useState("all"); // all | mvp | v1 | v2
  const [version, setVersion] = useState("agentic"); // dev panel toggle: agentic | mvp | v1 | v2 — MVP (Agentic) is the default demo
  const [platform, setPlatform] = useState("ios"); // ios | android | web (toggle UI hidden for now)
  // Web sub-view: only relevant when platform === "web". "mobile" keeps the
  // phone-width responsive layout (FINN.no on a small viewport); "desktop"
  // breaks out of the iPhone frame and renders the side-drawer over the
  // full FINN.no desktop job ad — currently scoped to the agentic MVP.
  const [webMode, setWebMode] = useState("mobile"); // mobile | desktop
  const [lang, setLang] = useState("en"); // en (default) | no
  // Material-3 ripple on .press buttons when platform is Android. No-op on
  // iOS / Web — iOS keeps its scale-down press feedback.
  useAndroidRipple(platform);

  // Editable copies of the strategy data — drag-drop in the Storymap and
  // Impact-Effort views update these. Persistence is two-tier:
  //   1. localStorage  — always written, instant fallback / offline cache
  //   2. Supabase      — written debounced, shared with the whole team
  //                      (only active when SUPABASE_URL + key are set)
  // Bump SCHEMA when the shape changes (jira fields added, etc.) so stale
  // localStorage from older builds is discarded automatically.
  // v4 — added `agentic` slice to STORYMAP.stories (MVP Agentic separated
  //      from 1.0); added `release` tier field to SOLUTIONS.
  // v5 — opportunity tree is now editable team state (cloud-synced),
  //      shape: { business, outcome, problems, lastEdited }.
  // v6 — outcome now carries a `measurables` array (4 stacked KR cards
  //      replace the single inline meta line).
  // v7 — new OST: single lift target + measurablesMeta footnote;
  //      problem columns rewritten (Latency 32%, UX 43%, Tech Bugs);
  //      hypotheses + solutions replaced. Old cloud trees get reseeded.
  const SCHEMA = 7;
  const [stories, setStories] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-storymap-v") || "0", 10);
      const saved = localStorage.getItem("vend-storymap");
      if (saved && v === SCHEMA) {
        const parsed = JSON.parse(saved);
        // Belt-and-braces: even if SCHEMA matches, validate the actual
        // shape. localStorage can be re-poisoned by a stale cloud read,
        // which is what was leaving the MVP (Agentic) row empty.
        if (storiesAreCurrentShape(parsed)) return parsed;
      }
    } catch (_) {}
    return deepCloneJSON(STORYMAP.stories);
  });
  const [solutions, setSolutions] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-solutions-v") || "0", 10);
      const saved = localStorage.getItem("vend-solutions");
      if (saved && v === SCHEMA) {
        const parsed = JSON.parse(saved);
        if (solutionsAreCurrentShape(parsed)) return parsed;
      }
    } catch (_) {}
    return SOLUTIONS.map(s => ({ ...s }));
  });
  // Opportunity tree — now editable team state, persists across sessions
  // and syncs to Supabase. `lastEdited` is appended on every mutation so
  // the header can render "Last edited by X · Y ago".
  const [tree, setTree] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-tree2-v") || "0", 10);
      const saved = localStorage.getItem("vend-tree2");
      if (saved && v === SCHEMA) {
        const parsed = JSON.parse(saved);
        if (treeIsCurrentShape(parsed)) return parsed;
      }
    } catch (_) {}
    return deepCloneJSON(TREE_DATA);
  });
  // Edge cases ("Chaos cards") — same persistence pattern as tree.
  const [edges, setEdges] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-edges-v") || "0", 10);
      const saved = localStorage.getItem("vend-edges");
      if (saved && v === SCHEMA) {
        const parsed = JSON.parse(saved);
        if (edgesAreCurrentShape(parsed)) return parsed;
      }
    } catch (_) {}
    return deepCloneJSON(INITIAL_EDGES);
  });
  // Roadmap (Now/Next/Later storymap) — editable, drag-reorderable, cloud-synced.
  // Each card carries a stable `uid` for moving/removing; defaults seed uids
  // from their id + index. Shape guard: array of {uid, lane, step, tier}.
  const roadmapIsCurrentShape = (d) => Array.isArray(d) && d.every(c => c && c.uid && c.lane && typeof c.step === "number" && c.tier);
  const seedRoadmap = () => ROADMAP_CARDS.map((c, i) => ({ ...c, uid: c.id + "#" + i }));
  const [roadmapCards, setRoadmapCards] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("vend-roadmap2-v") || "0", 10);
      const saved = localStorage.getItem("vend-roadmap2");
      if (saved && v === SCHEMA) {
        const parsed = JSON.parse(saved);
        if (roadmapIsCurrentShape(parsed)) return parsed;
      }
    } catch (_) {}
    return seedRoadmap();
  });

  // Cloud sync status — shown in the dev panel + on the matrix/storymap.
  // 'off'      → no Supabase keys configured, local-only
  // 'loading'  → fetching shared state on mount
  // 'synced'   → cloud and local in sync
  // 'saving'   → write in flight
  // 'error'    → last write failed (we don't crash; local copy is still safe)
  const [cloudStatus, setCloudStatus] = useState(cloudStore.enabled ? "loading" : "off");
  const [cloudLastSyncedAt, setCloudLastSyncedAt] = useState(null);

  // Track whether the initial fetch has run; only after that do we start
  // writing to the cloud. Prevents a freshly-mounted page from immediately
  // overwriting shared state with its localStorage copy.
  const cloudReadyRef = useRef(false);

  // Load shared state from cloud on mount. If cloud has data, prefer it
  // over local. If cloud is empty (or has stale legacy shape), seed it
  // from defaults.
  //
  // Shape check: SCHEMA bumps only invalidate localStorage. Cloud-stored
  // data persists across SCHEMA bumps, so we explicitly check for
  // current-shape markers before adopting cloud values. (Helpers
  // storiesAreCurrentShape / solutionsAreCurrentShape are defined at
  // module scope so the useState initializer above can call them too —
  // localStorage can also become stale after a SCHEMA mismatch + bad
  // cloud overwrite cycle, so we shape-check both layers.)
  useEffect(() => {
    if (!cloudStore.enabled) return;
    let cancelled = false;
    (async () => {
      const [cloudStories, cloudSolutions] = await Promise.all([
        cloudStore.get("storymap"),
        cloudStore.get("matrix"),
      ]);
      if (cancelled) return;
      // Adopt cloud values only if they're the current shape — otherwise
      // the local defaults (which already have agentic + release fields)
      // win, and we re-seed the cloud so the next visitor gets fresh data.
      if (cloudStories && cloudStories.data && storiesAreCurrentShape(cloudStories.data)) {
        setStories(cloudStories.data);
      } else if (cloudStories && cloudStories.data) {
        // Stale shape — overwrite cloud with fresh defaults.
        await cloudStore.set("storymap", deepCloneJSON(STORYMAP.stories));
      }
      if (cloudSolutions && cloudSolutions.data && solutionsAreCurrentShape(cloudSolutions.data)) {
        setSolutions(cloudSolutions.data);
      } else if (cloudSolutions && cloudSolutions.data) {
        await cloudStore.set("matrix", SOLUTIONS.map(s => ({ ...s })));
      }
      // Opportunity tree — same legacy-shape guard.
      const cloudTree = await cloudStore.get("tree2");
      if (cancelled) return;
      if (cloudTree && cloudTree.data && treeIsCurrentShape(cloudTree.data)) {
        setTree(cloudTree.data);
      } else if (cloudTree && cloudTree.data) {
        await cloudStore.set("tree2", deepCloneJSON(TREE_DATA));
      }
      // Edge cases — same legacy-shape guard.
      const cloudEdges = await cloudStore.get("edges");
      if (cancelled) return;
      if (cloudEdges && cloudEdges.data && edgesAreCurrentShape(cloudEdges.data)) {
        setEdges(cloudEdges.data);
      } else if (cloudEdges && cloudEdges.data) {
        await cloudStore.set("edges", deepCloneJSON(INITIAL_EDGES));
      }
      // Roadmap — same legacy-shape guard.
      const cloudRoadmap = await cloudStore.get("roadmap2");
      if (cancelled) return;
      if (cloudRoadmap && cloudRoadmap.data && roadmapIsCurrentShape(cloudRoadmap.data)) {
        setRoadmapCards(cloudRoadmap.data);
      } else if (cloudRoadmap && cloudRoadmap.data) {
        await cloudStore.set("roadmap2", seedRoadmap());
      }
      // If cloud was completely empty, seed it from whatever we have locally.
      if (!cloudStories) await cloudStore.set("storymap", stories);
      if (!cloudSolutions) await cloudStore.set("matrix", solutions);
      if (!cloudTree) await cloudStore.set("tree2", tree);
      if (!cloudEdges) await cloudStore.set("edges", edges);
      if (!cloudRoadmap) await cloudStore.set("roadmap2", roadmapCards);
      cloudReadyRef.current = true;
      setCloudStatus("synced");
      setCloudLastSyncedAt(new Date());
    })();
    return () => { cancelled = true; };
    // Empty deps: this runs exactly once on mount.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Debounced cloud writers — bundle drag bursts into one save.
  const saveStoriesToCloud = useRef(
    debounce(async (next) => {
      if (!cloudStore.enabled || !cloudReadyRef.current) return;
      setCloudStatus("saving");
      const ok = await cloudStore.set("storymap", next);
      setCloudStatus(ok ? "synced" : "error");
      if (ok) setCloudLastSyncedAt(new Date());
    }, 600)
  ).current;
  const saveSolutionsToCloud = useRef(
    debounce(async (next) => {
      if (!cloudStore.enabled || !cloudReadyRef.current) return;
      setCloudStatus("saving");
      const ok = await cloudStore.set("matrix", next);
      setCloudStatus(ok ? "synced" : "error");
      if (ok) setCloudLastSyncedAt(new Date());
    }, 600)
  ).current;
  // Tree saves debounce at 400ms — a touch tighter than the storymap's 600ms
  // because text edits land character-by-character and we want the "saving…"
  // → "synced" indicator to feel snappy.
  const saveTreeToCloud = useRef(
    debounce(async (next) => {
      if (!cloudStore.enabled || !cloudReadyRef.current) return;
      setCloudStatus("saving");
      const ok = await cloudStore.set("tree2", next);

  // Persist tree on change — local immediate, cloud debounced.

      localStorage.setItem("vend-tree2-v", String(SCHEMA));

  // Persist edges on change — local immediate, cloud debounced.

  // Roadmap mutations — move (drag between lanes/steps), add, rename, remove, reset.
  function moveRoadmapCard(uid, lane, step) {
    setRoadmapCards(prev => prev.map(c => (c.uid === uid ? { ...c, lane, step } : c)));
    haptic("tap");
  }
  function addRoadmapCard(lane, step) {
    const uid = "rm-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
    setRoadmapCards(prev => [...prev, { uid, id: "•", title: "New initiative", tier: "Big Bet", owners: [], jira: null, lane, step }]);
    haptic("tap");
    return uid;
  }
  function editRoadmapTitle(uid, title) {
    setRoadmapCards(prev => prev.map(c => (c.uid === uid ? { ...c, title } : c)));
  }
  function removeRoadmapCard(uid) {
    setRoadmapCards(prev => prev.filter(c => c.uid !== uid));
    haptic("tap");
  }

    setRoadmapCards(seedRoadmap());

  // Derived feature flags (live across renders).
  const features = featuresInVersion(stories, version);

  const showTailoredCV  = features.has("tailored-cv");

  // "Who's editing" name — captured once and re-used for activity-log
  // attribution. With Google sign-in we seed this automatically from the
  // signed-in profile (display name → first name), so most users never
  // see the NamePrompt modal. localStorage stays as the cache layer.
  const [actorName, setActorName] = useState(() => {
    try { return localStorage.getItem("vend-actor") || ""; } catch (_) { return ""; }
  });
  // Seed from the authenticated Google profile the first time we see a
  // signed-in user. Prefer the display name's first token (cleaner for
  // attribution chips) and fall back to the local part of the email.
  useEffect(() => {
    if (actorName || !authUser) return;
    const meta = authUser.user_metadata || {};
    const fullName = meta.full_name || meta.name || meta.given_name || "";
    let candidate = (fullName.split(" ")[0] || "").trim();
    if (!candidate) {
      const email = authUser.email || "";
      candidate = email.split("@")[0] || "";
    }
    candidate = candidate.slice(0, 40);
    if (!candidate) return;
    setActorName(candidate);
    try { localStorage.setItem("vend-actor", candidate); } catch (_) {}
  }, [authUser, actorName]);
  const [namePromptOpen, setNamePromptOpen] = useState(false);
  const pendingActionRef = useRef(null);
  function ensureActor(thenRun) {
    if (actorName) { thenRun && thenRun(actorName); return; }
    setNamePromptOpen(true);
    // Re-run the action once a name is submitted.
    pendingActionRef.current = thenRun || null;
  }
  function submitActorName(name) {
    const clean = (name || "").trim().slice(0, 40);
    if (!clean) return;
    setActorName(clean);
    try { localStorage.setItem("vend-actor", clean); } catch (_) {}
    setNamePromptOpen(false);
    if (pendingActionRef.current) {
      const run = pendingActionRef.current;
      pendingActionRef.current = null;
      run(clean);
    }
  }

  // Drag-drop callbacks — each move logs an event (non-blocking) so the
  // team activity feed has history.
  function moveStory(taskId, fromRelease, idx, toRelease) {
    if (fromRelease === toRelease) return;
    ensureActor((who) => {
      let movedStoryLabel = null;
      setStories(prev => {
        const next = deepCloneJSON(prev);
        const task = next[taskId] || (next[taskId] = { mvp: [], v1: [], v2: [] });
        const src = task[fromRelease] || [];
        const moved = src.splice(idx, 1)[0];
        if (!moved) return prev;
        task[toRelease] = task[toRelease] || [];
        task[toRelease].push(moved);
        movedStoryLabel = moved.story || moved.jira || "story";
        return next;
      });
      if (movedStoryLabel && cloudStore.enabled) {
        cloudStore.logEvent({
          action: "move-story",
          actor: who,
          detail: { story: movedStoryLabel, from: fromRelease, to: toRelease, taskId },
        });
      }
    });
  }
  function moveSolution(n, impact, effort) {
    ensureActor((who) => {
      let label = null;
      setSolutions(prev => prev.map(s => {
        if (s.n === n) { label = s.title || ("Solution " + n); return { ...s, impact, effort }; }
        return s;
      }));
      if (label && cloudStore.enabled) {
        cloudStore.logEvent({
          action: "move-solution",
          actor: who,
          detail: { solution: label, n, impact, effort },
        });
      }
    });
  }
  function resetStorymap() {
    ensureActor((who) => {
      const fresh = deepCloneJSON(STORYMAP.stories);
      setStories(fresh);
      try { localStorage.removeItem("vend-storymap"); } catch (_) {}
      if (cloudStore.enabled) {
        cloudStore.set("storymap", fresh);
        cloudStore.logEvent({ action: "reset-storymap", actor: who });
      }
    });
  }
  function resetMatrix() {
    ensureActor((who) => {
      const fresh = SOLUTIONS.map(s => ({ ...s }));
      setSolutions(fresh);
      try { localStorage.removeItem("vend-solutions"); } catch (_) {}
      if (cloudStore.enabled) {
        cloudStore.set("matrix", fresh);
        cloudStore.logEvent({ action: "reset-matrix", actor: who });
      }
    });
  }

  // editTree — the universal mutator for opportunity-tree edits. Takes a
  // pure mutator function that receives a deep-cloned draft of the tree
  // and returns the new tree, plus an event descriptor for the activity
  // feed ({ action, detail }). ensureActor prompts for a name on first
  // edit so the activity log can attribute the change.
  function editTree(mutator, event) {
    ensureActor((who) => {
      setTree(prev => {
        const draft = deepCloneJSON(prev);
        const next = mutator(draft) || draft;
        // Tag the edit with author + timestamp so the header pill can
        // render "Last edited by Lee · 2 min ago" without us having to
        // dig through the activity log.
        next.lastEdited = { who, when: new Date().toISOString() };
        return next;
      });
      if (event && cloudStore.enabled) {
        cloudStore.logEvent({
          action: event.action || "edit-tree",
          actor: who,
          detail: event.detail || {},
        });
      }
    });
  }
  function resetTree() {
    ensureActor((who) => {
      const fresh = deepCloneJSON(TREE_DATA);
      setTree(fresh);
      try { localStorage.removeItem("vend-tree2"); } catch (_) {}
      if (cloudStore.enabled) {
        cloudStore.set("tree2", fresh);
        cloudStore.logEvent({ action: "reset-tree", actor: who });
      }
    });
  }

  // Edit + reset helpers for edge cases. Same actor + cloud-event pattern
  // as tree so the activity feed shows "X edited an edge case".
  function editEdges(mutator) {
    ensureActor((who) => {
      setEdges(prev => {
        const next = typeof mutator === "function" ? mutator(prev) : mutator;
        if (cloudStore.enabled) {
          cloudStore.logEvent({ action: "edit-edges", actor: who });
        }
        return next;
      });
    });
  }
  function resetEdges() {
    ensureActor((who) => {
      const fresh = deepCloneJSON(INITIAL_EDGES);
      setEdges(fresh);
      try { localStorage.removeItem("vend-edges"); } catch (_) {}
      if (cloudStore.enabled) {
        cloudStore.set("edges", fresh);
        cloudStore.logEvent({ action: "reset-edges", actor: who });
      }
    });
  }

  // Inspect mode — click any element on the iPhone to see its computed specs.
  const [inspect, setInspect] = useState(false);
  const [inspectInfo, setInspectInfo] = useState(null);
  function onStageClick(e) {
    if (!inspect) return;
    e.preventDefault();
    e.stopPropagation();
    const el = e.target;
    if (!el || el.nodeType !== 1) return;
    const cs = window.getComputedStyle(el);
    const rect = el.getBoundingClientRect();
    setInspectInfo({
      tag: el.tagName.toLowerCase(),
      cls: (el.className && typeof el.className === "string") ? el.className.slice(0, 60) : "",
      w: Math.round(rect.width),
      h: Math.round(rect.height),
      font: cs.fontFamily.split(",")[0].replace(/['"]/g, ""),
      size: cs.fontSize,
      weight: cs.fontWeight,
      color: cs.color,
      bg: cs.backgroundColor,
      pad: cs.padding,
      radius: cs.borderRadius,
      x: e.clientX, y: e.clientY,
    });
  }

  const [cvPickerActive, setCvPickerActive] = useState(false);

  const [magicMode, setMagicMode] = useState(false);
  const [magicStep, setMagicStep] = useState(0);
  const [magicSent, setMagicSent] = useState(false); // confirms a magic send for the confirmation copy
  const magicTimersRef = useRef([]);
  function cancelMagic() {
    magicTimersRef.current.forEach(clearTimeout);
    magicTimersRef.current = [];
  }
  function startMagicApply() {
    cancelMagic();
    setMagicMode(true);
    setMagicStep(0);
    setMagicSent(false);
    setUserState("ready");
    setLoadingPhase("ready");
    setOverlay(null);
    setScreen("preview");
    const rowCount = 4;
    const stepGap = 700; // ms between each row tick
    const warmup  = 700; // ms after sheet opens before first tick
    for (let i = 1; i <= rowCount; i++) {
      magicTimersRef.current.push(setTimeout(() => {
        setMagicStep(i);
        haptic("tap");
      }, warmup + (i - 1) * stepGap));
    }
    magicTimersRef.current.push(setTimeout(() => {
      haptic("ok");
      setApplicationStatus("sent");
      setMagicSent(true);
      setMagicMode(false);
      setMagicStep(0);
      setScreen("confirmation");
    }, warmup + rowCount * stepGap + 500));
  }
  useEffect(() => () => cancelMagic(), []);

  // Konami code easter egg → confetti shower + toast.
  // ↑ ↑ ↓ ↓ ← → ← → B A (the original sequence).
  const [eggFiring, setEggFiring] = useState(false);
  const eggBufferRef = useRef([]);
  useEffect(() => {
    const SEQUENCE = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown",
                      "ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
    function onKey(e) {
      // Ignore when typing into inputs so we don't hijack real typing.
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      eggBufferRef.current.push(e.key.length === 1 ? e.key.toLowerCase() : e.key);
      if (eggBufferRef.current.length > SEQUENCE.length) {
        eggBufferRef.current = eggBufferRef.current.slice(-SEQUENCE.length);
      }
      if (eggBufferRef.current.join(",") === SEQUENCE.join(",")) {
        eggBufferRef.current = [];
        haptic("ok");
        setEggFiring(true);
        setTimeout(() => setEggFiring(false), 3200);
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function openCV(params = {}) {
    setCvParams({
      initialSource: params.source || "profile",

  function startProgressiveLoad() {
    // Deliberate per-row pacing so each row visibly completes on its own:
    //   • t=0     — both CV + Letter show the spinner
    //   • t=950ms — CV lands (skeleton crossfades to "Synced from your profile")

    // gives the eye time to follow each row's completion instead of blurring
    // into one flash.
    setLoadingPhase("loading-cv");
    setTimeout(() => setLoadingPhase("loading-letter"), 950);
    setTimeout(() => setLoadingPhase("ready"), 2400);
  }

            onAdd={addRoadmapCard}
            onEditTitle={editRoadmapTitle}
            onRemove={removeRoadmapCard}
            onReset={resetRoadmap}
            cloudStatus={cloudStatus}
            cloudLastSyncedAt={cloudLastSyncedAt}
          />
        </div>
      )}
      {view === "handoff" && (
        <div key="handoff-view" style={{ animation: "fadeup 420ms var(--ease-modal)" }}>
          <HandoffView edges={edges} onEditEdges={editEdges} onResetEdges={resetEdges} />
        </div>
      )}
      {inspect && inspectInfo && (
        <div className="inspect-pop" style={{
          left: Math.min(inspectInfo.x + 14, window.innerWidth - 300),
          top:  Math.min(inspectInfo.y + 14, window.innerHeight - 200),
        }}>
          <span className="tag">{inspectInfo.tag}</span>
          <div><span className="key">size</span> <span className="val">{inspectInfo.w}×{inspectInfo.h}</span></div>
          <div><span className="key">font</span> <span className="val">{inspectInfo.font} · {inspectInfo.size} · {inspectInfo.weight}</span></div>
          <div><span className="key">color</span> <span className="val">{inspectInfo.color}</span></div>
          <div><span className="key">bg</span> <span className="val">{inspectInfo.bg}</span></div>
          <div><span className="key">padding</span> <span className="val">{inspectInfo.pad}</span></div>
          <div><span className="key">radius</span> <span className="val">{inspectInfo.radius}</span></div>
          {inspectInfo.cls && <div style={{ marginTop: 6, color: "#9eb3ff" }}>{inspectInfo.cls}</div>}
        </div>
      )}
      {eggFiring && (
        <>
          <div className="egg-overlay">
            <div style={{ position: "absolute", left: "50%", top: "50%", width: 0, height: 0 }}>
              <ConfettiBurst count={80} spread={420} gravity={520} />
            </div>
          </div>
          <div className="egg-toast">🎉 You found the easter egg!</div>
        </>
      )}
      {view === "prototype" && (
    <div className="layout">
      <LangCtx.Provider value={lang}>
      <div className={"stage" + (inspect ? " inspect-active" : "")} onClickCapture={onStageClick}>
        {/* Web · Desktop · MVP (Agentic) — break out of the iPhone Device
            frame and render the FINN.no shell + 600px ApplyDrawer. Other
            versions on desktop still render the phone frame for now and
            show a placeholder. */}
        {platform === "web" && webMode === "desktop" ? (
          version === "agentic" ? (
            <DesktopApplyScene onSend={send} />
          ) : (
            <div className="desktop-scene" style={{
              display: "flex", alignItems: "center", justifyContent: "center",
              flexDirection: "column", gap: 10, padding: 24,
              color: "#6b6b6b", textAlign: "center",
            }}>
              <h3 style={{ margin: 0, color: "#1d1d1d", fontSize: 22, letterSpacing: -0.3 }}>
                Desktop view — coming with MVP (Agentic)
              </h3>
              <p style={{ margin: 0, maxWidth: 520, lineHeight: 1.5 }}>
                Switch the Version dropdown to <strong>MVP (Agentic)</strong> to preview the
                desktop apply drawer. Easy Apply desktop is queued for a later release.
              </p>
            </div>
          )
        ) : (
        <Device platform={platform}>
          <div style={{
            position: "absolute", inset: 0,
            display: "flex", flexDirection: "column",
            color: "#1d1d1d",
          }}>
            {bodyScreen}
          </div>

          {screen === "preview" && (
            <ApplicationPreviewSheet
              job={JOB}
              state={userState}
              loadingPhase={loadingPhase}
              version={version}
              magicMode={magicMode}
              magicStep={magicStep}
              showJobMatch={showJobMatch}
              onClose={() => { cancelMagic(); setMagicMode(false); setScreen("jobad"); }}
              onSend={send}
              onOpenLetter={() => setOverlay("letter")}
              onOpenCV={() => openCV({ source: "profile" })}
              onOpenEdit={(rowId) => {
                if (rowId === "cv") setCvPickerActive(true);
                setOverlay("edit:" + rowId);
              }}
              onOpenActivity={() => openActivity("drafts")}
              onFillMissing={() => {
                const rowId = userState === "missing-personalia" ? "personalia"
                            : userState === "missing-cv" ? "cv"
                            : "questions";
                if (rowId === "cv") setCvPickerActive(true);
                setOverlay("edit:" + rowId);
              }}
            />
          )}
          {screen === "agentic-review" && (
            <AgenticReviewScreen
              job={JOB}
              onClose={() => setScreen("jobad")}
              onSend={send}
              userState={userState}
              initialSection={userState === "slow-load" ? "personalia" : null}
              // No onOpenCV/onOpenLetter — the agentic flow now drills into
              // CV picker/preview and Cover letter/saved-letters via an
              // internal page stack inside the Vedlegg section sheet. The
              // App-level EditSheet / CoverLetterSheet / SelectLetterSheet
              // / CVPreviewSheet overlays are still wired for the Easy
              // Apply flow only.
            />
          )}
          {overlay === "letter" && (
            <CoverLetterSheet
              onClose={() => setOverlay(null)}
              onOpenSelectFile={() => setOverlay("select-letter")}
            />
          )}
          {overlay === "login" && (
            <LoginSheet
              onClose={() => setOverlay(null)}
              onLogin={mockLogin}
            />
          )}
          {screen === "confirmation" && (
            <ConfirmationScreen
              job={JOB}
              onDone={() => openActivity("sent")}
              onReset={reset}
              magic={magicSent}
            />
          )}
          {overlay === "select-letter" && (
            <SelectLetterSheet
              onClose={() => setOverlay("letter")}
              onPick={() => setOverlay(null)}
            />
          )}
          {/* Picker stays mounted under CV preview so 'Back' from the preview
              reveals it instantly — no slide-up re-mount jump. */}
          {((overlay && overlay.startsWith("edit:")) ||
            (overlay === "cv-preview" && cvPickerActive)) && (
            <EditSheet
              rowId={
                overlay && overlay.startsWith("edit:")
                  ? overlay.split(":")[1]
                  : "cv"
              }
              showTailoredCV={showTailoredCV}
              version={version}
              onClose={() => {
                const rowId = (overlay && overlay.startsWith("edit:"))
                  ? overlay.split(":")[1] : "cv";
                if (userState === `missing-${rowId}`) setUserState("ready");
                setCvPickerActive(false);
                setOverlay(null);
              }}
              onOpenCV={(params) => openCV(params)}
            />
          )}
          {overlay === "cv-preview" && (
            <CVPreviewSheet
              onClose={() => { setCvPickerActive(false); setOverlay(null); }}
              onBack={() => setOverlay("edit:cv")}
              onCommit={() => { setCvPickerActive(false); setOverlay(null); }}
              initialSource={cvParams.initialSource}
              uploadMode={cvParams.uploadMode}
            />
          )}
          {/* Click-anywhere comment overlay — sits on top of the device.
              Only captures clicks when pinMode is on; otherwise pins are
              still clickable but the layer is pointer-events: none. */}
          <PinLayer
            pinMode={pinMode}
            pendingPin={pendingPin}
            pinnedComments={allPrototypeComments.filter(c => {
              const ctx = c.context || {};
              return (
                ctx.screen   === currentScreenLabel(view, screen, overlay, magicMode, loadingPhase) &&
                ctx.platform === currentPlatformLabel(platform) &&
                ctx.version  === currentVersionLabel(version)
              );
            })}
            onAddPin={(p) => {
              setPendingPin({ ...p, surface: "device" });
              setFeedbackOpen(true);
            }}
            onOpenPin={(id) => {
              setFocusCommentId(id);
              setFeedbackOpen(true);
            }}
          />
        </Device>
        )}
      </div>
      </LangCtx.Provider>

      {isMobile && !mobSheet && (
        <button className="mob-fab" onClick={() => { haptic("tap"); setMobSheet(true); }}
          aria-label="Open dev controls">
          <Icon name="edit" size={22} color="#fff" stroke={2.2} />
        </button>
      )}
      {isMobile && mobSheet && (
        <div className="mob-sheet-back" onClick={() => setMobSheet(false)} />
      )}
      <div
        className={"dev-panel" + (isMobile && !mobSheet ? " dev-panel-mobile-hidden" : "")}
        style={isMobile ? {
          position: "fixed", left: 0, right: 0, bottom: 0,
          top: "auto", maxHeight: "82vh", zIndex: 130,
          borderRadius: "22px 22px 0 0",
          margin: 0, padding: "12px 18px 24px",
          paddingBottom: "max(24px, env(safe-area-inset-bottom))",
          overflowY: "auto",
          animation: mobSheet ? "slideup 440ms var(--ease-modal)" : undefined,
        } : undefined}>
        {isMobile && (
          <>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <div style={{ width: 40, height: 5, borderRadius: 9999, background: "#444", margin: "4px auto 0" }} />
              <button onClick={() => setMobSheet(false)}
                style={{ position: "absolute", top: 12, right: 14,
                  width: 28, height: 28, borderRadius: 9999, background: "#333", border: 0,
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  cursor: "pointer" }}
                aria-label="Close">
                <Icon name="x" size={14} color="#ededed" stroke={2.4} />
              </button>
            </div>
          </>
        )}
        <h3>Easy + Agentic apply</h3>

        <div className="dev-group">
          <p className="dev-group-title">Project setup</p>
          <Segmented
            label="Language"
            valueLabel={lang === "en" ? "English" : "Norsk Bokmål"}
            value={lang}
            onChange={setLang}
            options={[
              { id: "en", label: "EN" },
              { id: "no", label: "NO" },
            ]} />
          <Segmented
            label="Platform"
            badge="Beta"
            valueLabel={platform === "ios" ? "iOS HIG" : platform === "android" ? "Material 3" : "Web"}
            value={platform}
            onChange={setPlatform}
            options={[
              { id: "ios",     label: "iOS",     icon: <AppleGlyph /> },
              { id: "android", label: "Android", icon: <AndroidGlyph /> },
              { id: "web",     label: "Web",     icon: <GlobeGlyph /> },
            ]} />
          {/* Web sub-toggle: Mobile (responsive web in phone frame) vs
              Desktop (full-viewport FINN.no shell with 600px right drawer).
              Only shown when Platform is Web. */}
          {platform === "web" && (
            <Segmented
              label="Web view"
              valueLabel={webMode === "desktop" ? "Desktop" : "Mobile"}
              value={webMode}
              onChange={setWebMode}
              options={[
                { id: "mobile",  label: "Mobile"  },
                { id: "desktop", label: "Desktop" },
              ]} />
          )}
        </div>

        <div className="dev-group">
          <p className="dev-group-title">Demo state</p>
          <Dropdown
            label="Version"
            value={version}
            lang={lang}
            onChange={(id) => {
              // Switching version is a big context shift — reset to the job
              // ad as the canonical entry point so the demo starts cleanly
              // every time. We keep `userState` so you can compare how the
              // same scenario (e.g. missing-cv) renders across versions.
              setVersion(id);
              cancelMagic();
              setMagicMode(false);
              setMagicStep(0);
              setMagicSent(false);
              setOverlay(null);
              setLoadingPhase("ready");
              setCvPickerActive(false);
              setApplicationStatus("draft");
              setScreen("jobad");
            }}
            options={[
              { id: "agentic", label: "MVP (Agentic)" },
              { id: "mvp",     label: "1.0 (Easy Apply)" },
              { id: "v1",      label: "1.2 (Easy Apply)" },
              { id: "v2",      label: "2.0 (YOLO mode)" },
            ]}
          />
          <Dropdown
            label="User state"
            value={userState}
            lang={lang}
            onChange={(id) => {
              setUserState(id);
              setOverlay(null);
              if (id === "already-applied") setScreen("jobad");
              if (id === "not-logged-in") { setScreen("jobad"); setOverlay("login"); }
              // Slow load self-manages its own staged timers on mount —
              // just drop the user straight into the preview sheet.
              // Slow load = view the co-draft Personal-details editor (Figma 952/962):
              // open the agentic review with the personalia section sheet up.
              if (id === "slow-load") { cancelMagic(); setMagicMode(false); setVersion("agentic"); setScreen("agentic-review"); }
              // Backend errors only matter inside the apply flow — drop the
              // user straight onto agentic review so they see the banner.
              if (id === "prepare-error" || id === "send-error") {
                setScreen("agentic-review");
              }
            }}
            options={USER_STATES}
          />
          <div className="controls-group">
            <div
              className={"dev-toggle" + (inspect ? " on" : "")}
              role="switch"
              aria-checked={inspect}
              tabIndex={0}
              onClick={() => { setInspect(v => !v); setInspectInfo(null); }}
              onKeyDown={(e) => {
                if (e.key === " " || e.key === "Enter") {
                  e.preventDefault();
                  setInspect(v => !v); setInspectInfo(null);
                }
              }}>
              <span className="label">Inspect mode</span>
              <span className="switch" aria-hidden="true" />
            </div>
            <p className="hint" style={{ marginTop: 6 }}>
              {inspect
                ? "Click any element on the iPhone to inspect specs."
                : "Tap to enable inline spec inspection."}
            </p>
          </div>
        </div>

        <p className="hint">Tap through the iPhone to navigate. Haptic feedback runs on supported devices.</p>
        <p className="hint" style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #2e2e2e" }}>
          For engineers: open the <strong>Handoff</strong> tab for site map, tokens, motion timings, and platform mapping.
        </p>
        {authUser && onSignOut && (
          <div className="dev-auth">
            <div className="dev-auth-row">
              <div className="dev-auth-avatar" aria-hidden="true">
                {((authUser.user_metadata && (authUser.user_metadata.full_name || authUser.user_metadata.name)) || authUser.email || "?")
                  .slice(0, 1).toUpperCase()}
              </div>
              <div className="dev-auth-meta">
                <p className="dev-auth-name">
                  {(authUser.user_metadata && (authUser.user_metadata.full_name || authUser.user_metadata.name)) || authUser.email}
                </p>
                <p className="dev-auth-email">{authUser.email}</p>
              </div>
              <button className="dev-auth-out" onClick={onSignOut}>Sign out</button>
            </div>
          </div>
        )}
      </div>
    </div>
      )}

      {/* Floating tray, bottom-left.
          - "Add a comment" → pin mode on Prototype, panel on other views.
          - "Open on phone" → QR modal so a teammate can scan and test on
            their actual device.
          To READ existing feedback, click the red count badge on any tab. */}
      <div className="fb-fab-tray">
        <button
          className={"fb-fab fb-fab-pin" + (pinMode ? " active" : "")}
          onClick={() => {
            if (view === "prototype") {
              setPinMode(p => !p);
              setPendingPin(null);
            } else {
              setFeedbackOpen(true);
            }
          }}
          aria-pressed={view === "prototype" ? pinMode : undefined}
          aria-label={view === "prototype" ? "Toggle pin-on-screen comment mode" : "Open feedback panel"}>
          <span className="icon" aria-hidden="true">{pinMode ? "📍" : "💬"}</span>
          {pinMode
            ? "Click anywhere on the prototype to pin"
            : "Add a comment"}
        </button>
        <QrModal trigger={(open) => (
          <button className="fb-fab fb-fab-qr" onClick={open}
            aria-label="Open this prototype on a phone">
            <span className="icon" aria-hidden="true">📱</span>
            Open prototype on phone
          </button>
        )} />
      </div>
      <FeedbackPanel
        open={feedbackOpen}
        onClose={() => {
          setFeedbackOpen(false);
          setPendingPin(null);
          setFocusCommentId(null);
          setPinMode(false);
        }}
        actorName={actorName}
        ensureActor={ensureActor}
        pendingPin={pendingPin}
        focusCommentId={focusCommentId}
        onCommentsChanged={refreshCommentsAndCounts}
        currentContext={{
          view:
            view === "prototype" ? "Prototype" :
            view === "tree"      ? "Opportunity tree" :
            view === "matrix"    ? "Impact–Effort" :
            view === "storymap"  ? "Storymap" :
            view === "handoff"   ? "Handoff" : view,
          screen:
            view === "prototype"
              ? (overlay
                  ? "Overlay: " + overlay
                  : screen === "preview" && magicMode ? "Preview · Magic Apply"
                  : screen === "preview" && loadingPhase !== "ready" ? "Preview · loading"
                  : screen === "preview" ? "Preview · ready"
                  : screen)
              : null,
          platform: view === "prototype"
            ? (platform === "ios" ? "iOS" : platform === "android" ? "Android" : "Web")
            : null,
          version: view === "prototype"
            ? currentVersionLabel(version)
            : null,
        }}
      />
    </>
  );
}

function NavBtn({ active, onClick, children }) {
  return (
    <button className={active ? "active" : ""} onClick={onClick}>{children}</button>
  );
}

// Tiny platform glyphs for the toggle
const AppleGlyph = () => (
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
  </svg>
);
const AndroidGlyph = () => (
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M17.6 9.48l1.84-3.18a.5.5 0 0 0-.18-.68.5.5 0 0 0-.69.18l-1.86 3.21a11.4 11.4 0 0 0-9.34 0L5.51 5.8a.5.5 0 0 0-.69-.18.5.5 0 0 0-.18.68L6.48 9.48C3.38 11.25 1.36 14.44 1.08 18h21.84c-.28-3.56-2.3-6.75-5.32-8.52zM7.08 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
  </svg>
);
const GlobeGlyph = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18"/>
    <path d="M12 3a13 13 0 0 1 0 18M12 3a13 13 0 0 0 0 18"/>
  </svg>
);

function Segmented({ label, valueLabel, options, value, onChange, badge }) {
  const idx = Math.max(0, options.findIndex(o => o.id === value));
  const count = options.length;
  return (
    <div className="controls-group">
      <div className="controls-label">
        <span style={{ display: "inline-flex", alignItems: "center" }}>
          {label}
          {badge && <span className="beta-pill">{badge}</span>}
        </span>
        {valueLabel && <span className="value">{valueLabel}</span>}
      </div>
      <div className="seg" role="tablist" aria-label={label}>
        <div className="seg-indicator" style={{
          left: `calc(3px + ${idx} * ((100% - 6px) / ${count}))`,
          width: `calc((100% - 6px) / ${count})`,
        }} />
        {options.map(o => (
          <button
            key={o.id}
            role="tab"
            aria-selected={value === o.id}
            className={value === o.id ? "active" : ""}
            onClick={() => onChange(o.id)}>
            {o.icon}
            <span>{o.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
